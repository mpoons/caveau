}
const shrinks = (van, naar) => van >= 5 && naar < Math.max(1, Math.ceil(van * 0.2)); /* >80% zou verdwijnen */

function askShrink(mode, remote, lc, rc){
  lastSyncNote = 'Wacht op jouw keuze — groot verschil tussen versies';
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
  const done = async () => { const c = cloud(); c.lastSync = Date.now(); save(true); lastSyncNote = '';
    toast('Gesynchroniseerd ✓'); if(UI.tab === 'meer' && UI.meerPage === 'account') render(); };
  openSheet(`${sheetHead('Even opletten')}
    <p style="font-size:14px;color:var(--ink2)">${mode === 'adopt'
      ? `De cloudversie bevat <b>${rc}</b> ${plur(rc,'wijn','wijnen')}, terwijl hier <b>${lc}</b> staan. Dat kan kloppen (bijvoorbeeld na "Alles wissen" op een ander apparaat), maar het kan ook een vergissing zijn — daarom neem ik dit niet stilzwijgend over.`
      : `Dit apparaat heeft <b>${lc}</b> ${plur(lc,'wijn','wijnen')}, de cloud <b>${rc}</b>. Doorzetten zou de cloudversie overschrijven.`}</p>
    <div class="btnrow mt14">
      <button class="btn ghost" id="shrinkKeep">${mode === 'adopt' ? `Behoud mijn ${lc}` : `Cloud (${rc}) overnemen`}</button>
      <button class="btn danger" id="shrinkGo">${mode === 'adopt' ? `Cloud (${rc}) overnemen` : `Toch pushen (${lc})`}</button>
    </div>
    <p class="small mt8">Wat je ook kiest: je huidige stand wordt eerst als lokale reservekopie bewaard (Instellingen → Reservekopieën).</p>`);
  document.getElementById('shrinkGo').onclick = async () => { closeSheet();
    try{
      if(mode === 'adopt'){ await applyRemote(remote); }
      else { snapshotLocal('caveau_backup_prev'); await pushDoc(); await pushPhotos(); }
      await done();
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt — ' + lastSyncNote); }
  };
  document.getElementById('shrinkKeep').onclick = async () => { closeSheet();
    try{
      if(mode === 'adopt'){ snapshotLocal('caveau_backup_prev'); S.rev = Date.now(); save(true); await pushDoc(); await pushPhotos(); }
      else { await applyRemote(remote); }
      await done();
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt — ' + lastSyncNote); }
  };
}

async function syncNow(interactive){
  if(!loggedIn()) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  try{
    if(!sbAccess){ const ok = await sbRefresh(); if(!ok) throw new Error('Sessie verlopen — log opnieuw in'); }
    const remote = await pullDoc();
    const localRev = S.rev||0, remoteRev = (remote && remote.rev)||0;
    const lc = S.wines.length, rc = remote ? (remote.wines||[]).length : 0;
    if(remoteRev > localRev){
      if(shrinks(lc, rc)){ syncBusy = false; askShrink('adopt', remote, lc, rc); return; }
      await applyRemote(remote);
    } else if(localRev > remoteRev || !remote){
      if(remote && shrinks(rc, lc)){ syncBusy = false; askShrink('push', remote, lc, rc); return; }
      await pushDoc(); await pushPhotos();
    }
    const c = cloud(); c.lastSync = Date.now(); save(true);
    lastSyncNote = '';
    if(interactive) toast('Gesynchroniseerd ✓');
  }catch(e){
    lastSyncNote = String(e.message||e).slice(0,110);
    if(interactive) toast('Sync mislukt — ' + lastSyncNote, null, null, 6000);
  }
  syncBusy = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
}

/* foto's incrementeel */
async function pushPhotos(){
  try{
    const rows = await sbFetch('/rest/v1/photos?select=id', {method:'GET'});
    const have = new Set((rows||[]).map(r => r.id));
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(w.photo && !have.has(w.id)){
        const p = await pGet(w.id);
        if(p) await sbFetch('/rest/v1/photos?on_conflict=user_id,id', {method:'POST',
          headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify([{user_id: cloud().uid, id: w.id, data: p}])});
      }
    }
  }catch(e){}
}
async function pullPhotos(){
  try{
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(w.photo && !(await pGet(w.id))){
        const rows = await sbFetch('/rest/v1/photos?select=data&id=eq.' + w.id, {method:'GET'});
        if(rows && rows[0] && rows[0].data) await pSet(w.id, rows[0].data);
      }
    }
    fillPhotos();
  }catch(e){}
}
function cloudDeletePhoto(id){
  if(!loggedIn()) return;
  sbFetch('/rest/v1/photos?id=eq.' + id, {method:'DELETE', headers:{'prefer':'return=minimal'}}).catch(()=>{});
}

/* hook — aangeroepen vanuit save() */
function cloudOnSave(){
  if(!loggedIn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 2500);
}

/* ================= account-pagina ================= */

  if(!CLOUD_OK)
    return `${brandRow('')}${backRow}<div class="eyebrow">Account</div><h2 class="h2">Cloud-sync</h2>
      <div class="banner"><span>🔒</span><span>Sync is niet beschikbaar in deze omgeving — gebruik de app via <b>mpoons.github.io/caveau</b>.</span></div>`;
  if(!loggedIn()){
    return `${brandRow('')}${backRow}<div class="eyebrow">Account</div><h2 class="h2">Cloud-sync aanzetten</h2>
      <p class="small mb8">Log in en je kelder synchroniseert automatisch tussen al je apparaten. Nog geen account? Kies een wachtwoord en tik op "Account aanmaken".</p>
      <div class="field"><label>E-mail</label><input class="inp" id="ac_email" type="email" autocomplete="username" inputmode="email" value="${esc(c.email||'')}" placeholder="jij@voorbeeld.nl"></div>
      <div class="field"><label>Wachtwoord</label><input class="inp" id="ac_pass" type="password" autocomplete="current-password" placeholder="minimaal 8 tekens"></div>
      <button class="btn" data-act="acLogin" style="margin-bottom:9px">Inloggen</button>
      <button class="btn ghost" data-act="acSignup">Account aanmaken</button>
      <p class="small mt8">Laat je telefoon het wachtwoord in de sleutelhanger bewaren, dan is het eenmalig. Je AI-sleutel en foto's van etiketten blijven van jou; alleen jíj kunt bij je kelder.</p>`;
  }
  const last = c.lastSync ? new Date(c.lastSync).toLocaleString('nl-NL', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : 'nog niet';
  return `${brandRow('')}${backRow}<div class="eyebrow">Account</div><h2 class="h2">Cloud-sync actief</h2>
    <div class="panel"><div class="rowline"><span class="a">
      <div class="t" style="font-family:var(--sans)">${esc(c.email||'')}</div>
      <div class="u">Laatste sync: ${esc(last)}${syncBusy?' · bezig…':''}${lastSyncNote?` · ⚠️ ${esc(lastSyncNote)}`:''}</div>
    </span></div></div>
    <button class="btn mt14" data-act="acSync">Nu synchroniseren</button>
    <button class="btn plain" data-act="acLogout" style="margin-top:9px">Uitloggen op dit apparaat</button>
    <p class="small mt8">Elke wijziging gaat een paar seconden later automatisch naar de cloud; bij het openen wordt de nieuwste versie opgehaald. Uitloggen verwijdert niets.</p>`;
}
ACT.acLogin = el => acAuth(el, false);
ACT.acSignup = el => acAuth(el, true);
async function acAuth(el, isNew){
  const email = ((document.getElementById('ac_email')||{}).value||'').trim().toLowerCase();
  const pass = (document.getElementById('ac_pass')||{}).value||'';
  if(!/.+@.+\..+/.test(email)){ toast('Vul een geldig e-mailadres in'); return; }
  if(pass.length < 8){ toast('Gebruik een wachtwoord van minimaal 8 tekens'); return; }
  const orig = el.textContent; el.textContent = 'Even geduld…'; el.style.pointerEvents = 'none';
  try{
    const r = isNew ? await sbSignup(email, pass) : await sbLogin(email, pass);
    if(r === 'confirm'){
      toast('Bevestig je account via je mail — of log in als je al een account had', null, null, 7000);
    } else {
      toast('Ingelogd — synchroniseren…');
      render();
      await syncNow(true);
      return;
    }
  }catch(e){
    const m = String(e.message||'');
    toast(/invalid|credentials/i.test(m) ? 'Onjuiste inloggegevens' : 'Lukte niet — ' + m.slice(0,90), null, null, 6000);
  }
  el.textContent = orig; el.style.pointerEvents = '';
}
ACT.acSync = () => syncNow(true);
ACT.acLogout = () => confirmSheet('Uitloggen?', 'Je kelder blijft lokaal én in de cloud bewaard; dit apparaat synchroniseert alleen niet meer.', 'Log uit', () => { sbLogout(); render(); toast('Uitgelogd'); });

/* init: dagelijkse reservekopie (vóór de eerste sync) + bestaande sessie hervatten */
(function(){
  try{
    const k = 'caveau_backup_daily', today = new Date().toISOString().slice(0,10);
    const prev = JSON.parse(localStorage.getItem(k)||'null');
    if((S.wines.length || S.history.length) && (!prev || prev.day !== today)) snapshotLocal(k, {day:today});
  }catch(e){}
})();
if(loggedIn()) syncNow();
</script>
