<body>
<title>Caveau — wijnkelder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<style>
/* ============ Caveau — crème & bordeaux ============ */
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --card2:#F4EDE0; --sheet:#FFFDF8;
  --ink:#2B2126; --ink2:#6E5F66; --ink3:#9A8A91;
  --line:#E8DECD; --line2:#F0E9DA;
  --acc:#7D2A3C; --acc-deep:#5E1F2E; --acc-soft:#F3E3E6; --acc-ink:#7D2A3C;
  --gold:#B08A47; --gold-ink:#8A6930;
  --btn-bg:#7D2A3C; --btn-ink:#FFF7F2; --fab1:#7D2A3C; --fab2:#5E1F2E;
  --ok:#3E7C4F; --ok-bg:#E6EFE4; --warn:#A26E10; --warn-bg:#F6EBD2;
  --bad:#A63D2F; --bad-bg:#F6E2DD; --info:#56718C; --info-bg:#E6EBF1;
  --neut:#8A7E71; --neut-bg:#EEE8DB;
  --t-rood:#8E3347; --t-wit:#A5851B; --t-rose:#C96A7C;
  --t-mous:#2E7B40; --t-zoet:#CE8330; --t-vers:#83420F;
  --bar:#8E3347; --bar-track:#F1E9DA;
  --shadow:0 1px 2px rgba(43,33,38,.05),0 6px 24px rgba(43,33,38,.06);
  --shadow-lg:0 -8px 40px rgba(43,33,38,.18);
  --serif:'Iowan Old Style','Palatino Nova',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1F1216; --card:#2A1A20; --card2:#342128; --sheet:#2E1C23;
    --ink:#F1E7E0; --ink2:#C7B3BA; --ink3:#937F87;
    --line:#3E2A33; --line2:#35232C;
    --acc:#D98E9C; --acc-deep:#E8AEB8; --acc-soft:#43262E; --acc-ink:#DE97A4;
    --gold:#C9A468; --gold-ink:#CBA96E;
    --btn-bg:#97374C; --btn-ink:#FFEFF1; --fab1:#A84158; --fab2:#7A2B3C;
    --ok:#7FB98B; --ok-bg:#243627; --warn:#D9A84E; --warn-bg:#3D3123;
    --bad:#D98874; --bad-bg:#42261F; --info:#93AECB; --info-bg:#25303C;
    --neut:#A79A8C; --neut-bg:#342A2E;
    --t-rood:#C87083; --t-wit:#A98A24; --t-rose:#D06880;
    --t-mous:#27803C; --t-zoet:#C97C1E; --t-vers:#9C4A3C;
    --bar:#C87083; --bar-track:#3A262E;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --bg:#FAF6EF; --card:#FFFFFF; --card2:#F4EDE0; --sheet:#FFFDF8;
  --ink:#2B2126; --ink2:#6E5F66; --ink3:#9A8A91;
  --line:#E8DECD; --line2:#F0E9DA;
  --acc:#7D2A3C; --acc-deep:#5E1F2E; --acc-soft:#F3E3E6; --acc-ink:#7D2A3C;
  --gold:#B08A47; --gold-ink:#8A6930;
  --btn-bg:#7D2A3C; --btn-ink:#FFF7F2; --fab1:#7D2A3C; --fab2:#5E1F2E;
  --ok:#3E7C4F; --ok-bg:#E6EFE4; --warn:#A26E10; --warn-bg:#F6EBD2;
  --bad:#A63D2F; --bad-bg:#F6E2DD; --info:#56718C; --info-bg:#E6EBF1;
  --neut:#8A7E71; --neut-bg:#EEE8DB;
  --t-rood:#8E3347; --t-wit:#A5851B; --t-rose:#C96A7C;
  --t-mous:#2E7B40; --t-zoet:#CE8330; --t-vers:#83420F;
  --bar:#8E3347; --bar-track:#F1E9DA;
  --shadow:0 1px 2px rgba(43,33,38,.05),0 6px 24px rgba(43,33,38,.06);
  --shadow-lg:0 -8px 40px rgba(43,33,38,.18);
}
:root[data-theme="dark"]{
  --bg:#1F1216; --card:#2A1A20; --card2:#342128; --sheet:#2E1C23;
  --ink:#F1E7E0; --ink2:#C7B3BA; --ink3:#937F87;
  --line:#3E2A33; --line2:#35232C;
  --acc:#D98E9C; --acc-deep:#E8AEB8; --acc-soft:#43262E; --acc-ink:#DE97A4;
  --gold:#C9A468; --gold-ink:#CBA96E;
  --btn-bg:#97374C; --btn-ink:#FFEFF1; --fab1:#A84158; --fab2:#7A2B3C;
  --ok:#7FB98B; --ok-bg:#243627; --warn:#D9A84E; --warn-bg:#3D3123;
  --bad:#D98874; --bad-bg:#42261F; --info:#93AECB; --info-bg:#25303C;
  --neut:#A79A8C; --neut-bg:#342A2E;
  --t-rood:#C87083; --t-wit:#A98A24; --t-rose:#D06880;
  --t-mous:#27803C; --t-zoet:#C97C1E; --t-vers:#9C4A3C;
  --bar:#C87083; --bar-track:#3A262E;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 24px rgba(0,0,0,.25);
  --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#app{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* ---------- header ---------- */
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 14px}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:.01em;color:var(--ink)}
.brand .dot{color:var(--acc)}
.hdr-sub{font-size:12.5px;color:var(--ink2)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.h2{font-family:var(--serif);font-size:21px;margin:4px 0 10px}
.sect{margin-top:22px}
/* ---------- search & chips ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink3)}
.search svg{flex:none;color:var(--ink3)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:10px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.chip .tdot{width:8px;height:8px}
.chip.on .tdot{outline:1.5px solid rgba(255,247,242,.85);outline-offset:1px}
/* ---------- wijnkaart ---------- */
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.wthumb{flex:none;width:52px;border-radius:9px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;min-height:68px;position:relative}
.wthumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.wthumb svg{color:var(--ink3);opacity:.8}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.wname{font-family:var(--serif);font-size:16.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wsub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.wside{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;padding:2px 0}
.wtap{display:flex;gap:12px;flex:1;min-width:0;align-items:stretch;text-align:left}
.dbtn{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.dbtn:active{transform:scale(.92)}
.qty{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink);background:var(--card2);border-radius:8px;padding:3px 8px}
.wloc{font-size:11px;color:var(--ink3);max-width:90px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tlabel{font-size:12px;color:var(--ink2)}
.t-rood{background:var(--t-rood)} .t-wit{background:var(--t-wit)} .t-rose{background:var(--t-rose)}
.t-mousserend{background:var(--t-mous)} .t-zoet{background:var(--t-zoet)} .t-versterkt{background:var(--t-vers)}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-op{background:var(--ok-bg);color:var(--ok)}
.b-nu{background:var(--warn-bg);color:var(--warn)}
.b-jong{background:var(--info-bg);color:var(--info)}
.b-over{background:var(--bad-bg);color:var(--bad)}
.b-onb{background:var(--neut-bg);color:var(--neut)}
/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--btn-bg);color:var(--btn-ink);width:100%;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--acc-ink);border:1.5px solid var(--acc);box-shadow:none}
:root[data-theme="dark"] .btn.ghost{border-color:var(--acc)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn.plain{background:var(--card2);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad-bg)}
.btn.sm{padding:8px 13px;font-size:13.5px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
.linkbtn{color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- lege staat / banners ---------- */
.empty{text-align:center;padding:44px 22px;color:var(--ink2)}
.empty .big{font-family:var(--serif);font-size:21px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;margin-bottom:18px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink2);margin:10px 0}
.banner b{color:var(--ink)}
.srcchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold-ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,18,22,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.33,1)}
.sheet.show{transform:translateY(0)}
.sheet-in{overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.sheet-title{font-family:var(--serif);font-size:20px}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
@media (min-width:560px){.sheet{max-width:560px;left:50%;transform:translate(-50%,100%);}.sheet.show{transform:translate(-50%,0)}}
/* ---------- detail ---------- */
.dphoto{border-radius:14px;overflow:hidden;background:var(--card2);max-height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.dphoto img{object-fit:contain;max-height:230px;width:auto;margin:0 auto}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.dcell .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.dcell .v{font-size:14.5px;margin-top:2px}
.grapes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grape{font-size:12px;background:var(--card2);border-radius:999px;padding:3px 10px;color:var(--ink2)}
/* stepper */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepbtn{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:22px;font-weight:600;color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.stepval{font-family:var(--serif);font-size:30px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
/* tijdlijn */
.tl{margin:8px 0 4px}
.tl-track{position:relative;height:10px;border-radius:5px;background:var(--bar-track);overflow:visible}
.tl-fill{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--t-mous),var(--ok) 30%,var(--warn) 78%,var(--bad))}
.tl-now{position:absolute;top:-4px;width:2.5px;height:18px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--sheet)}
.tl-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:7px;font-variant-numeric:tabular-nums}
/* ---------- formulieren ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:64px}
.frow{display:flex;gap:9px}
.frow>.field{flex:1;min-width:0}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:31%;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qquick{display:flex;gap:7px;margin-top:8px;justify-content:center}
.qquick button{font-size:12.5px;font-weight:600;color:var(--acc-ink);background:var(--acc-soft);border-radius:999px;padding:5px 13px}
/* sterren */
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{font-size:30px;line-height:1;color:var(--line);transition:transform .08s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.2)}
.starmini{color:var(--gold);font-size:12.5px;letter-spacing:1px}
/* ---------- pairing ---------- */
.pairtoggle{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:14px}
.pairtoggle button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.pairtoggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mscore{flex:none;font-family:var(--serif);font-size:19px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
.mscore small{font-size:11px;color:var(--ink3);font-family:var(--sans)}
.mreason{font-size:13.5px;color:var(--ink2);margin-top:6px}
.dishcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.dishcard .d{font-weight:600;font-size:14.5px}
.dishcard .r{font-size:13px;color:var(--ink2);margin-top:3px}
/* ---------- overzicht ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);text-align:left}
.tile .n{font-family:var(--serif);font-size:27px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.brow{display:grid;grid-template-columns:minmax(86px,30%) 1fr auto;align-items:center;gap:10px;padding:5px 0}
.brow .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .track{display:block;height:9px;border-radius:5px;background:var(--bar-track);overflow:hidden}
.brow .fill{display:block;height:100%;border-radius:5px 4px 4px 5px;background:var(--bar);min-width:3px}
.brow .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:12px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.rowline:last-child{border-bottom:0}
.rowline .a{min-width:0}
.rowline .t{font-size:14px;font-weight:600;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowline .u{font-size:12px;color:var(--ink2)}
.rowline .z{flex:none;text-align:right}
/* ---------- meer ---------- */
.menu{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-bottom:1px solid var(--line2);text-align:left;font-size:15px}
.mitem:last-child{border-bottom:0}
.mitem svg{color:var(--acc-ink);flex:none}
.mitem .grow{flex:1}
.mitem .cnt{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mitem .chev{color:var(--ink3)}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- navigatie ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nbtn.on{color:var(--acc-ink)}
.nbtn svg{width:23px;height:23px}
.nfab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:-24px}

<script>
'use strict';
/* ================= basis ================= */
const YR = () => new Date().getFullYear();
const IN_SANDBOX = /claudeusercontent\.com$/i.test(location.hostname) || !!window.claude;
const DB_KEY = 'caveau_v1';

const DEFAULTS = () => ({ v:1, wines:[], history:[], wishlist:[], locations:[], pairCache:[], recipeCache:[],
  settings:{ cellarName:'Mijn kelder', apiKey:'', model:'claude-sonnet-5' } });

function loadState(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return DEFAULTS();
    const d = JSON.parse(raw);
    const base = DEFAULTS();
    return { ...base, ...d, settings:{ ...base.settings, ...(d.settings||{}) },
      wines:d.wines||[], history:d.history||[], wishlist:d.wishlist||[], locations:d.locations||[], pairCache:d.pairCache||[], recipeCache:d.recipeCache||[] };
  }catch(e){ return DEFAULTS(); }
}
let S = loadState();
/* save(true) = technische schrijfactie (tokens, sync-adoptie): geen rev-bump, geen cloud-push */
function save(skipCloud){
  if(!skipCloud) S.rev = Date.now();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }catch(e){ toast('Opslaan mislukt — opslag vol?'); }
  if(!skipCloud && typeof cloudOnSave === 'function') cloudOnSave();
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(36).slice(2,8));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const money = n => (n==null||n===''||isNaN(n)) ? '—' : '€ '+Number(n).toLocaleString('nl-NL',{maximumFractionDigits:0});
const plur = (n,e,m) => n===1?e:m;

/* wijntypes */
const TYPES = {
  rood:{l:'Rood',c:'t-rood'}, wit:{l:'Wit',c:'t-wit'}, rose:{l:'Rosé',c:'t-rose'},
  mousserend:{l:'Mousserend',c:'t-mousserend'}, zoet:{l:'Zoet',c:'t-zoet'}, versterkt:{l:'Versterkt',c:'t-versterkt'}
};
function mapType(s){
  const t = norm(s);
  if(/rose|rosado|rosato/.test(t)) return 'rose';
  if(/mousser|champag|cremant|cava|prosecco|sekt|sparkl|bubbel|petnat|pet nat/.test(t)) return 'mousserend';
  if(/versterkt|port|sherry|madeira|banyuls|maury|fortified|vermout/.test(t)) return 'versterkt';
  if(/zoet|sweet|dessert|sauternes|auslese|ijswijn|icewine|tokaji|moelleux/.test(t)) return 'zoet';
  if(/wit|white|blanc|bianco|weiss|oranje|orange|amber/.test(t)) return 'wit';
  if(/rood|red|rouge|rosso|tinto/.test(t)) return 'rood';
  return TYPES[t] ? t : 'rood';
}
const dotHtml = t => `<span class="tdot ${TYPES[t]?TYPES[t].c:'t-rood'}" aria-hidden="true"></span>`;
const typeHtml = t => `${dotHtml(t)}<span class="tlabel">${esc(TYPES[t]?TYPES[t].l:t)}</span>`;

/* drinkvenster-status */
function windowStatus(w){
  const y = YR(), f = w.drinkFrom||null, t = w.drinkTo||null;
  if(!f && !t) return {k:'onb',cls:'b-onb',label:'Venster onbekend',sub:''};
  if(f && y < f) return {k:'jong',cls:'b-jong',label:'Nog te jong',sub:'vanaf '+f};
  if(t && y > t) return {k:'over',cls:'b-over',label:'Over de piek?',sub:'was op dronk t/m '+t};
  if(t){
    const span = Math.max(1, t-(f||t)), rem = t-y;
    if(rem <= Math.max(1, Math.round(span*0.18)))
      return {k:'nu',cls:'b-nu',label:'Drink binnenkort',sub:'nog t/m '+t};
  }
  return {k:'op',cls:'b-op',label:'Op dronk',sub:t?'tot '+t:''};
}
const badgeHtml = w => { const st = windowStatus(w); return `<span class="badge ${st.cls}">${st.label}</span>`; };
/* volgorde voor de drinkvenster-sortering: op dronk → drink binnenkort → over tijd → nog te jong → onbekend */
const URG = {op:0, nu:1, over:2, jong:3, onb:4};

/* ================= foto-opslag (IndexedDB) ================= */
let _db = null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res)=>{
    try{
      const rq = indexedDB.open('caveau_photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { _db = rq.result; res(_db); };
      rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const photoCache = new Map();
async function pSet(id, data){ photoCache.set(id, data); const d = await idb(); if(!d) return;
  await new Promise(r=>{ const tx=d.transaction('p','readwrite'); tx.objectStore('p').put(data,id); tx.oncomplete=r; tx.onerror=r; }); }
async function pGet(id){ if(photoCache.has(id)) return photoCache.get(id); const d = await idb(); if(!d) return null;
  return new Promise(r=>{ const rq=d.transaction('p').objectStore('p').get(id); rq.onsuccess=()=>{ if(rq.result) photoCache.set(id,rq.result); r(rq.result||null); }; rq.onerror=()=>r(null); }); }
async function pDel(id){ photoCache.delete(id); const d = await idb(); if(!d) return;
  await new Promise(r=>{ const tx=d.transaction('p','readwrite'); tx.objectStore('p').delete(id); tx.oncomplete=r; tx.onerror=r; }); }
async function pKeys(){ const d = await idb(); if(!d) return [];
  return new Promise(r=>{ const rq=d.transaction('p').objectStore('p').getAllKeys(); rq.onsuccess=()=>r(rq.result||[]); rq.onerror=()=>r([]); }); }
async function fillPhotos(root){
  const imgs = (root||document).querySelectorAll('img[data-photo]');
  for(const img of imgs){ const src = await pGet(img.dataset.photo); if(src){ img.src = src; img.closest('.wthumb,.dphoto,.scanprev')?.querySelector('svg')?.remove(); } }
}
const bottleSvg = `<svg width="22" height="34" viewBox="0 0 22 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2h4v6.5c2.2 1.2 3.5 3 3.5 5.8V29a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3V14.3c0-2.8 1.3-4.6 3.5-5.8V2Z"/></svg>`;

/* ================= sheets & toast ================= */
const sheets = [];
function openSheet(html, opts={}){
  const host = document.getElementById('sheetHost');
  const ov = document.createElement('div'); ov.className = 'overlay';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  sh.innerHTML = `<div class="sheet-grip"></div><div class="sheet-in">${html}</div>`;
  host.appendChild(ov); host.appendChild(sh);
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
  ov.addEventListener('click', ()=>closeSheet());
  sheets.push({ov, sh, onClose:opts.onClose});
  document.body.style.overflow = 'hidden';
  return sh;
}
function closeSheet(all){
  const doOne = () => {
    const s = sheets.pop(); if(!s) return;
    s.ov.classList.remove('show'); s.sh.classList.remove('show');
    setTimeout(()=>{ s.ov.remove(); s.sh.remove(); }, 300);
    if(s.onClose) try{ s.onClose(); }catch(e){}
  };
  if(all){ while(sheets.length) doOne(); } else doOne();
  if(!sheets.length) document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheets.length) closeSheet(); });
const sheetHead = (title) => `<div class="sheet-head"><div class="sheet-title">${title}</div><button class="xbtn" data-act="closeSheet" aria-label="Sluiten"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>`;

function confirmSheet(title, msg, okLabel, fn, danger){
  openSheet(`${sheetHead(esc(title))}<p style="color:var(--ink2);font-size:14px;margin-bottom:18px">${msg}</p>
    <div class="btnrow"><button class="btn plain" data-act="closeSheet">Annuleer</button>
    <button class="btn ${danger?'danger':''}" id="cfOk">${esc(okLabel)}</button></div>`);
  document.getElementById('cfOk').onclick = () => { closeSheet(); fn(); };
}

let toastTimer = null;
function toast(msg, actionLabel, actionFn, ms=4200){
  const host = document.getElementById('toastHost');
  host.innerHTML = `<div class="toast" role="status">${esc(msg)}${actionLabel?`<button id="toastAct">${esc(actionLabel)}</button>`:''}</div>`;
  const el = host.firstChild;
  if(actionLabel) el.querySelector('#toastAct').onclick = () => { host.innerHTML=''; actionFn && actionFn(); };
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>{ if(host.firstChild===el) host.innerHTML=''; },250); }, ms);
}

/* ================= actie-registry (event-delegatie) ================= */
const ACT = { closeSheet: () => closeSheet() };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el, e); }
});

/* fuzzy match voor scan-herkenning */
function matchWine(x){
  const xn = norm((x.name||'')+' '+(x.producer||''));
  if(!xn) return null;
  const xw = new Set(xn.split(' ').filter(w=>w.length>2));
  let best = null, bestScore = 0;
  for(const w of S.wines){
    const wn = norm((w.name||'')+' '+(w.producer||''));
    const ww = wn.split(' ').filter(t=>t.length>2);
    if(!ww.length) continue;
    let hit = 0; for(const t of ww) if(xw.has(t)) hit++;
    let score = hit / Math.max(3, Math.max(xw.size, ww.length));
    if(x.vintage && w.vintage){ score += (String(x.vintage)===String(w.vintage)) ? 0.25 : -0.2; }
    if(score > bestScore){ bestScore = score; best = w; }
  }
  return bestScore >= 0.5 ? best : null;
}

<script>
'use strict';
/* ================= drinkvenster-schatting ================= */
const G_LONG_WHITE = ['riesling','chardonnay','chenin','semillon','savagnin','assyrtiko','gruner','furmint'];
const G_LIGHT_RED  = ['gamay','pinot','frappato','zweigelt','schiava','cinsault','trousseau','poulsard'];
const G_BIG_RED    = ['cabernet','syrah','shiraz','nebbiolo','sangiovese','tempranillo','mourvedre','monastrell','tannat','malbec','aglianico','touriga','petit verdot','sagrantino','xinomavro'];
const R_BIG        = ['barolo','barbaresco','brunello','pauillac','margaux','saint julien','saint estephe','pessac','pomerol','saint emilion','medoc','hermitage','cote rotie','cornas','chateauneuf','gran reserva','ribera','priorat','bandol','madiran','taurasi','amarone','napa','bolgheri'];
const R_WHITE_LONG = ['meursault','puligny','chassagne','corton','chablis grand','chablis premier','savennieres','vouvray','mosel','rheingau','grand cru','smaragd','hunter'];

function estimateWindow(w){
  const v = w.vintage || YR();
  const g = norm((w.grapes||[]).join(' '));
  const r = norm([w.region, w.appellation, w.country, w.name].filter(Boolean).join(' '));
  const has = (arr, s) => arr.some(x => s.includes(x));
  switch(w.type){
    case 'mousserend':
      if(!w.vintage) { const y=YR(); return {from:y, to:y+2}; }
      return r.includes('champagne') ? {from:v+5, to:v+15} : {from:v+1, to:v+6};
    case 'rose': return {from:v, to:v+2};
    case 'wit':
      if(has(R_WHITE_LONG, r)) return {from:v+2, to:v+10};
      if(has(G_LONG_WHITE, g)) return {from:v+1, to:v+6};
      return {from:v, to:v+3};
    case 'zoet': return {from:v+2, to:v+20};
    case 'versterkt': return /vintage/.test(r) ? {from:v+10, to:v+40} : {from:v, to:v+15};
    default:
      if(has(R_BIG, r)) return {from:v+5, to:v+18};
      if(has(G_BIG_RED, g)) return {from:v+3, to:v+12};
      if(has(G_LIGHT_RED, g)) return {from:v+1, to:v+6};
      return {from:v+2, to:v+8};
  }
}

function winesForDish(text){
  const t = norm(text);
  const cats = FOODS.filter(f => f.kw.some(k => t.includes(norm(k))));
  const scored = S.wines.filter(w => w.qty > 0).map(w => {
    let sc = 0; let reason = ''; let grapeHit = false;
    if(cats.length){
      for(const c of cats){
        const tw = c.w[w.type] || 0; sc += tw;
        if(tw > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))){ sc += 1.6; grapeHit = true; }
        if(tw >= 3 && !reason) reason = c.rW;
      }
      sc = sc / cats.length;
    } else sc = 1.6;
    const st = windowStatus(w);
    /* urgentie telt mee: wat op moet en past, schenk je juist nú */
    if(st.k==='op') sc += 0.9; else if(st.k==='nu') sc += 1.4; else if(st.k==='jong') sc -= 1.3; else if(st.k==='over') sc += 0.8;
    return {w, sc, reason, grapeHit, st};
  }).filter(x => x.sc > 1).sort((a,b) => b.sc - a.sc).slice(0,5);
  const mx = Math.max(4.8, ...scored.map(x=>x.sc));
  scored.forEach(x => {
    x.score = Math.max(4, Math.min(10, Math.round(x.sc / mx * 10)));
    let r = x.reason ? x.reason.charAt(0).toUpperCase()+x.reason.slice(1) : 'Veelzijdige keuze uit je kelder';
    if(x.grapeHit && x.w.grapes && x.w.grapes.length) r += ` — de ${esc(x.w.grapes[0])} doet hier precies wat nodig is`;
    x.rHtml = r + '.';
  });
  return {cats, list:scored};
}

function dishesForWine(w){
  const ranked = FOODS.map(c => {
    let sc = (c.w[w.type] || 0);
    if(sc > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))) sc += 2;
    return {c, sc};
  }).filter(x => x.sc >= 3).sort((a,b) => b.sc - a.sc).slice(0,5);
  const out = [];
  for(const {c} of ranked){
    out.push({dish:c.dishes[0], reason:c.rW.charAt(0).toUpperCase()+c.rW.slice(1)+'.'});
    if(c.dishes[1] && out.length < 6 && ranked.length < 4) out.push({dish:c.dishes[1], reason:'Zelfde register: '+c.rW+'.'});
  }
  return out.slice(0,6);
}

/* ================= AI-laag (buiten de sandbox, met eigen API-sleutel) ================= */
function aiReady(){ return !IN_SANDBOX && !!(S.settings.apiKey||'').trim(); }

async function callClaude(content, maxTokens){
  const model = (S.settings.model||'claude-sonnet-5').trim();
  const body = { model, max_tokens:maxTokens||2000, messages:[{role:'user', content}] };
  /* Sonnet 5 / Opus 5 denken standaard mee in het antwoordbudget — voor JSON-extractie
     zetten we dat uit (sneller, goedkoper, geen afgekapte JSON). Fable/Mythos en Haiku
     accepteren dit veld niet op dezelfde manier: daar weglaten. */
  if(/sonnet-[45]|opus-[45]/.test(model)) body.thinking = {type:'disabled'};
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':S.settings.apiKey.trim(),
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('API '+res.status+' — '+t.slice(0,200)); }
  const d = await res.json();
  return (d.content||[]).filter(b => b.type==='text').map(b => b.text).join('');
}
function parseJsonLoose(s){
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) throw new Error('Geen JSON in antwoord');
  return JSON.parse(s.slice(a, b+1));
}

/* foto verkleinen */
function resizeImg(file, maxW, q){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*sc));
      c.height = Math.max(1, Math.round(img.height*sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Foto kon niet worden gelezen')); };
    img.src = url;
  });
}

    </div>
    ${w.note?`<p style="font-size:13.5px;color:var(--ink2);margin:4px 0 10px">${esc(w.note)}</p>`:''}
    ${(w.pairing&&w.pairing.length)?`<div class="eyebrow mb8">Lekker bij</div><div class="grapes" style="margin-bottom:12px">${w.pairing.map(p=>`<span class="grape">${esc(p)}</span>`).join('')}</div>`:''}
    ${(()=>{ const recs=(S.recipeCache||[]).filter(r=>r.wineId===w.id); return recs.length?`<div class="eyebrow mb8">Opgeslagen recepten</div><div class="panel" style="margin-bottom:12px;padding:6px 15px">${recs.map(r=>`<button class="rowline" style="width:100%;text-align:left" data-act="recipeOpen" data-k="${esc(r.key)}"><span class="a"><div class="t">📖 ${esc(r.recipe.title||r.dish)}</div><div class="u">${r.persons} personen${r.recipe.time?' · '+esc(r.recipe.time):''}</div></span><span class="z" style="color:var(--ink3)">›</span></button>`).join('')}</div>`:''; })()}

    <button class="btn danger" data-act="wineDel" data-id="${w.id}">Verwijderen</button></div>`);

function timelineHtml(w){
  const f = w.drinkFrom, t = w.drinkTo;
  if(!f && !t) return '';
  const y = YR(), lo = Math.min(f||y, y) - 1, hi = Math.max(t||y, y) + 1, span = Math.max(1, hi-lo);
  const L = v => Math.min(100, Math.max(0, (v-lo)/span*100)).toFixed(1);
  return `<div class="tl" role="img" aria-label="Drinkvenster ${f||'?'} tot ${t||'?'}"><div class="tl-track">
    ${(f&&t)?`<div class="tl-fill" style="left:${L(f)}%;right:${(100-Number(L(t))).toFixed(1)}%"></div>`:''}
    <div class="tl-now" style="left:${L(y)}%"></div></div>
    <div class="tl-lab"><span>${f||'?'}</span><span>nu · ${y}</span><span>${t||'?'}</span></div></div>`;
}
ACT.qtyPlus = el => { const w = findWine(el.dataset.id); if(!w) return; w.qty = (w.qty||0)+1; save();

ACT.qtyMinus = el => { const w = findWine(el.dataset.id); if(!w || !w.qty) return; w.qty--; save();
  const q = document.getElementById('dQty'); if(q) q.textContent = w.qty; };
ACT.wineDel = el => { const w = findWine(el.dataset.id); if(!w) return;
  confirmSheet('Verwijderen?', `<b>${esc(w.name)}</b> en de bijbehorende foto verdwijnen uit je kelder. Je drink-historie blijft bewaard.`, 'Verwijder', () => {

let drinkRating = null; /* null = niet beoordeeld, 0..5 = expliciete score */
ACT.drinkOpen = el => openDrink(el.dataset.id);
function openDrink(id){
  const w = findWine(id); if(!w) return;
  drinkRating = null;
  const today = new Date().toISOString().slice(0,10);
  openSheet(`${sheetHead('Drink een fles')}
    <div class="wsub" style="font-size:14.5px;margin-bottom:2px">${esc(w.name)} · ${w.vintage||'NV'}</div>

    <div class="stars" id="drinkStars" role="radiogroup" aria-label="Beoordeling">${[1,2,3,4,5].map(n=>`<button data-star="${n}" role="radio" aria-label="${n} sterren">★</button>`).join('')}</div>
    <div class="small center" id="starLbl" style="margin:-2px 0 10px">Tik een ster (nogmaals dezelfde = 0 sterren)</div>
    <div class="field"><label>Datum</label><input type="date" class="inp" id="drDate" value="${today}"></div>
    <div class="field"><label>Proefnotitie (optioneel)</label><textarea class="inp" id="drNote" placeholder="Hoe smaakte hij? Bij welk gerecht?"></textarea></div>
    <button class="btn" data-act="drinkSave" data-id="${w.id}">Proost — leg vast</button>`);
  wireStars();
}
function wireStars(){
  const paint = () => {
    document.querySelectorAll('#drinkStars button').forEach(x =>
      x.classList.toggle('on', drinkRating != null && Number(x.dataset.star) <= drinkRating));
    const l = document.getElementById('starLbl');
    if(l) l.textContent = drinkRating == null ? 'Tik een ster (nogmaals dezelfde = 0 sterren)'
      : drinkRating === 0 ? '0 van 5 — die was niks' : `${drinkRating} van 5`;
  };
  document.querySelectorAll('#drinkStars button').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.star);
    drinkRating = (drinkRating === n) ? 0 : n;
    paint();
  });
}

ACT.drinkExternSave = async el => {
  const g = id => (document.getElementById(id)||{}).value || '';
  const name = g('dx_name').trim();
  if(!name){ toast('Geef de wijn een naam'); return; }
  const vint = parseInt(g('dx_vint'),10);
  const entry = { id:uid(), wineId:null, extern:true, place:g('dx_place').trim(),
    date:g('drDate') || new Date().toISOString().slice(0,10),
    name, producer:g('dx_prod').trim(), vintage:(vint>=1900&&vint<=2100)?vint:null,
    type:el.dataset.type||'rood', rating:drinkRating, note:g('drNote').trim() };
  S.history.unshift(entry);
  if((document.getElementById('dx_wish')||{}).checked){
    const it = { id:uid(), name, producer:entry.producer, vintage:entry.vintage, type:entry.type,
      price:null, note:['Geproefd', entry.place].filter(Boolean).join(' — '), photo:!!drinkExternThumb, addedAt:Date.now() };
    S.wishlist.unshift(it);
    if(drinkExternThumb) await pSet(it.id, drinkExternThumb);
  }
  save(); drinkExternThumb = null;
  if(scan.stage === 'confirm') scanReset();

ACT.drinkSave = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  const entry = { id:uid(), wineId:w.id, date:(document.getElementById('drDate')||{}).value || new Date().toISOString().slice(0,10),
    name:w.name, producer:w.producer||'', vintage:w.vintage||null, type:w.type,
    rating:drinkRating, note:((document.getElementById('drNote')||{}).value||'').trim() };
  const prevQty = w.qty||0;
  w.qty = Math.max(0, prevQty - 1);
  S.history.unshift(entry); save(); closeSheet(true); render();
  toast('Genoteerd — santé!', 'Ongedaan', () => { w.qty = prevQty; S.history = S.history.filter(h => h.id !== entry.id); save(); render(); });
};

/* locatie-register: namen komen uit wijnen; register bewaart optionele foto per locatie */
function locEntry(name, createIfMissing){
  if(!S.locations) S.locations = [];
  let e = S.locations.find(l => l.name === name);
  if(!e && createIfMissing){ e = {id:uid(), name, photo:false}; S.locations.push(e); }
  return e || null;
}
function allLocations(){
  const set = new Set((S.locations||[]).map(l => l.name));
  S.wines.forEach(w => { if(w.location) set.add(w.location); });
  return [...set].sort((a,b) => a.localeCompare(b,'nl'));
}
function locOptions(){
  const set = new Set([...(S.locations||[]).map(l => l.name), ...S.wines.map(w => w.location).filter(Boolean)]);
  ['Vintec — zone boven','Vintec — zone onder','Wijnrek','Kelder','Doos'].forEach(d => set.add(d));
  return [...set];
}
function locSelectOptions(sel){
  return `<option value=""${!sel?' selected':''}>— locatie —</option>` +
    locOptions().map(l => `<option value="${esc(l)}"${l===sel?' selected':''}>${esc(l)}</option>`).join('');

function wireSeg(id){

function readForm(){
  const g = v => (document.getElementById(v)||{}).value || '';
  const num = v => { const x = parseFloat(String(g(v)).replace(',','.')); return isNaN(x) ? null : x; };
  const yr  = v => { const x = parseInt(g(v),10); return (x>=1900 && x<=2100) ? x : null; };
  const segEl = document.querySelector('#f_type button.on');
  return {
    name:g('f_name').trim(), producer:g('f_producer').trim(), vintage:yr('f_vintage'),
    type:segEl ? segEl.dataset.val : 'rood',

    drinkFrom:yr('f_from'), drinkTo:yr('f_to'),

  };

ACT.wineNew = () => openWineForm(null);
ACT.wineEdit = el => openWineForm(findWine(el.dataset.id));
let formQty = 1;
let recalcPairing = null;
let recalcValueRange = null;
let vensterAuto = true; /* venster is (nog) een schatting → mag automatisch herberekend worden */

/* Herbereken drinkvenster + pairing op basis van wat er nu in het formulier staat
   (bv. na het zelf invullen van jaargang of druiven). AI indien beschikbaar, anders kelderregels. */
async function doRecalc(el, silent){
  const d = readForm();
  if(!d.name && !(d.grapes||[]).length && !d.region && !d.appellation){
    if(!silent) toast('Vul eerst minstens een naam, druif of regio in');
    return;
  }
  const orig = el ? el.innerHTML : '';
  if(el){ el.innerHTML = 'Herberekenen…'; el.style.pointerEvents = 'none'; }
  const setVal = (id, v) => { const x = document.getElementById(id); if(x && v != null && v !== '') x.value = v; };
  let src = 'Kelderregels', done = false;
  if(aiReady()){
    try{
      const r = await aiRecalc(d);
      if(r.drink_from) setVal('f_from', r.drink_from);
      if(r.drink_to) setVal('f_to', r.drink_to);
      if(!(d.grapes||[]).length && Array.isArray(r.grapes) && r.grapes.length) setVal('f_grapes', r.grapes.join(', '));
      if(!d.note && r.note) setVal('f_note', r.note);
      if(Array.isArray(r.pairing) && r.pairing.length){
        recalcPairing = r.pairing;
        if(scan.stage === 'confirm' && scan.data) scan.data.pairing = r.pairing;
      }
      if(r.value_eur != null && d.value == null) setVal('f_value', Math.round(r.value_eur));
      if(r.value_low != null && r.value_high != null) recalcValueRange = {low:Math.round(r.value_low), high:Math.round(r.value_high)};
      src = 'Sommelier-AI'; done = true;
    }catch(e){ /* val terug op regels */ }
  }
  if(!done){
    const est = estimateWindow(d);
    setVal('f_from', est.from); setVal('f_to', est.to);
  }
  if(el){ el.innerHTML = orig; el.style.pointerEvents = ''; }
  toast(`Drinkvenster bijgewerkt (${src})`);
}
ACT.recalc = el => doRecalc(el, false);

/* venster met de hand aangepast → niet meer automatisch overschrijven */
document.addEventListener('input', e => {
  const t = e.target;
  if(t && (t.id === 'f_from' || t.id === 'f_to')) vensterAuto = false;
});
/* jaargang ingevuld of gewijzigd → venster automatisch bijrekenen zolang het een schatting is */
document.addEventListener('change', e => {
  if(!e.target || e.target.id !== 'f_vintage' || !vensterAuto) return;
  doRecalc(document.getElementById('recalcBtn'), true);
});

    ${formFields(w || {location:(S.settings.lastLocation||'')})}

      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">1</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>` : ''}

function syncQty(){ const q = document.getElementById('fQty'); if(q) q.textContent = formQty;
  const m = document.getElementById('mq'); if(m) m.textContent = formQty; }
ACT.fq = el => { formQty = Math.max(1, formQty + Number(el.dataset.d)); syncQty(); };
ACT.fqset = el => { formQty = Number(el.dataset.n); syncQty(); };
ACT.wineSave = el => {
  const d = readForm();
  if(!d.name){ toast('Geef de wijn een naam'); return; }
  if(d.location) S.settings.lastLocation = d.location;
  if(!d.drinkFrom && !d.drinkTo){ const est = estimateWindow(d); d.drinkFrom = est.from; d.drinkTo = est.to; }
  const id = el.dataset.id;
  if(id){ const w = findWine(id); if(!w) return; Object.assign(w, d);
    if(recalcPairing) w.pairing = recalcPairing;
    if(recalcValueRange){ w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; }
    save(); closeSheet(true); render(); toast('Bijgewerkt'); }
  else {
    const w = { id:uid(), ...d, qty:formQty, pairing:recalcPairing||[], photo:false, addedAt:Date.now() };
    if(recalcValueRange){ w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; }
    S.wines.unshift(w); save(); closeSheet(true); UI.tab = 'kelder'; render();
    toast(`${formQty} ${plur(formQty,'fles','flessen')} toegevoegd`);
  }
};

ACT.wineDishes = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  openSheet(`${sheetHead('Lekker bij ' + esc(w.name))}
    <div class="field"><label>Richting (optioneel)</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="pd_dir" placeholder="bv. Aziatisch, vegetarisch, licht &amp; zomers" style="flex:1">
        <button class="btn sm soft" data-act="dishGo" data-id="${w.id}" style="flex:none">Toon</button>
      </div></div>
    <div id="dishOut"></div>`);
  runWineDishes(w, '', false);
};
ACT.dishGo = el => { const w = findWine(el.dataset.id); runWineDishes(w, ((document.getElementById('pd_dir')||{}).value||'').trim(), false); };
ACT.dishFresh = el => { const w = findWine(el.dataset.id); runWineDishes(w, el.dataset.dir||'', true); };

async function runWineDishes(w, richting, force){
  const out = document.getElementById('dishOut'); if(!out || !w) return;
  const key = norm(richting||'') || '_';
  const cached = !force && w.dishCache && w.dishCache[key];
  if(cached && cached.list && cached.list.length){
    const dt = new Date(cached.at).toLocaleDateString('nl-NL', {day:'numeric', month:'short'});
    renderDishes(out, w, richting, cached.list, `Opgeslagen · ${dt}`, true);
    return;
  }
  let dishes = null, src = 'Kelderregels';
  if(aiReady()){
    out.innerHTML = `<div class="banner"><span class="spin"></span><span class="pulse">De sommelier denkt na…</span></div>`;
    try{
      const r = await aiWine(w, richting);
      dishes = (r.dishes||[]).map(d => ({dish:d.dish, reason:d.reason})).filter(d => d.dish);
      if(dishes.length){ src = 'Sommelier-AI'; w.dishCache = w.dishCache || {}; w.dishCache[key] = {at:Date.now(), list:dishes}; save(); }
    }catch(e){ dishes = null; }
  }
  if(!dishes || !dishes.length){ dishes = dishesForWine(w); src = 'Kelderregels'; }
  if(!dishes.length){ out.innerHTML = '<p class="small">Geen suggesties gevonden — vul type of druiven aan.</p>'; return; }
  renderDishes(out, w, richting, dishes, src, false);
}
function renderDishes(out, w, richting, list, srcLabel, cached){
  out.innerHTML = `<div class="mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="srcchip">${esc(srcLabel)}</span>${richting?`<span class="small">richting: ${esc(richting)}</span>`:''}${cached?`<button class="linkbtn" style="font-size:12.5px" data-act="dishFresh" data-id="${w.id}" data-dir="${esc(richting||'')}">↻ vernieuw</button>`:''}</div>` +
    list.map(d => `<div class="dishcard"><div class="d">${esc(d.dish)}</div><div class="r">${esc(d.reason||'')}</div><div class="mt8"><button class="linkbtn" style="font-size:13px" data-act="recipeAsk" data-dish="${esc(d.dish)}" data-wid="${w.id}">📖 Recept tonen</button></div></div>`).join('');
}

/* ---- recepten (met personen-keuze en cache) ---- */
ACT.recipeAsk = el => {
  if(!aiReady() && !(S.recipeCache||[]).some(r => r.dish === el.dataset.dish)){
    toast('Recepten vergen de AI-sleutel (Meer → Instellingen)'); return;
  }
  const dish = el.dataset.dish, wid = el.dataset.wid || '';
  openSheet(`${sheetHead('Recept — ' + esc(dish))}
    <p class="small mb8">Voor hoeveel personen?</p>
    <div class="btnrow">${[2,4,6,8].map(n => `<button class="btn soft" data-act="recipeGo" data-dish="${esc(dish)}" data-wid="${wid}" data-p="${n}">${n}</button>`).join('')}</div>`);
};
ACT.recipeGo = async el => {
  const dish = el.dataset.dish, p = Number(el.dataset.p) || 4, wid = el.dataset.wid || null;
  const key = norm(dish) + '|' + p;
  closeSheet();
  const hit = (S.recipeCache||[]).find(r => r.key === key);
  if(hit){ showRecipe({...hit, cached:true}); return; }
  if(!aiReady()){ toast('Recepten vergen de AI-sleutel (Meer → Instellingen)'); return; }
  const sh = openSheet(`${sheetHead('Recept — ' + esc(dish))}<div class="banner"><span class="spin"></span><span class="pulse">Recept schrijven…</span></div>`);
  try{
    const r = await aiRecipe(dish, p);
    const wijn = wid ? findWine(wid) : null;
    const entry = {key, dish, persons:p, at:Date.now(), wineId:wid, wineName:wijn?`${wijn.name}${wijn.vintage?' '+wijn.vintage:''}`:null, recipe:r};
    S.recipeCache = (S.recipeCache||[]).filter(x => x.key !== key);
    S.recipeCache.unshift(entry);
    S.recipeCache = S.recipeCache.slice(0, 50);
    save();
    closeSheet(); showRecipe({...entry, cached:false});
  }catch(e){
    const inner = sh.querySelector('.sheet-in');
    if(inner) inner.innerHTML = `${sheetHead('Recept')}<div class="banner"><span>⚠️</span><span>Recept ophalen lukte niet (${esc(String(e.message||e).slice(0,90))}). Probeer het zo nog eens.</span></div>`;
  }
};
function showRecipe(e){
  const r = e.recipe || {};
  const wijn = e.wineId ? findWine(e.wineId) : null;
  const wijnRow = wijn
    ? `<button class="linkbtn" style="font-size:13px" data-act="detail" data-id="${wijn.id}">🍷 ${esc(e.wineName||wijn.name)} →</button>`
    : (e.wineName ? `<span class="small">🍷 ${esc(e.wineName)} (niet meer in je kelder)</span>` : '');
  openSheet(`${sheetHead(esc(r.title || e.dish))}
    <div class="small mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${e.persons} personen${r.time ? ` · ${esc(r.time)}` : ''} · <span class="srcchip">${e.cached ? 'Opgeslagen' : 'Sommelier-AI'}</span>${wijnRow}</div>
    <div class="eyebrow mb8">Ingrediënten</div>
    <div class="panel" style="margin-bottom:14px">${(r.ingredients||[]).map(i => `<div class="rowline" style="padding:6px 0"><span class="a" style="font-size:14px">${esc(i)}</span></div>`).join('')}</div>
    <div class="eyebrow mb8">Bereiding</div>
    ${(r.steps||[]).map((s,i) => `<div style="display:flex;gap:10px;margin-bottom:10px"><span style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</span><span style="font-size:14px;flex:1">${esc(s)}</span></div>`).join('')}`);
}
ACT.recipeOpen = el => {
  const r = (S.recipeCache||[]).find(x => x.key === el.dataset.k);
  if(r) showRecipe({...r, cached:true});
};
</script>
<script>
'use strict';
/* ================= SCAN ================= */
let scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false };
function scanReset(){ scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false }; recalcPairing = null; recalcValueRange = null; }

function aiBanner(){
  if(IN_SANDBOX) return `<div class="banner"><span>ℹ️</span><span><b>Etiket-lezen met AI staat uit</b> in deze omgeving (de app-sandbox blokkeert externe verbindingen). Foto's bewaren en zelf invullen werkt gewoon — de ingebouwde sommelier-regels schatten drinkvenster en pairing. Host je het bestand zelf, dan leest Claude etiketten automatisch.</span></div>`;
  if(!aiReady()) return `<div class="banner"><span>ℹ️</span><span><b>Tip:</b> zet je Anthropic API-sleutel in <button class="linkbtn" data-act="goSettings">Instellingen</button> en Claude leest etiketten automatisch — naam, druiven, drinkvenster en pairing in één keer.</span></div>`;
  return '';
}
function viewScan(){
  if(scan.stage === 'idle'){
    return `${brandRow('')}
      <div class="scanhero">
        <div class="eyebrow">Etiket scannen</div>
        <h2 class="h2">Richt je camera op de fles</h2>
        <button class="scanbig" data-act="scanCam" aria-label="Open camera">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1l1.4-2h6.2L16.5 6h1A2.5 2.5 0 0 1 20 8.5v7A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5v-7Z"/><circle cx="12" cy="12" r="3.4"/></svg>
          <span>Scan etiket</span></button>
        <p class="small" style="max-width:300px;margin:0 auto">Herkennen, toevoegen, info bekijken of afboeken — de foto is genoeg.</p>
        <div class="btnrow mt14" style="max-width:340px;margin-left:auto;margin-right:auto">
          <button class="btn plain" data-act="scanLib">Kies een foto</button>
          <button class="btn plain" data-act="wineNew">Handmatig</button>
        </div>
      </div>${aiBanner()}`;
  }
  /* confirm-stadium */
  const d = scan.data || {};
  const pre = {
    name:d.name||'', producer:d.producer||'', vintage:d.vintage||null,
    type:d.type?mapType(d.type):'rood', grapes:d.grapes||[], country:d.country||'', region:d.region||'',
    appellation:d.appellation||'', drinkFrom:d.drink_from||null, drinkTo:d.drink_to||null,
    price:null, value:(d.value_eur!=null?Math.round(d.value_eur):null), location:(S.settings.lastLocation||''), note:d.note||''
  };
  return `${brandRow('')}
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn sm plain" data-act="scanAgain">‹ Annuleer</button>
      <button class="btn sm plain" data-act="scanNewPhoto">📷 Nieuwe foto</button>
    </div>
    <div class="scanprev">${bottleSvg}<img id="scanImg" alt="Gescand etiket"></div>
    ${scan.busy ? `<div class="banner"><span class="spin"></span><span class="pulse">De sommelier leest het etiket…</span></div>` : ''}
    ${scan.err ? `<div class="banner"><span>⚠️</span><span><b>Automatisch lezen lukte niet</b> (${esc(scan.err)}). Probeer het nog eens, of vul de velden (deels) zelf in en tik op "Herbereken" — de foto blijft bewaard.<br><button class="btn sm ghost mt8" data-act="scanRetry">↻ Probeer opnieuw te lezen</button></span></div>` : ''}
    ${(!scan.busy && scan.data) ? `<div class="banner"><span>🍷</span><span><span class="srcchip">Sommelier-AI</span>${d.note?` ${esc(d.note)}`:''}${(d.pairing&&d.pairing.length)?`<br><b>Lekker bij:</b> ${esc(d.pairing.slice(0,4).join(' · '))}`:''}</span></div>` : ''}
    ${(!scan.busy && scan.data && !d.vintage) ? `<div class="banner"><span>📅</span><span><b>Jaargang niet op het etiket gevonden</b> — het venster hieronder is een grove schatting. Vul de jaargang in bij "Jaargang"; het drinkvenster rekent dan vanzelf bij. Geen jaargang (NV)? Laat het veld leeg.</span></div>` : ''}
    ${scan.match ? `<div class="matchbanner"><b>${esc(scan.match.name)} ${scan.match.vintage||''}</b> staat al in je kelder (×${scan.match.qty}). Flessen bijboeken, of juist één afboeken?</div>` : ''}
    ${scan.busy ? '' : `<div class="panel" style="padding:11px 13px;margin-bottom:12px"><div class="eyebrow mb8">Snel wegleggen</div>
      <div style="display:flex;gap:8px"><select class="inp" id="quickLoc" data-in="quickLoc" style="flex:1;min-width:0" aria-label="Locatie">${locSelectOptions(pre.location)}</select>
      <button class="btn sm" data-act="${scan.match?'scanMerge':'scanAdd'}" style="flex:none">+ Kelder in</button></div></div>`}
    ${scan.busy ? '' : formFields(pre)}
    <div class="field"><label>Aantal flessen</label>
      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">${formQty}</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>
    ${scan.match ? `<button class="btn" data-act="scanMerge" style="margin-bottom:9px">+<span id="mq">${formQty}</span> bijboeken bij bestaande</button>
      <button class="btn ghost" data-act="scanRemove" style="margin-bottom:9px">Drink / haal er één uit de kelder</button>` :
      `<button class="btn" data-act="scanAdd" style="margin-bottom:9px" ${scan.busy?'disabled':''}>In de kelder leggen</button>`}
    <button class="btn ghost" data-act="scanDrinkNow" style="margin-bottom:9px" ${scan.busy?'disabled':''}>🥂 Drink nu — niet uit de kelder</button>
    <div class="btnrow">
      ${scan.match?`<button class="btn soft" data-act="scanAdd">Als nieuwe bewaren</button>`:`<button class="btn soft" data-act="scanWish" ${scan.busy?'disabled':''}>Op verlanglijst</button>`}
      <button class="btn plain" data-act="scanAgain">Opnieuw</button>
    </div>`;
}
ACT.scanCam = () => document.getElementById('fCam').click();
ACT.scanLib = () => document.getElementById('fLib').click();
ACT.scanAgain = () => { scanReset(); render(); };
ACT.scanNewPhoto = () => document.getElementById('fCam').click();
ACT.scanDrinkNow = () => {
  const d = readForm();
  openDrinkExtern({name:d.name, producer:d.producer, vintage:d.vintage, type:d.type}, scan.thumb);
};
INP.quickLoc = el => { const f = document.getElementById('f_loc'); if(f) f.value = el.value; };

/* venster ontbreekt in het scanresultaat → altijd alvast een regels-schatting invullen */
function ensureWindow(d){
  if(d.drink_from && d.drink_to) return;
  const est = estimateWindow({ type: mapType(d.type||'rood'), grapes: d.grapes||[], region: d.region,
    appellation: d.appellation, country: d.country, name: d.name, vintage: d.vintage||null });
  d.drink_from = d.drink_from || est.from;
  d.drink_to = d.drink_to || est.to;
}
ACT.scanRetry = async () => {
  if(!scan.photo || scan.busy) return;
  if(!aiReady()){ toast('AI-scannen staat hier uit — vul de velden in en gebruik Herbereken'); return; }
  scan.err = null; scan.busy = true; vensterAuto = true; render(); showScanImg();
  try{
    const d = await aiScan(scan.photo);
    ensureWindow(d);
    scan.data = d;
    scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
  }catch(e){ scan.err = String(e.message||e).slice(0,120); }
  scan.busy = false; render(); showScanImg();
};
ACT.goSettings = () => { UI.tab='meer'; UI.meerPage='settings'; render(); };

async function handlePhoto(file){
  if(!file) return;
  formQty = 1;
  try{
    scan.photo = await resizeImg(file, 1100, 0.8);
    scan.thumb = await resizeImg(file, 380, 0.72);
  }catch(e){ toast('Foto kon niet worden gelezen'); return; }
  scan.stage = 'confirm'; scan.data = null; scan.err = null; scan.match = null;
  scan.busy = aiReady(); vensterAuto = true;
  UI.tab = 'scan'; render(); showScanImg();
  if(scan.busy){
    try{
      const d = await aiScan(scan.photo);
      ensureWindow(d);
      scan.data = d;
      scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
    }catch(e){ scan.err = String(e.message||e).slice(0,120); }
    scan.busy = false; render(); showScanImg();
  }
}
function showScanImg(){ const i = document.getElementById('scanImg'); if(i && scan.photo){ i.src = scan.photo; i.closest('.scanprev')?.querySelector('svg')?.remove(); } }

function wineFromScanForm(){
  const d = readForm();
  if(!d.name){ toast('Geef de wijn minstens een naam'); return null; }
  if(!d.drinkFrom && !d.drinkTo){ const est = estimateWindow(d); d.drinkFrom = est.from; d.drinkTo = est.to; }
  return d;
}
ACT.scanAdd = async () => {
  const d = wineFromScanForm(); if(!d) return;
  if(d.location) S.settings.lastLocation = d.location;
  const w = { id:uid(), ...d, qty:formQty, pairing:(scan.data&&scan.data.pairing)||recalcPairing||[], photo:!!scan.thumb, addedAt:Date.now() };
  if(scan.data && scan.data.value_low != null) w.valueLow = Math.round(scan.data.value_low);
  if(scan.data && scan.data.value_high != null) w.valueHigh = Math.round(scan.data.value_high);
  if(recalcValueRange){ w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; }
  S.wines.unshift(w); save();
  if(scan.thumb) await pSet(w.id, scan.thumb);
  const n = formQty; scanReset(); UI.tab = 'kelder'; render();
  toast(`${n} ${plur(n,'fles','flessen')} in de kelder gelegd`);
};
ACT.scanMerge = async () => {
  const m = scan.match; if(!m) return;
  m.qty = (m.qty||0) + formQty;
  if(!m.photo && scan.thumb){ await pSet(m.id, scan.thumb); m.photo = true; }
  save(); const n = formQty, id = m.id; scanReset(); UI.tab = 'kelder'; render();
  toast(`+${n} bijgeboekt — nu ×${findWine(id).qty}`);
};
ACT.scanRemove = () => { const id = scan.match && scan.match.id; if(!id) return; scanReset(); UI.tab='kelder'; render(); openDrink(id); };
ACT.scanWish = async () => {
  const d = wineFromScanForm(); if(!d) return;
  const it = { id:uid(), name:d.name, producer:d.producer, vintage:d.vintage, type:d.type,
    region:d.region, country:d.country, price:d.price, note:d.note, photo:!!scan.thumb, addedAt:Date.now() };
  S.wishlist.unshift(it); save();
  if(scan.thumb) await pSet(it.id, scan.thumb);
  scanReset(); render(); toast('Op je verlanglijst gezet');
};

/* ================= PAIRING ================= */
let pairOut = '';
function viewPairing(){
  const toggle = `<div class="pairtoggle">
    <button class="${UI.pairMode==='dish'?'on':''}" data-act="pairMode" data-m="dish">Bij mijn gerecht</button>
    <button class="${UI.pairMode==='wine'?'on':''}" data-act="pairMode" data-m="wine">Bij een wijn</button></div>`;
  if(!S.wines.filter(w=>w.qty>0).length && UI.pairMode==='dish'){
    return `${brandRow('')}<div class="eyebrow">Spijs & wijn</div><h2 class="h2">Wat past waarbij?</h2>${toggle}
      <div class="empty"><div class="big">Nog geen flessen op voorraad</div><p>Vul je kelder, dan zoekt de sommelier de beste match bij je gerecht.</p>
      <button class="btn" data-act="tab" data-tab="scan" style="max-width:240px">Scan een fles</button></div>`;
  }
  if(UI.pairMode === 'dish'){
    const chips = ['Biefstuk','Wild','Witte vis','Schaaldieren','Sushi','Pasta met tomaat','Risotto','Kip uit de oven','Kaasplank','Thaise curry','BBQ','Chocolade']
      .map(c => `<button class="chip" data-act="pairQuick" data-d="${esc(c)}">${c}</button>`).join('');
    return `${brandRow('')}<div class="eyebrow">Spijs & wijn</div><h2 class="h2">Wat ga je (ongeveer) eten?</h2>${toggle}
      <p class="small mb8">Vaag mag — "iets met kip" of "Aziatisch" is genoeg. De sommelier kiest de beste flessen uit jóuw kelder, met uitleg waarom.</p>
      <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input type="search" id="pairDish" placeholder="bv. 'iets met kip' of 'hertenbiefstuk'" value="" aria-label="Gerecht"></div>
      <div class="chiprow">${chips}</div>
      <button class="btn" data-act="pairGo">Zoek de beste fles in mijn kelder</button>
      <div id="pairOut" class="mt14">${pairOut}</div>`;
  }
  /* wijn → gerecht */
  const list = S.wines.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  return `${brandRow('')}<div class="eyebrow">Spijs & wijn</div><h2 class="h2">Kies een wijn</h2>${toggle}
    <p class="small mb8">Tik een fles aan voor gerechten die erbij passen.</p>
    <div class="wlist">${list.map(w => `<button class="wcard" data-act="wineDishes" data-id="${w.id}">
      <span class="wthumb">${bottleSvg}${w.photo?`<img data-photo="${w.id}" alt="">`:''}</span>
      <span class="wmain"><span class="wname">${esc(w.name)}</span>
      <span class="wsub">${esc([w.producer,w.vintage||'NV'].filter(Boolean).join(' · '))}</span>
      <span class="wmeta">${typeHtml(w.type)}</span></span></button>`).join('')}</div>`;
}
ACT.pairMode = el => { UI.pairMode = el.dataset.m; pairOut=''; render(); if(UI.pairMode==='wine') fillPhotos(); };
ACT.pairQuick = el => { const i = document.getElementById('pairDish'); if(i) i.value = el.dataset.d; ACT.pairGo(); };
ACT.pairGo = () => runPair(((document.getElementById('pairDish')||{}).value||'').trim(), false);
ACT.pairFresh = el => { const i = document.getElementById('pairDish'); if(i) i.value = el.dataset.d||''; runPair(el.dataset.d||'', true); };
async function runPair(dish, force){
  if(!dish){ toast('Vertel eerst wat je gaat eten'); return; }
  const out = document.getElementById('pairOut'); if(!out) return;
  const key = norm(dish);
  let html = '', src = 'Kelderregels', matches = null, buyTip = null, cachedAt = null;
  /* eerder opgeslagen resultaat? (alleen wijnen die nog op voorraad zijn) */
  if(!force){
    const hit = (S.pairCache||[]).find(c => c.key === key);
    if(hit){
      const ms = (hit.matches||[]).map(m => ({w:findWine(m.id), score:m.score, reason:m.reason})).filter(m => m.w && m.w.qty > 0);
      if(ms.length){ matches = ms; buyTip = hit.buyTip||null; src = 'Opgeslagen'; cachedAt = hit.at; }
    }
  }
  if(!matches){
    out.innerHTML = `<div class="banner"><span class="spin"></span><span class="pulse">De sommelier proeft in gedachten…</span></div>`;
    if(aiReady()){
      try{
        const r = await aiDish(dish);
        matches = (r.matches||[]).map(m => ({w:findWine(m.id), score:Math.round(m.score), reason:m.reason})).filter(m => m.w);
        buyTip = r.buy_tip || null; src = 'Sommelier-AI';
        if(matches.length){
          S.pairCache = (S.pairCache||[]).filter(c => c.key !== key);
          S.pairCache.unshift({key, dish, at:Date.now(), matches:matches.map(m => ({id:m.w.id, score:m.score, reason:m.reason})), buyTip});
          S.pairCache = S.pairCache.slice(0, 30);
          save();
        }
      }catch(e){ matches = null; }
    }
    if(!matches || !matches.length){
      const r = winesForDish(dish); src = 'Kelderregels';
      matches = r.list.map(x => ({w:x.w, score:x.score, reason:x.rHtml}));
      if(!matches.length && r.cats.length) buyTip = 'Niets ideaals op voorraad. Kooptip: ' + r.cats[0].buy + '.';
    }
  }
  if(matches.length){
    const meta = src === 'Opgeslagen' ? `Opgeslagen · ${new Date(cachedAt).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}` : src;
    html = `<div class="mb8" style="display:flex;gap:10px;align-items:center"><span class="srcchip">${esc(meta)}</span>${src==='Opgeslagen'?`<button class="linkbtn" style="font-size:12.5px" data-act="pairFresh" data-d="${esc(dish)}">↻ vernieuw</button>`:''}</div>` + matches.map(m => {
      const st = windowStatus(m.w);
      const urg = st.k === 'nu' ? 'Moet toch binnenkort op — vanavond is een mooi excuus.'
                : st.k === 'over' ? 'Over z\'n venster heen — juist nú opdrinken, niet langer bewaren.' : '';
      return `<div class="match"><div class="match-top"><div style="min-width:0">
        <div class="wname" style="font-size:16px">${esc(m.w.name)}</div>
        <div class="wsub">${esc([m.w.producer, m.w.vintage||'NV'].filter(Boolean).join(' · '))} · ×${m.w.qty}</div>
        <div class="wmeta mt8">${dotHtml(m.w.type)}<span class="badge ${st.cls}">${st.label}${st.sub?' · '+st.sub:''}</span></div></div>
        <div class="mscore">${m.score}<small>/10</small></div></div>
        <div class="mreason">${esc(m.reason||'')}</div>
        ${urg?`<div class="mreason" style="color:var(--warn);font-weight:600">⏳ ${urg}</div>`:''}
        <div class="mt8"><button class="linkbtn" data-act="detail" data-id="${m.w.id}">Bekijk fles →</button></div></div>`;
    }).join('');
    if(buyTip) html += `<div class="banner"><span>🛒</span><span>${esc(buyTip)}</span></div>`;
  } else {
    html = `<div class="empty"><div class="big">Geen goede match</div><p>${buyTip?esc(buyTip):'Probeer het gerecht anders te omschrijven.'}</p></div>`;
  }
  pairOut = html; out.innerHTML = html;
}

/* ================= OVERZICHT ================= */
function barRows(pairs, dot){
  const mx = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(p => `<div class="brow"><span class="l">${dot?dotHtml(p[2]):''}${esc(p[0])}</span>
    <span class="track"><span class="fill" style="width:${Math.max(4, p[1]/mx*100)}%"></span></span>
    <span class="v tnum">${p[1]}</span></div>`).join('');
}
function viewOverzicht(){
  const bc = bottleCount(), val = cellarValue();
  let totLow = 0, totHigh = 0;
  S.wines.forEach(w => { const q = w.qty||0, b = Number(w.value ?? w.price)||0; if(!q || !b) return;
    totLow += q * (Number(w.valueLow) || b*0.8); totHigh += q * (Number(w.valueHigh) || b*1.2); });
  totLow = Math.round(totLow); totHigh = Math.round(totHigh);
  const ready = S.wines.filter(w => w.qty>0 && ['op','nu'].includes(windowStatus(w).k));
  const readyN = ready.reduce((n,w)=>n+w.qty,0);
  const thisYear = S.history.filter(h => (h.date||'').slice(0,4) == YR()).length;
  const soon = S.wines.filter(w => w.qty>0 && ['nu','over'].includes(windowStatus(w).k))
    .sort((a,b)=>URG[windowStatus(a).k]-URG[windowStatus(b).k] || (a.drinkTo||9999)-(b.drinkTo||9999)).slice(0,5);
  const byType = Object.keys(TYPES).map(t => [TYPES[t].l, S.wines.filter(w=>w.type===t).reduce((n,w)=>n+(w.qty||0),0), t]).filter(p=>p[1]>0);
  const landC = {};
  S.wines.forEach(w => { const c=(w.country||'Onbekend'); landC[c]=(landC[c]||0)+(w.qty||0); });
  const byLand = Object.entries(landC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const jaarC = {};
  S.wines.forEach(w => { const j=w.vintage||'NV'; jaarC[j]=(jaarC[j]||0)+(w.qty||0); });
  const byJaar = Object.entries(jaarC).filter(p=>p[1]>0).sort((a,b)=> (b[0]==='NV')?-1:(a[0]==='NV')?1:b[0]-a[0]).slice(0,8);
  const locC = {};
  S.wines.forEach(w => { const l = w.location||'Zonder locatie'; locC[l]=(locC[l]||0)+(w.qty||0); });
  const byLoc = Object.entries(locC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const locMax = Math.max(1, ...byLoc.map(p=>p[1]));
  const recent = S.history.slice(0,4);
  if(!S.wines.length && !S.history.length)
    return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">Nog niets te zien</h2>
      <div class="empty"><p>Zodra er flessen in je kelder liggen zie je hier voorraad, waarde, drinkvensters en je historie.</p>
      <button class="btn" data-act="tab" data-tab="scan" style="max-width:240px">Scan je eerste fles</button></div>`;
  return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">${esc(S.settings.cellarName)}</h2>
    <div class="tiles">
      <button class="tile" data-act="tileAll"><div class="k">Flessen</div><div class="n">${bc}</div><div class="s">tik voor de lijst</div></button>
      <div class="tile"><div class="k">Kelderwaarde</div><div class="n">${val?money(val):'—'}</div>${val?`<div class="s tnum">${money(totLow)} – ${money(totHigh)}</div>`:''}</div>
      <button class="tile" data-act="tileDronk"><div class="k">Nu op dronk</div><div class="n" style="color:var(--ok)">${readyN}</div><div class="s">tik voor de lijst</div></button>
      <div class="tile"><div class="k">Gedronken in ${YR()}</div><div class="n">${thisYear}</div></div>
    </div>
    ${soon.length?`<div class="sect"><div class="eyebrow mb8">Drink binnenkort</div><div class="panel">${soon.map(w=>{const st=windowStatus(w);
      return `<button class="rowline" style="width:100%;text-align:left" data-act="detail" data-id="${w.id}"><span class="a"><div class="t">${esc(w.name)} ${w.vintage||''}</div><div class="u">×${w.qty}${w.location?' · '+esc(w.location):''}</div></span><span class="z"><span class="badge ${st.cls}">${st.sub||st.label}</span></span></button>`;}).join('')}</div></div>`:''}
    ${byType.length?`<div class="sect"><div class="eyebrow mb8">Per type</div><div class="panel">${barRows(byType,true)}</div></div>`:''}
    ${byLand.length?`<div class="sect"><div class="eyebrow mb8">Per land</div><div class="panel">${barRows(byLand)}</div></div>`:''}
    ${byJaar.length?`<div class="sect"><div class="eyebrow mb8">Per jaargang</div><div class="panel">${barRows(byJaar)}</div></div>`:''}
    ${byLoc.length?`<div class="sect"><div class="eyebrow mb8">Per locatie</div><div class="panel">${byLoc.map(p=>{
      const e = p[0]==='Zonder locatie' ? null : locEntry(p[0]);
      return `<button class="brow" style="width:100%" data-act="filterLoc" data-l="${p[0]==='Zonder locatie'?'::none':esc(p[0])}">
        <span class="l">${(e&&e.photo)?`<img data-photo="${e.id}" style="width:22px;height:22px;border-radius:6px;object-fit:cover;flex:none" alt="">`:''}${esc(p[0])}</span>
        <span class="track"><span class="fill" style="width:${Math.max(4, p[1]/locMax*100)}%"></span></span>
        <span class="v tnum">${p[1]}</span></button>`;
    }).join('')}</div></div>`:''}
    ${recent.length?`<div class="sect"><div class="eyebrow mb8">Onlangs gedronken</div><div class="panel">${recent.map(h=>
      `<div class="rowline"><span class="a"><div class="t">${esc(h.name)} ${h.vintage||''}</div><div class="u">${h.extern?'🍽️ ':''}${esc(h.date)}${h.note?' · '+esc(h.note.slice(0,42)):''}</div></span><span class="z starmini">${h.rating!=null?(h.rating===0?'0 ★':'★'.repeat(h.rating)):''}</span></div>`).join('')}
      <div class="center mt8"><button class="linkbtn" data-act="goHistory">Bekijk hele historie →</button></div></div></div>`:''}`;
}

async function saveFile(name, text){
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:name, data:text}); toast('Back-up opgeslagen'); }
    catch(e){
      if(e && e.code === 'declined') return;
      if(e && e.code === 'rate_limited'){ toast('Er staat nog een download open — probeer zo weer'); return; }
      try{ await navigator.clipboard.writeText(text); toast('Downloaden lukte niet — back-up staat op je klembord'); }
      catch(e2){ toast('Back-up maken lukte niet'); }
    }
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Back-up gedownload');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Back-up staat op je klembord'); }catch(e2){ toast('Back-up maken lukte niet'); }
  }
}

<script>
'use strict';
/* ================= CLOUD-SYNC (Supabase) =================
   Inloggen met e-mail + wachtwoord (eenmalig per apparaat). Elke wijziging wordt
   met een korte vertraging naar de cloud gepusht; bij openen wordt de nieuwste
   versie opgehaald (last-write-wins op documentniveau, foto's incrementeel).
   API-sleutel (AI) en sessietokens verlaten het apparaat nooit. */
const SB_URL = 'https://dbzgrkipcoebglacsqwe.supabase.co';
const SB_KEY = 'sb_publishable_Qvrq6CS6M-CPY5nwQ6suAw_lkpwYrYR';
const CLOUD_OK = !IN_SANDBOX;

let sbAccess = null;
let syncTimer = null, syncBusy = false, syncAgain = false, lastSyncNote = '';

function cloud(){ if(!S.settings.cloud) S.settings.cloud = {refresh:null, email:null, uid:null, lastSync:null}; return S.settings.cloud; }
function loggedIn(){ return CLOUD_OK && !!cloud().refresh; }

async function sbFetch(path, opts, noAuth){
  opts = opts || {};
  const h = { 'apikey': SB_KEY, 'content-type': 'application/json', ...(opts.headers||{}) };
  if(!noAuth && sbAccess) h['authorization'] = 'Bearer ' + sbAccess;
  const res = await fetch(SB_URL + path, {...opts, headers: h});
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    const e = new Error('HTTP ' + res.status + ' ' + t.slice(0,160)); e.status = res.status; throw e;
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

function applySession(s){
  sbAccess = s.access_token || sbAccess;
  const c = cloud();
  if(s.refresh_token) c.refresh = s.refresh_token;
  if(s.user){ c.uid = s.user.id; c.email = s.user.email; }
  save(true);
}

async function sbSignup(email, pass){
  const r = await sbFetch('/auth/v1/signup', {method:'POST', body:JSON.stringify({email, password:pass})}, true);
  if(r.access_token){ applySession(r); return 'ok'; }
  return 'confirm';
}
async function sbLogin(email, pass){
  const r = await sbFetch('/auth/v1/token?grant_type=password', {method:'POST', body:JSON.stringify({email, password:pass})}, true);
  applySession(r); return 'ok';
}
async function sbRefresh(){
  if(!cloud().refresh) return false;
  try{
    const r = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token: cloud().refresh})}, true);
    applySession(r); return true;
  }catch(e){
    if(e.status === 400 || e.status === 401 || e.status === 403){ const c = cloud(); c.refresh = null; sbAccess = null; save(true); }
    return false;
  }
}
function sbLogout(){
  try{ if(sbAccess) sbFetch('/auth/v1/logout', {method:'POST'}).catch(()=>{}); }catch(e){}
