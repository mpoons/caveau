<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>CellarMentor film, ronde 3</title>
<!-- De film "zo werkt het", ronde 3 (na de tweede kritiek): zoeker met sluiter in beeld (0–1,0 s), afdrukken,
     het venster staat er op 2,0 s en licht één keer op; geen formulierscherm meer; harde overgangen naar en van
     de donkere wijnkaartscène; Horizon is weg vóór de eindkaart komt; het toestel past altijd helemaal in beeld.
     ?f=st|p45|sq &l=nl|en &m=nl|be|uk. Beeldreeksen in reeks/<taal>/ (0–29 live, 30–55 bevestigen, 56–67 kaartje). -->
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 900;src:url(fonts/playfair-normal-latin.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400 900;src:url(fonts/playfair-italic-latin.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400 800;src:url(fonts/ebgaramond-normal-latin.woff2) format('woff2')}
@font-face{font-family:'Open Sans';font-weight:600;src:url(fonts/opensans.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
#doek{position:relative;overflow:hidden;background:#F6F2EA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#nacht{position:absolute;inset:0;background:#1B1418;opacity:0}
.merk{position:absolute;font-family:'EB Garamond',serif;font-variant:small-caps;text-transform:lowercase;letter-spacing:.14em;font-weight:500;color:#241B1F;z-index:4}
.kap{position:absolute;z-index:4}
.kap .k{font-family:'EB Garamond',serif;font-variant:small-caps;text-transform:lowercase;letter-spacing:.18em;color:#8A6930;font-weight:500;margin-bottom:.45em}
.kap h1{font-family:'Playfair Display',serif;font-weight:500;line-height:1.04;letter-spacing:-.012em;color:#241B1F;text-wrap:balance}
.kap h1 em{display:block;font-style:italic;color:#6E1F33}
.kap.donker h1{color:#E9DFD0} .kap.donker h1 em{color:#D9B56E} .kap.donker .k{color:#C9A25A}
.toestel{position:absolute;left:50%;background:#1D1719;box-shadow:0 70px 120px -40px rgba(60,20,30,.55),0 24px 50px -24px rgba(36,27,31,.45);z-index:2}
.scherm{position:relative;overflow:hidden;background:#F6F2EA}
.scherm img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0}
#flits{position:absolute;inset:0;background:#fff;opacity:0;z-index:3}
#hz{position:absolute;z-index:2;opacity:0;box-shadow:0 1px 0 #C8A96A,0 -1px 0 #C8A96A}
#hz img{display:block;width:100%}
#eind{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;background:#F6F2EA;z-index:6}
#eind .wm{font-family:'EB Garamond',serif;font-variant:small-caps;text-transform:lowercase;letter-spacing:.16em;font-weight:500;color:#241B1F}
#eind h2{font-family:'Playfair Display',serif;font-weight:500;line-height:1.05;color:#241B1F;margin:.5em 0 .55em}
#eind h2 em{font-style:italic;color:#6E1F33;display:block}
#eind .cta{background:#6E1F33;color:#FFF8F0;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:6px}
#eind .url{font-family:'EB Garamond',serif;font-variant:small-caps;text-transform:lowercase;letter-spacing:.16em;color:#6B5A60;margin-top:1em}
#nix{position:absolute;z-index:7;font-weight:800;color:#241B1F;border:3px solid currentColor;border-radius:8px;padding:.04em .3em;line-height:1.12;background:#F6F2EA}
#band{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#241B1F;color:#F6F2EA;font-family:'Open Sans',sans-serif;font-weight:600;text-align:center;line-height:1.36;box-shadow:inset 0 2px 0 #C8A96A}
#puls{position:absolute;left:3.5%;right:3.5%;top:35.4%;height:4.6%;border:3px solid #C9A25A;border-radius:10px;opacity:0;z-index:2;box-shadow:0 0 24px rgba(201,162,90,.55)}
</style>
</head>
<body>
<div id="doek">
  <div id="nacht"></div>
  <div class="merk" id="merk">CellarMentor</div>
  <div id="kappen"></div>
  <div class="toestel" id="toestel"><div class="scherm" id="scherm"><div id="flits"></div><div id="puls"></div></div></div>
  <div id="hz"><img id="hzImg" alt=""></div>
  <div id="eind"><div class="wm">CellarMentor</div><h2 id="eindH"></h2><div class="cta" id="eindC"></div><div class="url">cellarmentor.com</div></div>
  <div id="nix" hidden>NIX18</div><div id="band" hidden>Alcoholmisbruik schaadt de gezondheid</div>
</div>
<script>
const q = new URLSearchParams(location.search);
const F = q.get('f') || 'st', L = q.get('l') || 'nl', MARKT = q.get('m') || (L === 'en' ? 'uk' : 'nl');
const DUUR = 17;
const T = {
  nl:{ s1:['Eén foto','Scan het etiket.',''], s2:['Drinkvenster','Weet wanneer',"je&nbsp;'m&nbsp;opent."], s3:['Uit je eigen kelder','Zeg wat je eet.','Dit is je fles.'],
       s4:['Uit eten','Uit eten?','CellarMentor leest&nbsp;mee.'], s5:['Horizon',"Welke fles is nu op z'n&nbsp;best?",''], eind:['Open elke fles',"op z'n best."], cta:'Scan je eerste fles' },
  en:{ s1:['One photo','Scan the label.',''], s2:['Drinking window','Know when','to open&nbsp;it.'], s3:['From your own cellar',"Say what you're eating.","Here's your bottle."],
       s4:['Dining out','Dining out?','It reads the wine&nbsp;list.'], s5:['Horizon','Which bottle is at its best right&nbsp;now?',''], eind:['Open every bottle','at its best.'], cta:'Scan your first bottle' } }[L];
const M = {
  st: { w:1080, h:1920, merk:[96,250,32], kapTop:316, kapL:96, kapW:900, k:30, h1:84, tTop:600, hzTop:640 },
  p45:{ w:1080, h:1350, merk:[84,84,28], kapTop:150, kapL:84, kapW:920, k:26, h1:70, tTop:390, hzTop:420 },
  sq: { w:1080, h:1080, merk:[84,84,26], kapTop:140, kapL:84, kapW:440, k:24, h1:62, tTop:96, hzTop:400, naast:true },
}[F];
/* het hele toestel (met sluiter) past tussen tTop en de onderkant, of boven de Belgische band */
const bandF = Math.round(M.w * .032), bandPadOnder = F === 'st' ? 340 : bandF, bandH = MARKT === 'be' ? Math.round(bandF * 1.36 + bandF + bandPadOnder) : 0;
const bodem = M.h - (MARKT === 'be' ? bandH : (F === 'st' ? 340 : 40)) - 22;
M.tw = Math.min(M.naast ? 430 : 560, Math.floor((bodem - M.tTop) / 2.085));
const doek = document.getElementById('doek');
doek.style.width = M.w + 'px'; doek.style.height = M.h + 'px';
const merk = document.getElementById('merk'); merk.style.left = M.merk[0] + 'px'; merk.style.top = M.merk[1] + 'px'; merk.style.fontSize = M.merk[2] + 'px';
const toestel = document.getElementById('toestel'), scherm = document.getElementById('scherm');
const pd = Math.round(M.tw * .034), sw = M.tw - 2 * pd, sh = Math.round(sw * 844 / 390);
toestel.style.width = M.tw + 'px'; toestel.style.padding = pd + 'px'; toestel.style.borderRadius = Math.round(M.tw * .145) + 'px';
scherm.style.width = sw + 'px'; scherm.style.height = sh + 'px'; scherm.style.borderRadius = Math.round(M.tw * .115) + 'px';
if (M.naast) { toestel.style.left = 'auto'; toestel.style.right = '70px'; }
/* beelden: de opgenomen reeks, en de vaste schermen uit ui2 */
const reeks = []; for (let i = 0; i < 68; i++) { const im = new Image(); im.src = `reeks/${L}/${String(i).padStart(3, '0')}.jpg`; scherm.appendChild(im); reeks.push(im); }
const vast = {}; for (const n of ['detail', 'pairing', 'wijnkaart']) { const im = new Image(); im.src = `ui2/${L}-${n}.png`; scherm.appendChild(im); vast[n] = im; }
vast.wijnkaart.style.top = '-10.3%'; vast.wijnkaart.style.height = '110.3%';   /* begint bij de SOMMELIER-regel, zoals de stills */
const hz = document.getElementById('hz'); document.getElementById('hzImg').src = `ui2/${L}-horizon.png`;
const hzW = M.naast ? 600 : M.w - 2 * M.kapL; hz.style.width = hzW + 'px'; hz.style.left = (M.naast ? M.w - 600 - 60 : M.kapL) + 'px'; hz.style.top = M.hzTop + 'px';
const kappen = document.getElementById('kappen'), kap = {};
for (const s of ['s1', 's2', 's3', 's4', 's5']) {
  const d = document.createElement('div'); d.className = 'kap' + (s === 's4' ? ' donker' : '');
  d.style.top = M.kapTop + 'px'; d.style.left = M.kapL + 'px'; d.style.width = M.kapW + 'px';
  d.innerHTML = `<div class="k" style="font-size:${M.k}px">${T[s][0]}</div><h1 style="font-size:${M.h1}px">${T[s][1]}${T[s][2] ? `<em>${T[s][2]}</em>` : ''}</h1>`;
  kappen.appendChild(d); kap[s] = d;
}
const eind = document.getElementById('eind');
document.getElementById('eindH').innerHTML = `${T.eind[0]}<em>${T.eind[1]}</em>`; document.getElementById('eindH').style.fontSize = (M.h1 * 1.08) + 'px';
eind.querySelector('.wm').style.fontSize = (M.merk[2] * 1.2) + 'px';
const ctaEl = document.getElementById('eindC'); ctaEl.textContent = T.cta; ctaEl.style.fontSize = Math.round(M.k * 1.0) + 'px'; ctaEl.style.padding = `${Math.round(M.k * .8)}px ${Math.round(M.k * 1.5)}px`;
eind.querySelector('.url').style.fontSize = M.k + 'px';
const nix = document.getElementById('nix'), band = document.getElementById('band');
if (MARKT === 'nl') { nix.hidden = false; nix.style.fontSize = Math.round(M.w * .036) + 'px'; nix.style.right = M.kapL + 'px'; nix.style.top = (M.merk[1] - 8) + 'px';   /* naast het woordmerk, nooit over het scherm */ }
if (MARKT === 'be') { band.hidden = false; band.style.fontSize = bandF + 'px'; band.style.padding = `${bandF}px 10px ${bandPadOnder}px`; }   /* JEP: onderaan, volle breedte, contrasterend, marge = teksthoogte */

const ease = x => { x = Math.min(1, Math.max(0, x)); return 1 - Math.pow(1 - x, 3); };
const venster = (t, a, b, fade = .4) => Math.min(ease((t - a) / fade), 1 - ease((t - (b - fade)) / fade));
const nacht = document.getElementById('nacht'), flits = document.getElementById('flits');
/* tijdlijn (s) */
const SC = [['s1', 0, 1.95], ['s2', 1.9, 5.2], ['s3', 5.1, 8.4], ['s4', 8.3, 11.4], ['s5', 11.3, 14.2]];
window.zet = function (t) {
  for (const [s, a, b] of SC) { const o = a === 0 ? (t < b - .4 ? 1 : 1 - ease((t - (b - .4)) / .4)) : venster(t, a, b); kap[s].style.opacity = o; kap[s].style.transform = `translateY(${a === 0 ? 0 : (1 - ease((t - a) / .6)) * 16}px)`; }
  /* reeks: 0–29 zoeker (0–1,0 s), sluiter op 1,0 s, 30–35 de foto en de eerste gegevens (1,0–1,5 s),
     56–67 het fleskaartje schuift omhoog (1,5–2,0 s); het formulier (36–55) zit er niet meer in */
  let fr = -1;
  if (t < 1.0) fr = Math.min(29, Math.floor(t / 1.0 * 30));
  else if (t < 1.5) fr = 30 + Math.min(5, Math.floor((t - 1.0) / .5 * 6));
  else if (t < 2.0) fr = 56 + Math.min(11, Math.floor((t - 1.5) / .5 * 12));
  reeks.forEach((im, i) => im.style.opacity = i === fr ? 1 : 0);
  flits.style.opacity = Math.max(0, .85 - Math.abs(t - 1.0) * 8);
  vast.detail.style.opacity = t >= 2.0 && t < 5.25 ? (t < 5.1 ? 1 : 1 - ease((t - 5.1) / .15)) : 0;
  document.getElementById('puls').style.opacity = Math.max(0, Math.sin(Math.min(1, Math.max(0, (t - 2.3) / .9)) * Math.PI));
  vast.pairing.style.opacity = venster(t, 5.1, 8.36, .15);
  /* harde overgang naar en van de donkere scène: geen grijze tussenstand meer */
  const donker = t >= 8.3 && t < 11.35;
  vast.wijnkaart.style.opacity = donker ? 1 : 0;
  nacht.style.opacity = donker ? 1 : 0;
  merk.style.color = donker ? '#E9DFD0' : '#241B1F';
  /* het toestel: komt rustig omhoog, wijkt bij Horizon voor de uitsnede */
  const y = M.tTop + (1 - ease(t / .6)) * 40 - Math.min(t, 11) * 1.5;
  toestel.style.transform = (M.naast ? '' : 'translateX(-50%) ') + `translateY(${y - (M.naast ? 0 : 0)}px)`;
  toestel.style.top = '0px';
  toestel.style.opacity = t < 11.35 ? 1 : 0;   /* harde snede samen met het licht: geen leeg toestel in beeld */
  /* Horizon is helemaal weg voordat de eindkaart opkomt: geen rijen meer onder de eindtekst */
  hz.style.opacity = venster(t, 11.45, 14.25, .35); hz.style.transform = `translateY(${(1 - ease((t - 11.45) / .7)) * 20}px)`;
  eind.style.opacity = ease((t - 14.3) / .45); eind.style.transform = `translateY(${(1 - ease((t - 14.3) / .7)) * 14}px)`;
};
window.DUUR = DUUR;
const alles = [...reeks, ...Object.values(vast), document.getElementById('hzImg')];
Promise.all([document.fonts.ready, ...alles.map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))]).then(() => { zet(0); document.body.dataset.klaar = '1'; });
</script>
</body>
</html>
