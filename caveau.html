<script>
'use strict';
/* ================= SCAN ================= */
let scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false };
function scanReset(){ scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false }; recalcPairing = null; recalcValueRange = null; }

function aiBanner(){
  if(IN_SANDBOX) return `<div class="banner"><span>ℹ️</span><span><b>Etiket-lezen met AI staat uit</b> in deze omgeving (de app-sandbox blokkeert externe verbindingen). Foto's bewaren en zelf invullen werkt gewoon. De ingebouwde sommelier-regels schatten drinkvenster en pairing. Host je het bestand zelf, dan leest Claude etiketten automatisch.</span></div>`;
  if(!aiReady()) return `<div class="banner"><span>ℹ️</span><span><b>Log in en de sommelier leest je etiketten</b>: naam, druiven, drinkvenster en pairing in één foto. Je krijgt ${FREE_CREDITS} gratis credits per maand: <button class="linkbtn" data-act="goAccount">account aanmaken</button>. Zonder inloggen werkt alles behalve het automatisch lezen.</span></div>`;
  return '';
}
function viewScan(){
  if(scan.stage === 'idle'){
    return `${brandRow('')}
      <div class="scanhero">
        <div class="eyebrow">Etiket scannen</div>
        <h2 class="h2">Richt je camera op de fles</h2>
        <button class="scanbig" data-act="scanCam" aria-label="Open camera">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1l1.4-2h6.2L16.5 6h1A2.5 2.5 0 0 1 20 8.5v7A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5v-7Z"/><circle cx="12" cy="12" r="3.4"/></svg>
          <span>Scan etiket</span></button>
        <p class="small" style="max-width:300px;margin:0 auto">Herkennen, toevoegen, info bekijken of afboeken: de foto is genoeg.</p>
        <div class="btnrow mt14" style="max-width:340px;margin-left:auto;margin-right:auto">
          <button class="btn plain" data-act="scanLib">Kies een foto</button>
          <button class="btn plain" data-act="wineNew">Handmatig</button>
        </div>
        <button class="linkbtn mt14" data-act="goMenu">📋 Uit eten? Scan de wijnkaart →</button>
      </div>${aiBanner()}`;
  }
  /* confirm-stadium */
  const d = scan.data || {};
  const pre = {
    name:d.name||'', producer:d.producer||'', vintage:d.vintage||null,
    type:d.type?mapType(d.type):'rood', grapes:d.grapes||[], country:d.country||'', region:d.region||'',
    appellation:d.appellation||'', drinkFrom:d.drink_from||null, drinkTo:d.drink_to||null,
    price:null, value:(d.value_eur!=null?Math.round(d.value_eur):null), location:(S.settings.lastLocation||''), note:d.note||'', score:d.score_seen||''
  };
  return `${brandRow('')}
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn sm plain" data-act="scanAgain">‹ Annuleer</button>
      <button class="btn sm plain" data-act="scanNewPhoto">📷 Nieuwe foto</button>
    </div>
    <div class="scanprev">${bottleSvg}<img id="scanImg" alt="Gescand etiket"></div>
    ${scan.busy ? `<div class="banner">${pourSvg}<span class="pulse" id="scanLive">De sommelier leest het etiket…</span></div>` : ''}
    ${scan.err ? `<div class="banner"><span>⚠️</span><span><b>Automatisch lezen lukte niet</b> (${esc(scan.err)}). Probeer het nog eens, of vul de velden (deels) zelf in en tik op "Herbereken". De foto blijft bewaard.<br><button class="btn sm ghost mt8" data-act="scanRetry">↻ Probeer opnieuw te lezen</button></span></div>` : ''}
    ${(!scan.busy && scan.data) ? `<div class="banner"><span>🍷</span><span><span class="srcchip">Sommelier-AI</span>${d.note?` ${esc(d.note)}`:''}${(d.pairing&&d.pairing.length)?`<br><b>Lekker bij:</b> ${esc(d.pairing.slice(0,4).join(' · '))}`:''}</span></div>` : ''}
    ${(!scan.busy && scan.data && smaakHit(pre)) ? `<div class="banner"><span>♥</span><span>Een druif of streek waar je van houdt.</span></div>` : ''}
    ${(!scan.busy && scan.data && d.value_eur!=null && verdict({...pre, valueSrc:'ai', qty:formQty})) ? `<div class="banner"><span>🏅</span><span>${esc(verdict({...pre, valueSrc:'ai', qty:formQty}))}</span></div>` : ''}
    ${(!scan.busy && scan.data && !d.vintage) ? `<div class="banner"><span>📅</span><span><b>Jaargang niet op het etiket gevonden</b>. Het venster hieronder is een grove schatting. Vul de jaargang in bij "Jaargang"; het drinkvenster rekent dan vanzelf bij. Geen jaargang (NV)? Laat het veld leeg.</span></div>` : ''}
    ${scan.match ? `<div class="matchbanner"><b>${esc(scan.match.name)} ${scan.match.vintage||''}</b> staat al in je kelder (×${scan.match.qty}). Flessen bijboeken, of juist één afboeken?</div>` : ''}
    ${scan.busy ? '' : `<div class="panel" style="padding:11px 13px;margin-bottom:12px"><div class="eyebrow mb8">Snel wegleggen</div>
      <div style="display:flex;gap:8px"><select class="inp" id="quickLoc" data-in="quickLoc" style="flex:1;min-width:0" aria-label="Locatie">${locSelectOptions(pre.location)}</select>
      <button class="btn sm" data-act="${scan.match?'scanMerge':'scanAdd'}" style="flex:none">+ Kelder in</button></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px"><input type="checkbox" id="scanTonight" style="width:18px;height:18px;accent-color:var(--acc)"> 🍷 Vanavond drinken, herinner me om af te strepen</label></div>`}
    ${formFields(pre)}
    <div class="field"><label>Aantal flessen</label>
      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">${formQty}</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>
    ${scan.match ? `<button class="btn" data-act="scanMerge" style="margin-bottom:9px">+<span id="mq">${formQty}</span> bijboeken bij bestaande</button>
      <button class="btn ghost" data-act="scanRemove" style="margin-bottom:9px">Drink / haal er één uit de kelder</button>` :
      `<button class="btn" data-act="scanAdd" style="margin-bottom:9px" ${scan.busy?'disabled':''}>In de kelder leggen</button>`}
    <button class="btn ghost" data-act="scanDrinkNow" style="margin-bottom:9px" ${scan.busy?'disabled':''}>🥂 Drink nu, buiten de kelder om</button>
    <div class="btnrow">
      ${scan.match?`<button class="btn soft" data-act="scanAdd">Als nieuwe bewaren</button>`:`<button class="btn soft" data-act="scanWish" ${scan.busy?'disabled':''}>Op verlanglijst</button>`}
      <button class="btn plain" data-act="scanAgain">Opnieuw</button>
    </div>`;
}
ACT.goImport = () => { UI.tab='meer'; UI.meerPage='import'; render(); };
ACT.scanCam = () => openLiveScan();
ACT.scanLib = () => { photoTarget = 'etiket'; document.getElementById('fLib').click(); };
ACT.scanAgain = () => { scanReset(); render(); };
ACT.scanNewPhoto = () => openLiveScan();

/* ================= live-scanner: QR-gevoel met auto-vangst ================= */
let liveStream = null, liveTimer = null, livePrev = null, liveStable = 0, liveEl = null, liveStartAt = 0;
/* zaklamp: alleen Android/Chrome kan dit via getUserMedia; iOS Safari niet.
   De knop verschijnt daarom pas als de camera zelf zegt dat hij het kan. */
let liveTorch = false;
async function liveTorchInit(){
  liveTorch = false;
  try{
    const t = liveStream && liveStream.getVideoTracks()[0];
    const caps = t && t.getCapabilities ? t.getCapabilities() : null;
    if(caps && caps.torch){
      const b = document.getElementById('liveTorchBtn');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
}
ACT.liveTorch = async el => {
  const t = liveStream && liveStream.getVideoTracks()[0];
  if(!t) return;
  try{
    liveTorch = !liveTorch;
    await t.applyConstraints({ advanced:[{ torch: liveTorch }] });
    el.textContent = liveTorch ? '🔦 aan' : 'zaklamp';
    el.style.opacity = liveTorch ? '1' : '.75';
  }catch(e){ liveTorch = false; toast('De zaklamp lukt niet op dit toestel'); }
};
/* 'etiket' = automatisch vangen bij stil+scherp beeld; 'kaart' = wijnkaart, zelf afdrukken */
let liveMode = 'etiket';
/* waar een gekozen/gemaakte foto heen gaat: 'etiket' (fles) of 'kaart' (wijnkaart) */
let photoTarget = 'etiket';
async function openLiveScan(mode){
  liveMode = mode || 'etiket'; photoTarget = liveMode;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ document.getElementById('fCam').click(); return; }
  try{
    liveStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false });
  }catch(e){ document.getElementById('fCam').click(); return; } /* geweigerd of geen camera → systeemcamera */
  const kaart = liveMode === 'kaart' || liveMode === 'menu';
  const div = document.createElement('div'); div.className = 'livewrap'; div.id = 'liveScan';
  div.innerHTML = `<video autoplay playsinline muted></video>
    <div class="liveframe${kaart?' page':''}">${kaart?'':'<div class="livescanline"></div>'}</div>
    <div class="livehint" id="liveHint">${kaart?'Hele pagina in beeld, tik op de knop':'Houd het etiket in het kader, hij vangt vanzelf'}</div>
    <div class="liveflash" id="liveFlash"></div>
    <div class="livebar">
      <button class="livex" data-act="liveClose" aria-label="Sluiten">✕</button>
      <button class="liveshut" data-act="liveSnap" aria-label="Maak foto"></button>
      <button class="livelib" data-act="liveLib">galerij</button>
      <button class="livelib" id="liveTorchBtn" data-act="liveTorch" style="display:none;opacity:.75">zaklamp</button>
    </div>`;
  document.body.appendChild(div); liveEl = div;
  const v = div.querySelector('video'); v.srcObject = liveStream;
  liveStartAt = Date.now(); livePrev = null; liveStable = 0;
  liveTorchInit();
  liveTimer = setInterval(() => liveCheck(v), 260);
}
function closeLiveScan(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  if(liveStream){ try{ liveStream.getTracks().forEach(t => t.stop()); }catch(e){} liveStream = null; }
  if(liveEl){ liveEl.remove(); liveEl = null; }
}
ACT.liveClose = () => { const k = liveMode !== 'etiket'; closeLiveScan(); if(k) render(); };
ACT.liveLib = () => { closeLiveScan(); document.getElementById('fLib').click(); };
ACT.liveSnap = () => liveCapture();
function liveCheck(v){
  if(!v || !v.videoWidth) return;
  if(liveMode !== 'etiket'){ /* kaart of menu: geen auto-vangst, de gast kadreert zelf */
    const h = document.getElementById('liveHint');
    if(h) h.textContent = 'Hele pagina in beeld, tik op de knop';
    return;
  }
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  try{ ctx.drawImage(v, 0, 0, 64, 64); }catch(e){ return; }
  const d = ctx.getImageData(0, 0, 64, 64).data;
  const g = new Float32Array(4096);
  let sum = 0;
  for(let i = 0; i < 4096; i++){ const y = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3; g[i] = y; sum += y; }
  const mean = sum / 4096;
  let edge = 0;
  for(let y = 0; y < 64; y++) for(let x = 0; x < 63; x++) edge += Math.abs(g[y*64+x] - g[y*64+x+1]);
  edge /= 4032;
  let diff = 999;
  if(livePrev){ diff = 0; for(let i = 0; i < 4096; i += 4) diff += Math.abs(g[i] - livePrev[i]); diff /= 1024; }
  livePrev = g;
  /* Scherpte en beweging worden afgezet tegen de helderheid van het beeld zelf.
     In een donker restaurant zakt het contrast van álles evenredig mee: met een
     vaste drempel haalt een perfect scherp etiket het nooit en klikt de sluiter
     dus nooit. Relatief gemeten gedraagt hij zich bij kaarslicht als bij daglicht. */
  const ref = Math.max(mean, 26);
  const edgeRel = edge / ref * 100, diffRel = diff / ref * 100;
  const donker = mean < 26;
  const stil = diffRel < 4.5, scherp = edgeRel > 5 && edge > 2;
  liveStable = (stil && scherp && !donker) ? liveStable + 1 : 0;
  const hint = document.getElementById('liveHint');
  if(hint) hint.textContent = donker ? (liveTorch ? 'Nog te donker, houd hem dichterbij' : 'Te donker, zet de zaklamp aan of zoek licht')
    : !scherp ? 'Iets dichterbij, of even scherpstellen…'
    : !stil ? 'Houd stil…' : 'Vasthouden…';
  if(liveStable >= 3 && Date.now() - liveStartAt > 1200) liveCapture();
}
function liveCapture(){
  const v = liveEl && liveEl.querySelector('video');
  if(!v || !v.videoWidth) return;
  const kaart = liveMode === 'kaart' || liveMode === 'menu';
  if(liveTimer && !kaart){ clearInterval(liveTimer); liveTimer = null; }
  const fl = document.getElementById('liveFlash');
  if(fl){ fl.style.opacity = '0.75'; setTimeout(() => { if(fl) fl.style.opacity = '0'; }, 180); }
  /* een wijnkaart heeft meer resolutie nodig dan een etiket: kleine letters, veel regels */
  const sc = Math.min(1, (kaart ? 1568 : 1400) / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  if(kaart){
    /* camera blijft open: meerdere pagina's achter elkaar fotograferen */
    addMenuShot(c.toDataURL('image/jpeg', 0.82), liveMode);
    const n = shotList(liveMode).length;
    const h = document.getElementById('liveHint');
    if(n >= shotMax(liveMode)){ closeLiveScan(); render(); return; }
    if(h) h.textContent = `Pagina ${n} vastgelegd. Nog een pagina? Anders op ✕`;
    return;
  }
  c.toBlob(b => { closeLiveScan(); if(b) handlePhoto(b); }, 'image/jpeg', 0.88);
}

/* venster ontbreekt in het scanresultaat → altijd alvast een regels-schatting invullen */
function ensureWindow(d){
  if(d.drink_from && d.drink_to) return;
  const est = estimateWindow({ type: mapType(d.type||'rood'), grapes: d.grapes||[], region: d.region,
    appellation: d.appellation, country: d.country, name: d.name, vintage: d.vintage||null });
  d.drink_from = d.drink_from || est.from;
  d.drink_to = d.drink_to || est.to;
}
ACT.scanRetry = async () => {
  if(!scan.photo || scan.busy) return;
  if(!aiReady()){ toast('AI-scannen staat hier uit. Vul de velden in en gebruik Herbereken'); return; }
  scan.err = null; scan.busy = true; vensterAuto = true; scanTouched = new Set(); render(); showScanImg();
  try{
    const d = await aiScan(scan.photo, txt => {
      const el = document.getElementById('scanLive');
      if(el){ const p = scanPeek(txt); if(p){ el.textContent = p; el.classList.remove('pulse'); } }
      vulFormLive(scanPartial(txt));
    });
    ensureWindow(d);
    behoudEigenInvoer(d);
    scan.data = d;
    scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
  }catch(e){ scan.err = String(e.message||e).slice(0,120); }
  scan.busy = false; render(); showScanImg();
};

async function handlePhoto(file){
  if(!file) return;
  formQty = 1;
  try{
    scan.photo = await resizeImg(file, 1400, 0.85, {lift:true, keep:true});
    scan.thumb = await resizeImg(file, 380, 0.72);
  }catch(e){ toast('Foto kon niet worden gelezen'); return; }
  scan.stage = 'confirm'; scan.data = null; scan.err = null; scan.match = null; scanTouched = new Set();
  scan.busy = aiReady(); vensterAuto = true;
  UI.tab = 'scan'; render(); showScanImg();
  if(scan.busy){
    try{
      const d = await aiScan(scan.photo, txt => {
        const el = document.getElementById('scanLive');
        if(el){ const p = scanPeek(txt); if(p){ el.textContent = p; el.classList.remove('pulse'); } }
        vulFormLive(scanPartial(txt));
      });
      ensureWindow(d);
      behoudEigenInvoer(d);
      scan.data = d;
      scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
    }catch(e){ scan.err = String(e.message||e).slice(0,120); }
    scan.busy = false; render(); showScanImg();
  }
}

async function runPair(dish, force){
  if(!dish){ toast('Vertel eerst wat je gaat eten'); return; }
  const out = document.getElementById('pairOut'); if(!out) return;
  const key = norm(dish);
  let html = '', src = 'Kelderregels', matches = null, buyTip = null, cachedAt = null;
  /* eerder opgeslagen resultaat? (alleen wijnen die nog op voorraad zijn) */
  if(!force){
    const hit = (S.pairCache||[]).find(c => c.key === key);
    if(hit){
      const ms = (hit.matches||[]).map(m => ({w:findWine(m.id), score:m.score, reason:m.reason})).filter(m => m.w && m.w.qty > 0);
      if(ms.length){ matches = ms; buyTip = hit.buyTip||null; src = 'Opgeslagen'; cachedAt = hit.at; }
    }
  }
  if(!matches){
    out.innerHTML = `<div class="banner">${pourSvg}<span class="pulse">De sommelier proeft in gedachten…</span></div>`;
    if(aiReady()){
      try{
        const r = await aiDish(dish);
        matches = (r.matches||[]).map(m => ({w:findWine(m.id), score:Math.round(m.score), reason:m.reason})).filter(m => m.w);
        buyTip = r.buy_tip || null; src = 'Sommelier-AI';
        if(matches.length){
          S.pairCache = (S.pairCache||[]).filter(c => c.key !== key);
          S.pairCache.unshift({key, dish, at:Date.now(), matches:matches.map(m => ({id:m.w.id, score:m.score, reason:m.reason})), buyTip});
          S.pairCache = S.pairCache.slice(0, 30);
          save();
        }
      }catch(e){ matches = null; }
    }
    if(!matches || !matches.length){
      const r = winesForDish(dish); src = 'Kelderregels';
      matches = r.list.map(x => ({w:x.w, score:x.score, reason:x.rHtml}));
      if(!matches.length && r.cats.length) buyTip = 'Niets ideaals op voorraad. Kooptip: ' + r.cats[0].buy + '.';
    }
  }
  if(matches.length){
    const meta = src === 'Opgeslagen' ? `Opgeslagen · ${new Date(cachedAt).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}` : src;
    html = `<div class="mb8" style="display:flex;gap:10px;align-items:center"><span class="srcchip">${esc(meta)}</span>${src==='Opgeslagen'?`<button class="linkbtn" style="font-size:12.5px" data-act="pairFresh" data-d="${esc(dish)}">↻ vernieuw</button>`:''}</div>` + matches.map(m => {
      const st = windowStatus(m.w);
      const urg = st.k === 'nu' ? 'Moet toch binnenkort op, vanavond is een mooi excuus.'
                : st.k === 'over' ? 'Over z\'n venster heen. Juist nú opdrinken, niet langer bewaren.' : '';
      return `<div class="match"><div class="match-top"><div style="min-width:0">
        <div class="wname" style="font-size:16px">${esc(m.w.name)}</div>
        <div class="wsub">${esc([m.w.producer, m.w.vintage||'NV'].filter(Boolean).join(' · '))} · ×${m.w.qty}</div>
        <div class="wmeta mt8">${dotHtml(m.w.type)}<span class="badge ${st.cls}">${st.label}${st.sub?' · '+st.sub:''}</span>${topBadge(m.w)}</div></div>
        <div class="mscore">${m.score}<small>/10</small></div></div>
        ${smaakHit(m.w)?'<div class="mreason" style="color:var(--acc-ink)">♥ Past bij je smaak</div>':''}
        <div class="mreason">${esc(m.reason||'')}</div>
        ${urg?`<div class="mreason" style="color:var(--warn);font-weight:600">⏳ ${urg}</div>`:''}
        <div class="mt8" style="display:flex;gap:16px;flex-wrap:wrap"><button class="linkbtn" data-act="${onTable(m.w.id)?'tafelAf':'tafelOp'}" data-id="${m.w.id}">${onTable(m.w.id)?'✓ Op tafel':'✓ Deze kies ik'}</button><button class="linkbtn" data-act="detail" data-id="${m.w.id}">Bekijk fles →</button><button class="linkbtn" data-act="askSomm" data-id="${m.w.id}" data-dish="${esc(dish)}">💬 Vraag</button></div></div>`;
    }).join('');
    if(buyTip) html += `<div class="banner"><span>🛒</span><span>${esc(buyTip)}</span></div>`;
  } else {
    html = `<div class="empty"><div class="big">Geen goede match</div><p>${buyTip?esc(buyTip):'Probeer het gerecht anders te omschrijven.'}</p></div>`;
  }
  pairOut = html; out.innerHTML = html;
}

/* zonder AI (of als vangnet): waar je bij dit gerecht op de kaart naar zoekt: de kelderregels omgedraaid */
function menuGuideHtml(dish, primary){
  const t = norm(dish);
  const cats = FOODS.filter(f => f.kw.some(k => t.includes(norm(k))));
  if(!cats.length){
    return primary ? `<div class="banner"><span>🤔</span><span>Dit gerecht kan ik zonder AI niet plaatsen. Omschrijf het wat gewoner ("iets met kip", "witte vis"), of log in, dan leest de sommelier de kaart écht.</span></div>` : '';
  }
  const wsum = {};
  cats.forEach(c => Object.keys(c.w).forEach(k => { wsum[k] = (wsum[k]||0) + c.w[k]; }));
  const styles = Object.keys(wsum).sort((a,b) => wsum[b]-wsum[a]).filter(k => wsum[k] >= 2).slice(0,3)
    .map(k => TYPES[k] ? TYPES[k].l.toLowerCase() : k);
  const grapes = [...new Set(cats.flatMap(c => c.g))].slice(0,6);
  return `<div class="panel"><div class="eyebrow mb8">Kaartgids · kelderregels</div>
    <p style="font-size:14px;margin-bottom:8px">Bij <b>${esc(dish)}</b> zoek je op de kaart naar <b>${esc(styles.join(' of ') || 'rood')}</b>.</p>
    ${grapes.length?`<p style="font-size:14px;margin-bottom:8px">Druiven die hier bijna altijd werken: <b>${esc(grapes.join(' · '))}</b>.</p>`:''}
    <p style="font-size:14px;margin-bottom:8px">Geen idee wat te kiezen? Vraag om ${esc(cats[0].buy)}.</p>
    <p class="small">${esc(cats[0].rW.charAt(0).toUpperCase()+cats[0].rW.slice(1))}.</p></div>`;
}

function barRows(pairs, dot){
  const mx = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(p => {
    /* bij een typeverdeling krijgt de staaf de kleur van het type, net als het bolletje */
    const cls = (dot && TYPES[p[2]]) ? ' ' + TYPES[p[2]].c : '';
    return `<div class="brow"><span class="l">${dot?dotHtml(p[2]):''}${esc(p[0])}</span>
    <span class="track"><span class="fill${cls}" style="width:${Math.max(4, p[1]/mx*100)}%"></span></span>
    <span class="v tnum">${p[1]}</span></div>`;
  }).join('');
}
function viewOverzicht(){

    totLow += q * (Number(w.valueLow) || b*0.8); totHigh += q * (Number(w.valueHigh) || b*1.2); });
  totLow = Math.round(totLow); totHigh = Math.round(totHigh);
  const ready = S.wines.filter(w => w.qty>0 && ['op','nu'].includes(windowStatus(w).k));
  const readyN = ready.reduce((n,w)=>n+w.qty,0);

  const byType = Object.keys(TYPES).map(t => [TYPES[t].l, S.wines.filter(w=>w.type===t).reduce((n,w)=>n+(w.qty||0),0), t]).filter(p=>p[1]>0);
  const landC = {};
  S.wines.forEach(w => { const c=(w.country||'Onbekend'); landC[c]=(landC[c]||0)+(w.qty||0); });
  const byLand = Object.entries(landC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const jaarC = {};

      <button class="tile" data-act="tileDronk"><div class="k">Nu op dronk</div><div class="n" style="color:var(--ok)">${readyN}</div><div class="s">tik voor de lijst</div></button>

    </div>
    ${soon.length?`<div class="sect"><div class="eyebrow mb8">Drink binnenkort</div><div class="panel">${soon.map(w=>{const st=windowStatus(w);

    ${byLand.length?`<div class="sect"><div class="eyebrow mb8">Per land</div><div class="panel">${barRows(byLand)}</div></div>`:''}

ACT.estValues = async el => {
  if(!aiReady()){ toast('Hiervoor is de AI-sleutel nodig (vul hierboven je sleutel in)'); return; }
  const targets = S.wines.filter(w => w.value == null);
  if(!targets.length){ toast('Alle flessen hebben al een waarde'); return; }
  const orig = el.textContent; el.textContent = 'Inschatten…'; el.style.pointerEvents = 'none';
  try{
    const r = await aiValues(targets.slice(0, 120));
    let n = 0;
    for(const v of (r.values||[])){
      const w = findWine(v.id);
      if(w && v.value != null){
        w.value = Math.round(v.value); w.valueSrc = 'ai'; w.valueAt = vandaag(); w.valueBron = null;
        if(v.low != null) w.valueLow = Math.round(v.low);
        if(v.high != null) w.valueHigh = Math.round(v.high);
        n++;
      }
    }
    save(); render();
    toast(n ? `${n} ${plur(n,'waarde','waardes')} ingeschat${targets.length>120?' (eerste 120)':''}` : 'Geen waardes kunnen inschatten');
  }catch(e){
    toast('Inschatten mislukte: ' + String(e.message||e).slice(0,90), null, null, 6000);
    el.textContent = orig; el.style.pointerEvents = '';
  }
};

/* ================= Caveau op je beginscherm ================= */
/* Chrome en Edge bieden zelf een installatieknop aan; die vangen we op zodat we
   hem op ons eigen moment kunnen tonen. Safari op de iPhone kent dat niet, dus daar
   kan het alleen met de hand, dus daar leggen we het uit in plaats van te knoppen. */
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; S.settings.installWeg = true; save(true); render(); });

function isStandalone(){
  return (matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isApple(){
  const ua = navigator.userAgent || '';
  return /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && (navigator.maxTouchPoints||0) > 1);
}
/* Meteen aanbieden, niet pas na de eerste fles. Wie hier binnenkomt heeft een link
   van iemand gekregen en hoeft niet overtuigd te worden; sluit hij het tabblad, dan
   is hij weg. En op de iPhone kan een app op het beginscherm een eigen opslag hebben:
   eerst in Safari flessen toevoegen en daarna installeren kan een lege kelder opleveren.
   Eerst zetten, dan vullen is dus ook veiliger. */
function toonInstallTip(){
  return !IN_SANDBOX && !isStandalone() && !S.settings.installWeg;
}
function installBanner(){
  if(!toonInstallTip()) return '';
  return `<div class="banner" style="align-items:center">
    <span>📲</span>
    <span style="flex:1"><b>Zet Caveau eerst op je beginscherm</b>. Dan heb je hem bij de hand in de winkel en het restaurant, opent hij als een app, en werkt je kelder ook zonder bereik.</span>
    <button class="btn sm" data-act="installSheet" style="flex:none">Hoe?</button>
    <button class="xbtn" data-act="installWeg" aria-label="Niet meer tonen">✕</button></div>`;
}

           <li>Tik onderin Safari op het <b>deel-icoon</b>, het vierkantje met het pijltje omhoog.</li>

           <li>Tik rechtsboven op <b>Voeg toe</b>.</li>
         </ol>
         <p class="small mt14">Lukt het niet? Dan sta je waarschijnlijk in een andere browser dan Safari. Op de iPhone kan alleen Safari dit. Open ${esc(location.host)} in Safari en probeer het daar.</p>`

   lijstje naast het rek, of een doos met flessen die rechtop staan. Liggende
   flessen in een rek laten alleen de bodem zien, dus die vragen we niet. */
const IMP_MAX = 4;
let imp = { text:'', shots:[], found:null, busy:false, err:null };

async function aiImport(){
  const prompt = `Je helpt iemand zijn bestaande wijnkelder overnemen in een app. Haal uit de foto's en/of de tekst hieronder alle flessen die je kunt herkennen.
Antwoord UITSLUITEND met geldig JSON, zonder andere tekst:
{"wines":[{"name":"naam van de wijn","producer":"producent of null","vintage":2019 of null,"type":"rood|wit|rose|mousserend|zoet|versterkt","grapes":["druif",...],"country":"land of null","region":"regio of null","appellation":"appellation of null","qty":1}]}
qty is het aantal flessen als dat uit de lijst of de foto blijkt, anders 1. Staat dezelfde wijn meerdere keren, voeg hem dan samen en tel qty op.
Neem alleen flessen op die je echt leest of ziet. Verzin niets: een veld dat je niet kunt lezen wordt null. Zie je geen enkele fles, antwoord dan met {"wines":[]}.`;
  const content = [];
  for(const sh of imp.shots) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: sh.split(',')[1]}});
  const t = (imp.text||'').trim();
  content.push({type:'text', text: prompt + (t ? `\n\nDe tekst:\n${t.slice(0, 6000)}` : '')});
  const out = await callClaude(content, 4000, 'import');
  const d = parseJsonLoose(out);
  return Array.isArray(d.wines) ? d.wines : [];
}

ACT.impRun = async () => {

      return { ...w, qty: Math.max(1, Math.min(99, parseInt(w.qty,10) || 1)),

ACT.impAdd = async () => {
  const kies = imp.found.filter(f => f.pick);
  if(!kies.length) return;
  let n = 0;
  for(const f of kies){
    const w = { id:uid(), name:(f.name||'').trim(), producer:(f.producer||'').trim(),
      vintage: (f.vintage && f.vintage >= 1900 && f.vintage <= 2100) ? f.vintage : null,
      type: TYPES[f.type] ? f.type : 'rood',
      grapes: Array.isArray(f.grapes) ? f.grapes.filter(Boolean) : [],
      country:(f.country||'').trim(), region:(f.region||'').trim(), appellation:(f.appellation||'').trim(),
      location:(f.location||'').trim(), note:(f.note||'').trim(),
      price: f.price ?? null, value: f.value ?? null,
      qty: f.qty, pairing:[], photo:false, addedAt:Date.now() };
    if(w.location) S.settings.lastLocation = w.location;
    ensureWindow(w);
    /* estimateWindow rekent in drinkFrom/drinkTo, ensureWindow in drink_from/to */
    if(w.drink_from != null){ w.drinkFrom = w.drink_from; delete w.drink_from; }
    if(w.drink_to != null){ w.drinkTo = w.drink_to; delete w.drink_to; }
    S.wines.unshift(w); n += 1;
  }
  save();
  const flessen = kies.reduce((a,f) => a + f.qty, 0);
  impReset(); UI.tab = 'kelder'; UI.meerPage = 'menu'; render();
  toast(`${n} ${plur(n,'wijn','wijnen')} toegevoegd, samen ${flessen} ${plur(flessen,'fles','flessen')}`);
};

async function buildExport(withPhotos){
  const data = { app:'caveau', v:1, exportedAt:new Date().toISOString(), cellarName:S.settings.cellarName,
    wines:S.wines, history:S.history, wishlist:S.wishlist };
  if(withPhotos){
    const photos = {};
    for(const w of [...S.wines, ...S.wishlist]) if(w.photo){ const p = await pGet(w.id); if(p) photos[w.id] = p; }
    data.photos = photos;
  }
  return JSON.stringify(data);
}
async function saveFile(name, text){
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:name, data:text}); toast('Back-up opgeslagen'); }
    catch(e){
      if(e && e.code === 'declined') return;
      if(e && e.code === 'rate_limited'){ toast('Er staat nog een download open. Probeer het zo weer'); return; }
      try{ await navigator.clipboard.writeText(text); toast('Downloaden lukte niet. De back-up staat op je klembord'); }
      catch(e2){ toast('Back-up maken lukte niet'); }
    }
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Back-up gedownload');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Back-up staat op je klembord'); }catch(e2){ toast('Back-up maken lukte niet'); }
  }
}

<script>

/* ================= CLOUD-SYNC (Supabase) =================
   Inloggen met e-mail + wachtwoord (eenmalig per apparaat). Elke wijziging wordt

const SB_URL = 'https://dbzgrkipcoebglacsqwe.supabase.co';
const SB_KEY = 'sb_publishable_Qvrq6CS6M-CPY5nwQ6suAw_lkpwYrYR';
const CLOUD_OK = !IN_SANDBOX;

let sbAccess = null;

function cloud(){ if(!S.settings.cloud) S.settings.cloud = {refresh:null, email:null, uid:null, lastSync:null}; return S.settings.cloud; }
function loggedIn(){ return CLOUD_OK && !!cloud().refresh; }

async function sbFetch(path, opts, noAuth){
  opts = opts || {};
  const h = { 'apikey': SB_KEY, 'content-type': 'application/json', ...(opts.headers||{}) };
  if(!noAuth && sbAccess) h['authorization'] = 'Bearer ' + sbAccess;
  const res = await fetch(SB_URL + path, {...opts, headers: h});
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    const e = new Error('HTTP ' + res.status + ' ' + t.slice(0,160)); e.status = res.status; throw e;
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

function applySession(s){
  sbAccess = s.access_token || sbAccess;
  const c = cloud();
  if(s.refresh_token) c.refresh = s.refresh_token;
  if(s.user){

       de kelder van de nieuwe gebruiker en zet bovendien andermans wijnen in zijn
       account. We bewaren hem als reservekopie en beginnen leeg; de sync haalt
       daarna op wat van dít account is. */
    if(c.uid && s.user.id !== c.uid && (S.wines.length || S.history.length)){

}

/* ---- document-sync (last-write-wins op S.rev) ---- */
function cloudDoc(){ return { rev: S.rev||0, wines: S.wines, history: S.history, wishlist: S.wishlist,
  locations: S.locations||[], pairCache: S.pairCache||[], recipeCache: S.recipeCache||[], tonight: S.tonight||[], cellarName: S.settings.cellarName }; }
function adoptDoc(d){
  S.wines = d.wines || []; S.history = d.history || []; S.wishlist = d.wishlist || [];
  S.locations = d.locations || []; S.pairCache = d.pairCache || []; S.recipeCache = d.recipeCache || [];

async function pushDoc(){

async function pullDoc(){

  return (rows && rows[0] && rows[0].data) || null;

/* ---- vangnet: lokale reservekopieën + rem op verdachte krimp ---- */
function snapshotLocal(key, extra){
  try{
    if(!(S.wines.length || S.history.length)) return;
    /* De vorige reservekopie een plek opschuiven. Twee ongelukken achter elkaar
       overschreven anders precies de kopie die je nodig had. */
    if(key === 'caveau_backup_prev'){
      const oud = localStorage.getItem(key);
      if(oud) localStorage.setItem('caveau_backup_prev2', oud);
    }
    localStorage.setItem(key, JSON.stringify({...(extra||{}), at:Date.now(),
      data:{wines:S.wines, history:S.history, wishlist:S.wishlist, locations:S.locations||[],
        pairCache:S.pairCache||[], recipeCache:S.recipeCache||[], cellarName:S.settings.cellarName}}));
  }catch(e){}
}
async function applyRemote(remote){
  snapshotLocal('caveau_backup_prev');
  adoptDoc(remote); render(); await pullPhotos();
}
const shrinks = (van, naar) => van >= 5 && naar < Math.max(1, Math.ceil(van * 0.2)); /* >80% zou verdwijnen */
/* Ook een historie of verlanglijst kan in één klap verdwijnen, en die zijn net zo
   min terug te halen als de flessen zelf. Alle drie apart wegen. */
function krimpErgens(hier, daar){
  const tel = d => [ (d.wines||[]).length, (d.history||[]).length, (d.wishlist||[]).length ];
  const a = tel(hier), b = tel(daar);
  return a.some((n, i) => shrinks(n, b[i]));
}

function askShrink(mode, remote, lc, rc){
  lastSyncNote = 'Wacht op jouw keuze, groot verschil tussen versies';
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
  const done = async () => { const c = cloud(); c.lastSync = Date.now(); S.syncedRev = S.rev||0; save(true); lastSyncNote = '';
    toast('Gesynchroniseerd ✓'); if(UI.tab === 'meer' && UI.meerPage === 'account') render(); };
  const tekst = mode === 'adopt'
    ? `De cloudversie bevat <b>${rc}</b> ${plur(rc,'wijn','wijnen')}, terwijl hier <b>${lc}</b> staan. Dat kan kloppen (bijvoorbeeld na "Alles wissen" op een ander apparaat), maar het kan ook een vergissing zijn. Daarom neem ik dit niet stilzwijgend over.`
    : mode === 'push'
    ? `Dit apparaat heeft <b>${lc}</b> ${plur(lc,'wijn','wijnen')}, de cloud <b>${rc}</b>. Doorzetten zou de cloudversie overschrijven.`
    : `Er is op twee plekken iets gewijzigd sinds de laatste keer dat dit apparaat synchroniseerde. Hier staan <b>${lc}</b> ${plur(lc,'wijn','wijnen')}, in de cloud <b>${rc}</b>. Ik kan er maar één bewaren, dus kies jij.`;
  const houd = mode === 'adopt' ? `Behoud mijn ${lc}` : mode === 'push' ? `Cloud (${rc}) overnemen` : `Deze telefoon (${lc}) bewaren`;
  const ga = mode === 'adopt' ? `Cloud (${rc}) overnemen` : mode === 'push' ? `Toch pushen (${lc})` : `Cloud (${rc}) overnemen`;
  openSheet(`${sheetHead('Even opletten')}
    <p style="font-size:14px;color:var(--ink2)">${tekst}</p>
    <div class="btnrow mt14">
      <button class="btn ghost" id="shrinkKeep">${houd}</button>
      <button class="btn danger" id="shrinkGo">${ga}</button>
    </div>
    <p class="small mt8">Wat je ook kiest: je huidige stand wordt eerst als lokale reservekopie bewaard (Instellingen → Reservekopieën).</p>`);
  document.getElementById('shrinkGo').onclick = async () => { closeSheet();
    try{
      if(mode === 'adopt' || mode === 'botsing'){ await applyRemote(remote); }
      else { snapshotLocal('caveau_backup_prev'); await pushDoc(); await pushPhotos(); }
      await done();
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt: ' + lastSyncNote); }
  };
  document.getElementById('shrinkKeep').onclick = async () => { closeSheet();
    try{
      if(mode === 'adopt' || mode === 'botsing'){ snapshotLocal('caveau_backup_prev');
        /* deze stand moet winnen van wat er in de cloud staat */
        S.rev = Math.max(S.rev||0, (remote && remote.rev)||0) + 1; save(true);
        await pushDoc(); await pushPhotos(); }
      else { await applyRemote(remote); }
      await done();
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt: ' + lastSyncNote); }
  };
}

async function syncNow(interactive){
  if(!loggedIn()) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  try{
    if(!sbAccess){ const ok = await sbRefresh(); if(!ok) throw new Error('Sessie verlopen. Log opnieuw in'); }
    const remote = await pullDoc();
    const localRev = S.rev||0, remoteRev = (remote && remote.rev)||0;
    /* Wat stond er bij de laatste geslaagde sync? Zonder dat getal kun je niet zien
       of één kant iets veranderde (veilig overnemen) of allebei (dan gaat er werk
       verloren, wat je ook kiest). Ontbreekt het, dan doen we alsof er lokaal niets
       openstaat; vanaf de eerste sync klopt het vanzelf. */
    const syncedRev = S.syncedRev;
    /* Niet kijken welk revisienummer het hoogst is, maar wie er iets veranderde
       sinds de laatste geslaagde sync. Een hoger nummer zegt namelijk niets over
       wie gelijk heeft: een apparaat dat niets nieuws heeft kan best het hoogste
       nummer dragen, en duwde dan zijn oude kopie over verse wijzigingen heen.
       Bij de allereerste sync is er nog geen ijkpunt; dan vergelijken we de
       nummers zoals vroeger. */
    const eersteKeer = syncedRev == null;
    const lokaalGewijzigd = eersteKeer ? (localRev > remoteRev) : (localRev !== syncedRev);
    const cloudGewijzigd  = !remote ? false : (eersteKeer ? (remoteRev > localRev) : (remoteRev !== syncedRev));
    const lc = S.wines.length, rc = remote ? (remote.wines||[]).length : 0;
    if(!remote){
      await pushDoc(); await pushPhotos();
    } else if(lokaalGewijzigd && cloudGewijzigd){
      syncBusy = false; askShrink('botsing', remote, lc, rc); return;
    } else if(cloudGewijzigd){
      if(krimpErgens(S, remote)){ syncBusy = false; askShrink('adopt', remote, lc, rc); return; }
      await applyRemote(remote);
    } else if(lokaalGewijzigd){
      if(krimpErgens(remote, S)){ syncBusy = false; askShrink('push', remote, lc, rc); return; }
      await pushDoc(); await pushPhotos();
    }
    const c = cloud(); c.lastSync = Date.now(); S.syncedRev = S.rev||0; save(true);
    lastSyncNote = '';
    if(interactive) toast('Gesynchroniseerd ✓');
  }catch(e){
    lastSyncNote = String(e.message||e).slice(0,110);
    if(interactive) toast('Sync mislukt: ' + lastSyncNote, null, null, 6000);
  }
  syncBusy = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
}

/* foto's incrementeel */
/* Foto's die op dit apparaat opnieuw zijn gezet moeten ook opnieuw omhoog; de
   cloud kent ze al onder hetzelfde id en zou anders de oude blijven bewaren. */
let fotoOpnieuw = new Set();
async function pushPhotos(){
  let mislukt = 0;
  try{
    const rows = await sbFetch('/rest/v1/photos?select=id&limit=5000', {method:'GET'});
    const have = new Set((rows||[]).map(r => r.id));
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(!w.photo) continue;
      if(have.has(w.id) && !fotoOpnieuw.has(w.id)) continue;
      try{
        const p = await pGet(w.id);
        if(!p) continue;
        await sbFetch('/rest/v1/photos?on_conflict=user_id,id', {method:'POST',
          headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify([{user_id: cloud().uid, id: w.id, data: p}])});
        fotoOpnieuw.delete(w.id);
      }catch(e){ mislukt++; }   /* volgende sync probeert het opnieuw */
    }
  }catch(e){ mislukt++; }
  /* Stil laten mislukken betekent dat iemand pas op een nieuw apparaat merkt dat
     zijn etiketten er niet zijn. Liever nu een regel in het accountscherm. */
  if(mislukt) lastSyncNote = mislukt + ' ' + plur(mislukt,'foto','foto\'s') + ' nog niet in de cloud';
  return mislukt;
}
async function pullPhotos(){
  try{
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(w.photo && !(await pGet(w.id))){
        const rows = await sbFetch('/rest/v1/photos?select=data&id=eq.' + w.id, {method:'GET'});
        if(rows && rows[0] && rows[0].data) await pSet(w.id, rows[0].data);
      }
    }
    fillPhotos();
  }catch(e){}
}
function cloudDeletePhoto(id){

}

/* ---- AI via de Caveau-serverfunctie (Fase 1) ---- */
async function sbAI(content, maxTokens, kind, onText, opts){

    });
  }catch(_){ throw new Error('Geen verbinding met de Caveau-server. Probeer het zo nog eens'); }

    return readSSE(res, onText);
  const d = await res.json().catch(() => ({}));
  if(!res.ok){
    const e = new Error(res.status === 402 ? 'Je AI-tegoed voor deze maand is op. Kijk bij Meer → Account'
      : res.status === 429 ? (d.error || 'Even rustig aan, daglimiet bereikt')
      : res.status === 404 ? 'De serverfunctie is nog niet geplaatst (zie instructies)'
      : (d.error || ('Serverfout ' + res.status)));
    e.status = res.status; throw e;
  }
  return (d.content||[]).filter(b => b.type === 'text').map(b => b.text).join('');
}
/* tegoed en abonnement, gevuld door fetchQuota() */
let quota = null;
function planBoxHtml(){
  if(!quota) return '';
  if(quota.plan === 'unlimited') return `<div class="banner"><span>∞</span><span>Onbeperkt tegoed op dit account.</span></div>`;
  if(quota.plan === 'plus'){
    const t = quota.renews ? new Date(quota.renews).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}) : null;
    /* 'canceling' = zelf opgezegd, loopt netjes uit; elke andere niet-actieve status
       is een betaalprobleem. Die twee verschillen mogen niet door elkaar lopen. */
    const stopt = quota.status === 'canceling';
    const gedoe = quota.status && quota.status !== 'active' && !stopt;
    return `<div class="panel" style="margin-top:12px">
      <div class="eyebrow mb8">Caveau Plus</div>
      <p style="font-size:14px;margin-bottom:8px">${quota.limit} credits per maand${t?` · ${stopt?'loopt af':'verlengt'} op ${esc(t)}`:''}.
      ${gedoe?`<br><b>Let op:</b> de betaling is niet gelukt (${esc(quota.status)}). Werk je betaalmethode bij om Plus te houden.`:''}</p>
      <button class="btn plain" data-act="acPortal">Abonnement beheren</button></div>`;
  }
  const over = Math.max(0, quota.limit - quota.used);
  if(!PLUS_TE_KOOP) return `<div class="panel" style="margin-top:12px">
    <div class="eyebrow mb8">Je tegoed</div>
    <p style="font-size:14px;margin-bottom:8px">Je hebt nog <b>${over} van de ${quota.limit} credits</b> deze maand. Elke maand begint de teller opnieuw.</p>
    <p class="small">Een etiketscan of pairing kost 1 credit; een wijnkaart 2 per gefotografeerde pagina. Kom je tekort? Laat het even weten, dan zet ik je tegoed hoger.</p></div>`;
  return `<div class="panel" style="margin-top:12px">
    <div class="eyebrow mb8">Caveau Plus · ${PLUS_PRIJS}</div>
    <p style="font-size:14px;margin-bottom:8px">Je hebt nog <b>${over} van de ${quota.limit} gratis credits</b> deze maand. Met Plus krijg je er <b>${PLUS_CREDITS} per maand</b>, genoeg voor zo'n 35 wijnkaarten in een restaurant, of honderden etiketten.</p>
    <p class="small mb8">Een etiketscan of pairing kost 1 credit; een wijnkaart 2 per gefotografeerde pagina. Maandelijks opzegbaar.</p>
    <button class="btn" data-act="acUpgrade">Plus nemen</button></div>`;
}
async function sbFn(name, body){
  if(!sbAccess){ const ok = await sbRefresh(); if(!ok) throw new Error('Sessie verlopen. Log opnieuw in'); }
  let res;
  try{
    res = await fetch(SB_URL + '/functions/v1/' + name, {
      method:'POST',
      headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + sbAccess, 'apikey':SB_KEY },
      body: JSON.stringify(body||{})
    });
  }catch(_){ throw new Error('Geen verbinding met de Caveau-server. Probeer het zo nog eens'); }
  const d = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(d.error || (res.status === 404 ? 'De betaalfunctie is nog niet geplaatst' : 'Serverfout ' + res.status));
  return d;
}
async function billingGo(action, el){
  if(el){ el.disabled = true; el.textContent = 'Even geduld…'; }
  try{
    const d = await sbFn('billing', {action});
    if(d.url) location.href = d.url; else throw new Error('Geen betaallink ontvangen');
  }catch(e){ toast(String(e.message||e)); if(el){ el.disabled = false; render(); } }
}

   in Stripe kunt opgeven: .../caveau/#voorwaarden en .../caveau/#privacy */
(function(){

/* terug uit Stripe Checkout: ?plus=ok / ?plus=annuleer */
(function(){
  const q = new URLSearchParams(location.search).get('plus');
  if(!q) return;
  history.replaceState(null, '', location.pathname);
  setTimeout(() => {
    if(q === 'ok'){
      UI.tab = 'meer'; UI.meerPage = 'account'; render(); fetchQuota();
      toast('Welkom bij Caveau Plus. Je tegoed staat klaar', null, null, 6000);
    } else toast('Afgebroken, er is niets afgeschreven');
  }, 400);
})();

async function fetchQuota(){
  const el = document.getElementById('aiQuota');
  if(!el || !loggedIn()) return;
  try{
    if(!sbAccess){ const ok = await sbRefresh(); if(!ok){ el.textContent = 'AI-tegoed: log opnieuw in'; return; } }
    const ms = new Date(); ms.setUTCDate(1); ms.setUTCHours(0,0,0,0);
    const [prof, used] = await Promise.all([
      sbFetch('/rest/v1/profiles?select=plan,bonus_credits,plan_status,plan_renews_at', {method:'GET'}),
      sbFetch('/rest/v1/ai_usage?select=cost_units&created_at=gte.' + encodeURIComponent(ms.toISOString()), {method:'GET'})
    ]);
    const p = (prof && prof[0]) || {};
    quota = { plan:p.plan || 'free', bonus:p.bonus_credits || 0, status:p.plan_status || null,
      renews:p.plan_renews_at || null,
      used:(used||[]).reduce((n,r) => n + (r.cost_units || 1), 0) };
    quota.limit = quota.plan === 'plus' ? PLUS_CREDITS : FREE_CREDITS + quota.bonus;
    let txt = quota.plan === 'unlimited' ? `AI: onbeperkt · ${quota.used} credits deze maand`
      : quota.plan === 'plus' ? `Caveau Plus · ${quota.used} van ${quota.limit} credits deze maand`
      : `Gratis tegoed: ${Math.max(0, quota.limit - quota.used)} van ${quota.limit} credits over deze maand`;
    if(ownKey()) txt += ' · eigen sleutel actief (telt niet mee)';
    el.textContent = txt;
    const box = document.getElementById('planBox');
    if(box) box.innerHTML = planBoxHtml();
  }catch(e){ el.textContent = 'AI-tegoed: nog niet beschikbaar'; }
}

ACT.acLogin = el => acAuth(el, false);
ACT.acSignup = el => acAuth(el, true);
async function acAuth(el, isNew){
  const email = ((document.getElementById('ac_email')||{}).value||'').trim().toLowerCase();
  const pass = (document.getElementById('ac_pass')||{}).value||'';
  if(!/.+@.+\..+/.test(email)){ toast('Vul een geldig e-mailadres in'); return; }
  if(pass.length < 8){ toast('Gebruik een wachtwoord van minimaal 8 tekens'); return; }
  const orig = el.textContent; el.textContent = 'Even geduld…'; el.style.pointerEvents = 'none';
  try{
    const r = isNew ? await sbSignup(email, pass) : await sbLogin(email, pass);
    if(r === 'confirm'){
      toast('Bevestig je account via je mail, of log in als je al een account had', null, null, 7000);
    } else {
      toast('Ingelogd, synchroniseren…');
      render();
      await syncNow(true);
      return;
    }
  }catch(e){
    const m = String(e.message||'');
    toast(/invalid|credentials/i.test(m) ? 'Onjuiste inloggegevens' : 'Lukte niet: ' + m.slice(0,90), null, null, 6000);
  }
  el.textContent = orig; el.style.pointerEvents = '';
}
ACT.acSync = () => syncNow(true);
ACT.acLogout = () => confirmSheet('Uitloggen?', 'Je kelder blijft lokaal én in de cloud bewaard; dit apparaat synchroniseert alleen niet meer.', 'Log uit', () => { sbLogout(); render(); toast('Uitgelogd'); });
