<title>Caveau, je wijnkelder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<style>
/* ============ Caveau, crème & bordeaux ============ */
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --card2:#F4EDE0; --sheet:#FFFDF8;
  --ink:#2B2126; --ink2:#6E5F66; --ink3:#9A8A91;
  --line:#E8DECD; --line2:#F0E9DA;
  --acc:#7D2A3C; --acc-deep:#5E1F2E; --acc-soft:#F3E3E6; --acc-ink:#7D2A3C;
  --gold:#B08A47; --gold-ink:#8A6930;
  --btn-bg:#7D2A3C; --btn-ink:#FFF7F2; --fab1:#7D2A3C; --fab2:#5E1F2E;
  --ok:#3E7C4F; --ok-bg:#E6EFE4; --warn:#A26E10; --warn-bg:#F6EBD2;
  --bad:#A63D2F; --bad-bg:#F6E2DD; --info:#56718C; --info-bg:#E6EBF1;
  --neut:#8A7E71; --neut-bg:#EEE8DB;
  --t-rood:#8E3347; --t-wit:#A5851B; --t-rose:#C96A7C;
  --t-mous:#2E7B40; --t-zoet:#CE8330; --t-vers:#83420F;
  --bar:#8E3347; --bar-track:#F1E9DA;
  --shadow:0 1px 2px rgba(43,33,38,.05),0 6px 24px rgba(43,33,38,.06);
  --shadow-lg:0 -8px 40px rgba(43,33,38,.18);
  --serif:'Iowan Old Style','Palatino Nova',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1F1216; --card:#2A1A20; --card2:#342128; --sheet:#2E1C23;
    --ink:#F1E7E0; --ink2:#C7B3BA; --ink3:#937F87;
    --line:#3E2A33; --line2:#35232C;
    --acc:#D98E9C; --acc-deep:#E8AEB8; --acc-soft:#43262E; --acc-ink:#DE97A4;
    --gold:#C9A468; --gold-ink:#CBA96E;
    --btn-bg:#97374C; --btn-ink:#FFEFF1; --fab1:#A84158; --fab2:#7A2B3C;
    --ok:#7FB98B; --ok-bg:#243627; --warn:#D9A84E; --warn-bg:#3D3123;
    --bad:#D98874; --bad-bg:#42261F; --info:#93AECB; --info-bg:#25303C;
    --neut:#A79A8C; --neut-bg:#342A2E;
    --t-rood:#C87083; --t-wit:#A98A24; --t-rose:#D06880;
    --t-mous:#27803C; --t-zoet:#C97C1E; --t-vers:#9C4A3C;
    --bar:#C87083; --bar-track:#3A262E;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --bg:#FAF6EF; --card:#FFFFFF; --card2:#F4EDE0; --sheet:#FFFDF8;
  --ink:#2B2126; --ink2:#6E5F66; --ink3:#9A8A91;
  --line:#E8DECD; --line2:#F0E9DA;
  --acc:#7D2A3C; --acc-deep:#5E1F2E; --acc-soft:#F3E3E6; --acc-ink:#7D2A3C;
  --gold:#B08A47; --gold-ink:#8A6930;
  --btn-bg:#7D2A3C; --btn-ink:#FFF7F2; --fab1:#7D2A3C; --fab2:#5E1F2E;
  --ok:#3E7C4F; --ok-bg:#E6EFE4; --warn:#A26E10; --warn-bg:#F6EBD2;
  --bad:#A63D2F; --bad-bg:#F6E2DD; --info:#56718C; --info-bg:#E6EBF1;
  --neut:#8A7E71; --neut-bg:#EEE8DB;
  --t-rood:#8E3347; --t-wit:#A5851B; --t-rose:#C96A7C;
  --t-mous:#2E7B40; --t-zoet:#CE8330; --t-vers:#83420F;
  --bar:#8E3347; --bar-track:#F1E9DA;
  --shadow:0 1px 2px rgba(43,33,38,.05),0 6px 24px rgba(43,33,38,.06);
  --shadow-lg:0 -8px 40px rgba(43,33,38,.18);
}
:root[data-theme="dark"]{
  --bg:#1F1216; --card:#2A1A20; --card2:#342128; --sheet:#2E1C23;
  --ink:#F1E7E0; --ink2:#C7B3BA; --ink3:#937F87;
  --line:#3E2A33; --line2:#35232C;
  --acc:#D98E9C; --acc-deep:#E8AEB8; --acc-soft:#43262E; --acc-ink:#DE97A4;
  --gold:#C9A468; --gold-ink:#CBA96E;
  --btn-bg:#97374C; --btn-ink:#FFEFF1; --fab1:#A84158; --fab2:#7A2B3C;
  --ok:#7FB98B; --ok-bg:#243627; --warn:#D9A84E; --warn-bg:#3D3123;
  --bad:#D98874; --bad-bg:#42261F; --info:#93AECB; --info-bg:#25303C;
  --neut:#A79A8C; --neut-bg:#342A2E;
  --t-rood:#C87083; --t-wit:#A98A24; --t-rose:#D06880;
  --t-mous:#27803C; --t-zoet:#C97C1E; --t-vers:#9C4A3C;
  --bar:#C87083; --bar-track:#3A262E;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 24px rgba(0,0,0,.25);
  --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; /* dubbeltik zoomt niet meer per ongeluk in; knijpen blijft gewoon werken */
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#app{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* ---------- header ---------- */
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 14px}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:.01em;color:var(--ink)}
.brand .dot{color:var(--acc)}
.hdr-sub{font-size:12.5px;color:var(--ink2)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.h2{font-family:var(--serif);font-size:21px;margin:4px 0 10px}
.sect{margin-top:22px}
/* ---------- search & chips ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink3)}
.search svg{flex:none;color:var(--ink3)}
.search .sortbtn{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border-radius:9px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.search .sortbtn:active{background:var(--card2)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:10px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.chip .tdot{width:8px;height:8px}
.chip.on .tdot{outline:1.5px solid rgba(255,247,242,.85);outline-offset:1px}
/* ---------- wijnkaart ---------- */
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.wthumb{flex:none;width:52px;border-radius:9px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;min-height:68px;position:relative}
.wthumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.wthumb svg{color:var(--ink3);opacity:.8}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.wname{font-family:var(--serif);font-size:16.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wsub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.wside{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;padding:2px 0}
.wtap{display:flex;gap:12px;flex:1;min-width:0;align-items:stretch;text-align:left}
.dbtn{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.dbtn:active{transform:scale(.92)}
.qty{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink);background:var(--card2);border-radius:8px;padding:3px 8px}
.wloc{font-size:11px;color:var(--ink3);max-width:104px;text-align:right;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tlabel{font-size:12px;color:var(--ink2)}
.t-rood{background:var(--t-rood)} .t-wit{background:var(--t-wit)} .t-rose{background:var(--t-rose)}
.t-mousserend{background:var(--t-mous)} .t-zoet{background:var(--t-zoet)} .t-versterkt{background:var(--t-vers)}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-op{background:var(--ok-bg);color:var(--ok)}
.b-nu{background:var(--warn-bg);color:var(--warn)}
.b-top{background:transparent;color:var(--gold-ink);border:1px solid var(--gold)}
.medal{vertical-align:-2px;margin-right:1px}
.verdict{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 10px}
.b-jong{background:var(--info-bg);color:var(--info)}
.b-over{background:var(--bad-bg);color:var(--bad)}
.b-onb{background:var(--neut-bg);color:var(--neut)}
/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--btn-bg);color:var(--btn-ink);width:100%;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--acc-ink);border:1.5px solid var(--acc);box-shadow:none}
:root[data-theme="dark"] .btn.ghost{border-color:var(--acc)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn.plain{background:var(--card2);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad-bg)}
.btn.sm{padding:8px 13px;font-size:13.5px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
.linkbtn{color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- lege staat / banners ---------- */
.empty{text-align:center;padding:44px 22px;color:var(--ink2)}
.empty .big{font-family:var(--serif);font-size:21px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;margin-bottom:18px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink2);margin:10px 0}
.banner b{color:var(--ink)}
.srcchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold-ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,18,22,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.33,1)}
.sheet.show{transform:translateY(0)}
.sheet-in{overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.sheet-title{font-family:var(--serif);font-size:20px}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
@media (min-width:560px){.sheet{max-width:560px;left:50%;transform:translate(-50%,100%);}.sheet.show{transform:translate(-50%,0)}}
/* ---------- detail ---------- */
.dphoto{border-radius:14px;overflow:hidden;background:var(--card2);max-height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.dphoto img{object-fit:contain;max-height:230px;width:auto;margin:0 auto}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.dcell .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.dcell .v{font-size:14.5px;margin-top:2px}
.grapes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grape{font-size:12px;background:var(--card2);border-radius:999px;padding:3px 10px;color:var(--ink2)}
/* stepper */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepbtn{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:22px;font-weight:600;color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.stepval{font-family:var(--serif);font-size:30px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
/* tijdlijn */
.tl{margin:8px 0 4px}
.tl-track{position:relative;height:10px;border-radius:5px;background:var(--bar-track);overflow:visible}
.tl-fill{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--t-mous),var(--ok) 30%,var(--warn) 78%,var(--bad))}
.tl-now{position:absolute;top:-4px;width:2.5px;height:18px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--sheet)}
.tl-lab{position:relative;height:15px;font-size:11.5px;color:var(--ink3);margin-top:7px;font-variant-numeric:tabular-nums}
.tl-lab span{position:absolute;top:0;white-space:nowrap}
.tl-lab span.now{color:var(--ink);font-weight:600}
/* ---------- formulieren ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:64px}
/* iOS zoomt vanzelf in zodra je een tekstveld kleiner dan 16px aantikt, en zoomt daarna
   niet terug, dus op een aanraakscherm 16px, zodat de app niet scheef ingezoomd blijft staan. */
@media (pointer:coarse){ .inp, .search input, input, select, textarea { font-size:16px } }
.frow{display:flex;gap:9px}
.frow>.field{flex:1;min-width:0}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:31%;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qquick{display:flex;gap:7px;margin-top:8px;justify-content:center}
.qquick button{font-size:12.5px;font-weight:600;color:var(--acc-ink);background:var(--acc-soft);border-radius:999px;padding:5px 13px}
/* sterren */
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{font-size:30px;line-height:1;color:var(--line);transition:transform .08s}
.stars button.on{color:var(--gold)}
.stars button.half{background:linear-gradient(90deg,var(--gold) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars button:active{transform:scale(1.2)}
.starmini{color:var(--gold);font-size:12.5px;letter-spacing:1px}
/* ---------- pairing ---------- */
.pairtoggle{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:14px}
.pairtoggle button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.pairtoggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mscore{flex:none;font-family:var(--serif);font-size:19px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
.mscore small{font-size:11px;color:var(--ink3);font-family:var(--sans)}
.mreason{font-size:13.5px;color:var(--ink2);margin-top:6px}
.dishcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.dishcard .d{font-weight:600;font-size:14.5px}
.dishcard .r{font-size:13px;color:var(--ink2);margin-top:3px}
/* ---------- overzicht ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);text-align:left}
.tile .n{font-family:var(--serif);font-size:27px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.brow{display:grid;grid-template-columns:minmax(86px,30%) 1fr auto;align-items:center;gap:10px;padding:5px 0}
.brow .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .track{display:block;height:9px;border-radius:5px;background:var(--bar-track);overflow:hidden}
.brow .fill{display:block;height:100%;border-radius:5px 4px 4px 5px;background:var(--bar);min-width:3px}
.brow .fill.t-rood{background:var(--t-rood)} .brow .fill.t-wit{background:var(--t-wit)} .brow .fill.t-rose{background:var(--t-rose)}
.brow .fill.t-mousserend{background:var(--t-mous)} .brow .fill.t-zoet{background:var(--t-zoet)} .brow .fill.t-versterkt{background:var(--t-vers)}
.brow .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:12px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.rowline:last-child{border-bottom:0}
.rowline .a{min-width:0}
.rowline .t{font-size:14px;font-weight:600;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowline .u{font-size:12px;color:var(--ink2)}
.rowline .z{flex:none;text-align:right}
/* ---------- meer ---------- */
.menu{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-bottom:1px solid var(--line2);text-align:left;font-size:15px}
.mitem:last-child{border-bottom:0}
.mitem svg{color:var(--acc-ink);flex:none}
.mitem .grow{flex:1}
.mitem .cnt{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mitem .chev{color:var(--ink3)}
.mitem .todo{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 9px}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- navigatie ---------- */

<script>
'use strict';
/* ================= basis ================= */
const YR = () => new Date().getFullYear();
const IN_SANDBOX = /claudeusercontent\.com$/i.test(location.hostname) || !!window.claude;
const DB_KEY = 'caveau_v1';

const DEFAULTS = () => ({ v:1, wines:[], history:[], wishlist:[], locations:[], pairCache:[], recipeCache:[], tonight:[], menuLast:null,
  settings:{ cellarName:'Mijn kelder', apiKey:'', model:'claude-sonnet-5', devMode:false, installWeg:false } });

function loadState(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return DEFAULTS();
    const d = JSON.parse(raw);
    const base = DEFAULTS();
    return { ...base, ...d, settings:{ ...base.settings, ...(d.settings||{}) },
      wines:d.wines||[], history:d.history||[], wishlist:d.wishlist||[], locations:d.locations||[], pairCache:d.pairCache||[], recipeCache:d.recipeCache||[], tonight:d.tonight||[] };
  }catch(e){ return DEFAULTS(); }
}
let S = loadState();
/* save(true) = technische schrijfactie (tokens, sync-adoptie): geen rev-bump, geen cloud-push */
function save(skipCloud){
  /* Een teller, geen klok. Met Date.now() wint het apparaat met de verst vooruit
     lopende klok altijd, ook als het niets nieuws te melden heeft, en overschrijft
     het stilletjes de echte wijzigingen van het andere apparaat. */
  if(!skipCloud) S.rev = (S.rev||0) + 1;
  try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }catch(e){ toast('Opslaan mislukt. Is de opslag vol?'); }
  if(!skipCloud && typeof cloudOnSave === 'function') cloudOnSave();
}

/* tegoed: moet gelijk blijven aan FREE_CREDITS / PLUS_CREDITS in supabase/ai-function.ts */
const FREE_CREDITS = 20, PLUS_CREDITS = 300, PLUS_PRIJS = '€ 2,99 per maand';
/* Wie Caveau aanbiedt. Staat hier op één plek zodat het in één regel verandert
   zodra er een eenmanszaak of BV achter zit (dan hoort hier ook een KvK-nummer
   en een vestigingsadres bij). Deze gegevens staan op de openbare pagina's. */
/* Staat Plus te koop? Zolang Stripe in testmodus draait moet dit uit: een
   testafrekenpagina met een oranje TEST MODE-balk ziet er kapot uit. Familie en
   vrienden geef je intussen tegoed met een regel SQL (bonus_credits of plan
   'unlimited'), dan hoeft er geen nepbetaling aan te pas te komen.
   Live met Stripe? Dan hier op true, versienummer omhoog, build en klaar. */
const PLUS_TE_KOOP = false;
const AANBIEDER = 'Max Ponsen';
const CONTACT_MAIL = 'max.ponsen@gmail.com';
const LEGAL_DATUM = '1 september 2026';

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(36).slice(2,8));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const money = n => (n==null||n===''||isNaN(n)) ? '—' : '€ '+Number(n).toLocaleString('nl-NL',{maximumFractionDigits:0});
const plur = (n,e,m) => n===1?e:m;

/* wijntypes */
const TYPES = {
  rood:{l:'Rood',c:'t-rood'}, wit:{l:'Wit',c:'t-wit'}, rose:{l:'Rosé',c:'t-rose'},
  mousserend:{l:'Mousserend',c:'t-mousserend'}, zoet:{l:'Zoet',c:'t-zoet'}, versterkt:{l:'Versterkt',c:'t-versterkt'}
};
function mapType(s){
  const t = norm(s);
  if(/rose|rosado|rosato/.test(t)) return 'rose';
  if(/mousser|champag|cremant|cava|prosecco|sekt|sparkl|bubbel|petnat|pet nat/.test(t)) return 'mousserend';
  if(/versterkt|port|sherry|madeira|banyuls|maury|fortified|vermout/.test(t)) return 'versterkt';
  if(/zoet|sweet|dessert|sauternes|auslese|ijswijn|icewine|tokaji|moelleux/.test(t)) return 'zoet';
  if(/wit|white|blanc|bianco|weiss|oranje|orange|amber/.test(t)) return 'wit';
  if(/rood|red|rouge|rosso|tinto/.test(t)) return 'rood';
  return TYPES[t] ? t : 'rood';
}
const dotHtml = t => `<span class="tdot ${TYPES[t]?TYPES[t].c:'t-rood'}" aria-hidden="true"></span>`;
const typeHtml = t => `${dotHtml(t)}<span class="tlabel">${esc(TYPES[t]?TYPES[t].l:t)}</span>`;

/* drinkvenster-status */
function windowStatus(w){
  const y = YR(), f = w.drinkFrom||null, t = w.drinkTo||null;
  if(!f && !t) return {k:'onb',cls:'b-onb',label:'Venster onbekend',sub:''};
  if(f && y < f) return {k:'jong',cls:'b-jong',label:'Nog te jong',sub:'op dronk '+f+(t?'–'+t:'')};
  if(t && y > t) return {k:'over',cls:'b-over',label:'Over de piek?',sub:'was op dronk '+(f?f+'–'+t:'t/m '+t)};
  if(t){
    const span = Math.max(1, t-(f||t)), rem = t-y;
    if(rem <= Math.max(1, Math.round(span*0.18)))
      return {k:'nu',cls:'b-nu',label:'Drink binnenkort',sub:(f?'venster '+f+'–'+t:'nog t/m '+t)};
  }
  return {k:'op',cls:'b-op',label:'Op dronk',sub:t?(f?'venster '+f+'–'+t:'tot '+t):''};
}
const badgeHtml = w => { const st = windowStatus(w); return `<span class="badge ${st.cls}">${st.label}</span>`; };
/* sterren als tekst, met halve: ★★★½ */
const starsText = r => r == null ? '' : (r === 0 ? '0 ★' : '★'.repeat(Math.floor(r)) + (r % 1 ? '½' : ''));
/* volgorde voor de drinkvenster-sortering: op dronk → drink binnenkort → over tijd → nog te jong → onbekend */
const URG = {op:0, nu:1, over:2, jong:3, onb:4};

/* ================= foto-opslag (IndexedDB) ================= */
let _db = null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res)=>{
    try{
      const rq = indexedDB.open('caveau_photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { _db = rq.result; res(_db); };
      rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const photoCache = new Map();
async function pSet(id, data){ photoCache.set(id, data); if(typeof fotoOpnieuw !== 'undefined') fotoOpnieuw.add(id); const d = await idb(); if(!d) return;
  await new Promise(r=>{ const tx=d.transaction('p','readwrite'); tx.objectStore('p').put(data,id); tx.oncomplete=r; tx.onerror=r; }); }
async function pGet(id){ if(photoCache.has(id)) return photoCache.get(id); const d = await idb(); if(!d) return null;
  return new Promise(r=>{ const rq=d.transaction('p').objectStore('p').get(id); rq.onsuccess=()=>{ if(rq.result) photoCache.set(id,rq.result); r(rq.result||null); }; rq.onerror=()=>r(null); }); }
async function pDel(id){ photoCache.delete(id); const d = await idb(); if(!d) return;
  await new Promise(r=>{ const tx=d.transaction('p','readwrite'); tx.objectStore('p').delete(id); tx.oncomplete=r; tx.onerror=r; }); }
async function pKeys(){ const d = await idb(); if(!d) return [];
  return new Promise(r=>{ const rq=d.transaction('p').objectStore('p').getAllKeys(); rq.onsuccess=()=>r(rq.result||[]); rq.onerror=()=>r([]); }); }
async function fillPhotos(root){
  /* parallel: bij een grote kelder scheelt dat tientallen losse IndexedDB-rondjes */
  const imgs = [...(root||document).querySelectorAll('img[data-photo]')];
  await Promise.all(imgs.map(async img => {
    const src = await pGet(img.dataset.photo);
    if(src){ img.src = src; img.closest('.wthumb,.dphoto,.scanprev')?.querySelector('svg')?.remove(); }
  }));
}
/* glas dat volloopt: laadbeeld voor alles waar de sommelier op zit te denken */
const pourSvg = `<svg class="pour" viewBox="0 0 22 30" aria-hidden="true">
  <defs><clipPath id="pourc"><path d="M4.6 3h12.8l-1 8.2a5.9 5.9 0 0 1-10.8 0L4.6 3Z"/></clipPath></defs>
  <g clip-path="url(#pourc)"><rect class="wine" x="3" y="0" width="16" height="16" rx="1"/></g>
  <path class="glass" d="M4.6 3h12.8l-1 8.2a5.9 5.9 0 0 1-10.8 0L4.6 3Z"/>
  <path class="glass" d="M11 17.3V25M7.4 26.4h7.2"/></svg>`;

const bottleSvg = `<svg width="22" height="34" viewBox="0 0 22 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2h4v6.5c2.2 1.2 3.5 3 3.5 5.8V29a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3V14.3c0-2.8 1.3-4.6 3.5-5.8V2Z"/></svg>`;

/* ================= sheets & toast ================= */
const sheets = [];
let sheetSkipPops = 0, sheetNaPop = [];
function openSheet(html, opts={}){
  const host = document.getElementById('sheetHost');
  const ov = document.createElement('div'); ov.className = 'overlay';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  sh.innerHTML = `<div class="sheet-grip"></div><div class="sheet-in">${html}</div>`;
  host.appendChild(ov); host.appendChild(sh);
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
  ov.addEventListener('click', ()=>closeSheet());
  /* Elk venster is een stap in de browsergeschiedenis: de terugknop (Android) en de
     randveeg van Safari sluiten dan het venster in plaats van de app te verlaten. */
  const idx = sheets.length + 1, stap = () => { try{ history.pushState({sheet: idx}, ''); }catch(e){} };
  /* is er nog een terugstap onderweg (venster net gesloten), dan pas erna een nieuwe stap zetten */
  if(sheetSkipPops > 0) sheetNaPop.push(stap); else stap();
  sheets.push({ov, sh, onClose:opts.onClose});
  wireSwipeBack(sh);
  document.body.style.overflow = 'hidden';
  return sh;
}
function closeSheet(all, viaPop){
  const doOne = () => {
    const s = sheets.pop(); if(!s) return;
    s.ov.classList.remove('show'); s.sh.classList.remove('show');
    setTimeout(()=>{ s.ov.remove(); s.sh.remove(); }, 300);
    if(s.onClose) try{ s.onClose(); }catch(e){}
  };
  if(all){ while(sheets.length) doOne(); } else doOne();
  if(!sheets.length) document.body.style.overflow = '';
  if(!viaPop){
    /* gesloten via de app zelf: de bijbehorende geschiedenisstappen weer weghalen */
    const st = (history.state && history.state.sheet) || 0;
    const terug = st - sheets.length;
    if(terug > 0){ sheetSkipPops++; try{ history.go(-terug); }catch(e){ sheetSkipPops--; } }
  }
}
addEventListener('popstate', () => {
  if(sheetSkipPops > 0){ sheetSkipPops--; sheetNaPop.splice(0).forEach(f => f()); return; }
  const want = (history.state && history.state.sheet) || 0;
  while(sheets.length > want) closeSheet(false, true);
});
/* Veeg vanaf de linkerrand naar rechts: sluit het bovenste venster. Op de iPhone als
   app op het beginscherm bestaat geen randveeg van Safari, dus die doen we zelf. */
function wireSwipeBack(sh){
  let x0 = null, y0 = null, actief = false;
  sh.addEventListener('touchstart', e => {
    const t = e.touches[0]; x0 = y0 = null; actief = false;
    if(t.clientX <= 36){ x0 = t.clientX; y0 = t.clientY; }
  }, {passive:true});
  sh.addEventListener('touchmove', e => {
    if(x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if(!actief){
      if(Math.abs(dy) > 24 && Math.abs(dy) > dx){ x0 = null; return; }
      if(dx > 12) actief = true; else return;
    }
    sh.style.transition = 'none'; sh.style.translate = Math.max(0, dx) + 'px 0';
  }, {passive:true});
  const einde = e => {
    if(x0 == null) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dx = t ? t.clientX - x0 : 0;
    sh.style.transition = ''; sh.style.translate = '';
    x0 = null;
    if(actief && dx > 80 && sheets.length && sheets[sheets.length-1].sh === sh) closeSheet();
  };
  sh.addEventListener('touchend', einde, {passive:true});
  sh.addEventListener('touchcancel', einde, {passive:true});
}
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheets.length) closeSheet(); });

function toast(msg, actionLabel, actionFn, ms=4200){
  const host = document.getElementById('toastHost');
  host.innerHTML = `<div class="toast" role="status">${esc(msg)}${actionLabel?`<button id="toastAct">${esc(actionLabel)}</button>`:''}</div>`;

/* Ligt deze gescande fles al in de kelder?

   Naam en producent worden apart gewogen. Ze eerst op één hoop gooien was de fout:
   een domein maakt meestal meerdere cuvées, dus "Domaine des Baumard" alleen al
   leverde genoeg overeenkomende woorden op om een Clos du Papillon voor een Quarts
   de Chaume aan te zien. De naam moet nu kloppen; de producent is bevestiging, nooit
   bewijs. Een fout hier is duur: twee verschillende wijnen samenvoegen richt meer
   schade aan dan een dubbele regel, dus bij twijfel liever geen match. */
/* Woorden die in vrijwel elke producentnaam staan en dus niets onderscheiden.
   Zonder deze lijst lijken "Domaine Lefevre" en "Domaine Bernard" op elkaar. */
const HUISWOORDEN = new Set(['domaine','domaines','chateau','weingut','bodega','bodegas',
  'tenuta','azienda','agricola','cantina','cantine','quinta','maison','cave','caves','clos',
  'estate','winery','vineyard','vineyards','fattoria','castello','marques','marchesi',
  'famille','family','fils','freres','herdade','vinicola','wijngoed','wijnhuis',
  'des','del','dela','della','delle','dei','der','den','van','von','the','and','los','las']);
function matchWine(x){
  const woorden = t => new Set(norm(t||'').split(' ').filter(w => w.length > 2));
  const huis = t => new Set([...woorden(t)].filter(w => !HUISWOORDEN.has(w)));
  /* deelverzameling telt als treffer: "Talbot" hoort bij "Château Talbot" */
  const overlap = (a, b) => {
    if(!a.size || !b.size) return 0;
    let hit = 0; for(const t of a) if(b.has(t)) hit++;
    return hit / Math.min(a.size, b.size);
  };
  const xn = woorden(x.name), xp = huis(x.producer);
  if(!xn.size && !xp.size) return null;
  let best = null, bestScore = 0;
  for(const w of S.wines){
    /* in een kelder is een andere jaargang gewoon een andere fles */
    if(x.vintage && w.vintage && String(x.vintage) !== String(w.vintage)) continue;
    const wn = woorden(w.name), wp = huis(w.producer);
    const naam = overlap(xn, wn);
    if(naam < 0.6) continue;
    /* twee huizen die toevallig dezelfde cuvéenaam gebruiken zijn niet dezelfde wijn */
    const prod = overlap(xp, wp);
    if(xp.size && wp.size && prod === 0) continue;
    const score = naam * 0.75 + prod * 0.25;
    if(score > bestScore){ bestScore = score; best = w; }
  }
  return bestScore >= 0.6 ? best : null;
}

/* scoort de hele kelder tegen een gerecht; gedeeld door de kelderregels
   (winesForDish) en het voorfilter dat de AI-prompt klein houdt */
function scoreWines(text){
  const t = norm(text);
  const cats = FOODS.filter(f => f.kw.some(k => t.includes(norm(k))));
  const scored = S.wines.filter(w => w.qty > 0).map(w => {
    let sc = 0; let reason = ''; let grapeHit = false;
    if(cats.length){
      for(const c of cats){
        const tw = c.w[w.type] || 0; sc += tw;
        if(tw > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))){ sc += 1.6; grapeHit = true; }
        if(tw >= 3 && !reason) reason = c.rW;
      }
      sc = sc / cats.length;
    } else sc = 1.6;
    const st = windowStatus(w);
    /* urgentie telt mee: wat op moet en past, schenk je juist nú */
    if(st.k==='op') sc += 0.9; else if(st.k==='nu') sc += 1.4; else if(st.k==='jong') sc -= 1.3; else if(st.k==='over') sc += 0.8;
    /* je smaak: een druif of streek waar je van houdt krijgt een duwtje, een afkeer een tikje */
    sc += 0.8 * smaakMatch(w);
    return {w, sc, reason, grapeHit, st};
  }).filter(x => x.sc > 1).sort((a,b) => b.sc - a.sc);
  return {cats, scored};
}

function winesForDish(text){
  const {cats, scored:all} = scoreWines(text);
  const scored = all.slice(0,5);
  const mx = Math.max(4.8, ...scored.map(x=>x.sc));
  scored.forEach(x => {
    x.score = Math.max(4, Math.min(10, Math.round(x.sc / mx * 10)));
    let r = x.reason ? x.reason.charAt(0).toUpperCase()+x.reason.slice(1) : 'Veelzijdige keuze uit je kelder';
    if(x.grapeHit && x.w.grapes && x.w.grapes.length) r += `, want de ${esc(x.w.grapes[0])} doet hier precies wat nodig is`;
    x.rHtml = r + '.';
  });
  return {cats, list:scored};
}

function dishesForWine(w){
  const ranked = FOODS.map(c => {
    let sc = (c.w[w.type] || 0);
    if(sc > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))) sc += 2;
    return {c, sc};
  }).filter(x => x.sc >= 3).sort((a,b) => b.sc - a.sc).slice(0,5);
  const out = [];
  for(const {c} of ranked){
    out.push({dish:c.dishes[0], reason:c.rW.charAt(0).toUpperCase()+c.rW.slice(1)+'.'});
    if(c.dishes[1] && out.length < 6 && ranked.length < 4) out.push({dish:c.dishes[1], reason:'Zelfde register: '+c.rW+'.'});
  }
  return out.slice(0,6);
}

/* Wat een AI-actie kost aan tegoed. Moet gelijk blijven aan creditsFor() in
   supabase/ai-function.ts: foto's bepalen de kosten, en een kaartpagina (1568 px)
   is ongeveer twee keer zo duur als een etiket (1100 px). */
function creditCost(kind, images){
  images = images || 0;
  if(kind === 'wijnkaart') return Math.max(2, images * 2);
  if(kind === 'prijs') return 5;   /* webzoekopdrachten plus de gelezen pagina's: gemeten ± $0,14 per fles */
  return Math.max(1, images);
}

}
/* Kan deze browser een antwoord stuk voor stuk lezen? Zo niet, dan wachten we
   gewoon op het hele antwoord zoals vroeger; alles blijft werken. */
const CAN_STREAM = typeof ReadableStream !== 'undefined' && typeof TextDecoder !== 'undefined'
  && typeof Response !== 'undefined' && 'body' in Response.prototype;

/* Anthropic stuurt server-sent events: regels 'data: {…}'. We plukken de tekst
   eruit en geven na elk stukje door wat er nu staat. */
async function readSSE(res, onText){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
      if(!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if(!raw || raw === '[DONE]') continue;
      let ev; try{ ev = JSON.parse(raw); }catch(e){ continue; }
      if(ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Fout tijdens het lezen');
      if(ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string'){
        out += ev.delta.text;
        if(onText) try{ onText(out); }catch(e){}
      }
    }
  }
  return out;
}
async function callAnthropicDirect(content, maxTokens, onText, opts){
  const model = (S.settings.model||'claude-sonnet-5').trim();
  const body = { model, max_tokens:maxTokens||2000, messages:[{role:'user', content}] };
  /* zoekagent: de server-side webzoekfunctie van de API, alleen voor prijzen */
  if(opts && opts.web) body.tools = [{type:'web_search_20260209', name:'web_search', max_uses:4}];
  /* Sonnet 5 / Opus 5 denken standaard mee in het antwoordbudget, en voor JSON-extractie
     zetten we dat uit (sneller, goedkoper, geen afgekapte JSON). Fable/Mythos en Haiku
     accepteren dit veld niet op dezelfde manier: daar weglaten. */
  if(/sonnet-[45]|opus-[45]/.test(model)) body.thinking = {type:'disabled'};
  const stream = !!onText && CAN_STREAM;
  if(stream) body.stream = true;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':ownKey(),
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  if(stream && res.body) return readSSE(res, onText);
  const d = await res.json();
  return (d.content||[]).filter(b => b.type==='text').map(b => b.text).join('');
}
function parseJsonLoose(s){
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) throw new Error('Geen JSON in antwoord');
  return JSON.parse(s.slice(a, b+1));
}

/* Wat er al leesbaar in het halve antwoord staat. Een sleutel-waardepaar telt pas
   mee als het afsluitende aanhalingsteken binnen is, dus je ziet nooit een halve
   naam staan. Puur om mee te kijken; het echte invullen gebeurt aan het eind. */
/* Alles wat er nu al compleet in het halve antwoord staat. Een waarde telt pas
   mee als hij is afgesloten, dus je ziet nooit een halve naam of een half lijstje. */
function scanPartial(txt){
  const uit = {};
  const tekst = k => {
    const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if(!m) return undefined;
    try{ return JSON.parse('"' + m[1] + '"'); }catch(e){ return undefined; }
  };
  const jaar = k => { const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*(\\d{4})')); return m ? +m[1] : undefined; };
  for(const k of ['name','producer','type','country','region','appellation','score_seen']){
    const v = tekst(k); if(v !== undefined) uit[k] = v;
  }
  for(const k of ['vintage','drink_from','drink_to']){
    const v = jaar(k); if(v !== undefined) uit[k] = v;
  }
  const g = txt.match(/"grapes"\s*:\s*\[([^\]]*)\]/);
  if(g){ try{ uit.grapes = JSON.parse('[' + g[1] + ']'); }catch(e){} }
  return uit;
}

function cellarLines(dish){
  const inStock = S.wines.filter(w => w.qty > 0);

    const {cats, scored} = scoreWines(dish);

/* foto verkleinen */
/* Een etiket bij kaarslicht komt er donker en vlak uit, en dan valt er voor de
   sommelier weinig te lezen. Is de foto donker, dan leggen we zwart- en witpunt op
   de werkelijke uitersten (op 1% aan elke kant na) en trekken we de donkere delen
   met een lichte gamma omhoog. Bij een normaal belichte foto gebeurt er niets. */
function liftDark(ctx, w, h){
  let im; try{ im = ctx.getImageData(0, 0, w, h); }catch(e){ return false; }
  const d = im.data, n = d.length / 4, hist = new Uint32Array(256);
  let sum = 0;
  for(let i = 0; i < d.length; i += 4){
    const y = (d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000 | 0;
    hist[y]++; sum += y;
  }
  if(sum / n > 105) return false;                  /* helder genoeg */
  const cut = Math.max(1, Math.round(n * 0.01));
  let lo = 0, hi = 255, acc = 0;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= cut){ lo = v; break; } }
  acc = 0;
  for(let v = 255; v >= 0; v--){ acc += hist[v]; if(acc >= cut){ hi = v; break; } }
  if(hi - lo < 24) return false;                   /* vlak beeld: uitrekken vergroot alleen de ruis */
  const scale = 255 / (hi - lo), lut = new Uint8Array(256);
  for(let v = 0; v < 256; v++){
    const x = Math.min(1, Math.max(0, (v - lo) * scale / 255));
    lut[v] = Math.round(Math.pow(x, 0.85) * 255);
  }
  for(let i = 0; i < d.length; i += 4){ d[i] = lut[d[i]]; d[i+1] = lut[d[i+1]]; d[i+2] = lut[d[i+2]]; }
  ctx.putImageData(im, 0, 0);
  return true;
}
function resizeImg(file, maxW, q, opts){
  opts = opts || {};
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*sc));
      c.height = Math.max(1, Math.round(img.height*sc));
      const ctx = c.getContext('2d', {willReadFrequently: !!opts.lift});
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const lifted = opts.lift ? liftDark(ctx, c.width, c.height) : false;
      URL.revokeObjectURL(url);
      /* Al klein genoeg én niets bijgetrokken? Dan houden we de originele bytes.
         Een tweede JPEG-ronde kost juist het fijne detail dat bij weinig licht
         het verschil maakt tussen lezen en gokken. Alleen voor echte JPEG's:
         de rest moet hoe dan ook omgezet, want we sturen hem als image/jpeg. */
      if(opts.keep && sc >= 1 && !lifted && file.type === 'image/jpeg'){
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = () => res(c.toDataURL('image/jpeg', q));
        fr.readAsDataURL(file);
        return;
      }
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Foto kon niet worden gelezen')); };
    img.src = url;
  });
}

  return `<div class="hdr"><div><div class="brand">Caveau<span class="dot">.</span></div></div><div class="hdr-sub tnum">${sub||''}</div></div>`;

const cellarValue = () => S.wines.reduce((n,w) => n + (w.qty||0) * (Number(w.value ?? w.price) || 0), 0);

/* ================= KELDER ================= */
function filteredWines(){
  let a = S.wines.slice();
  if(UI.q){ const q = norm(UI.q);
    a = a.filter(w => norm([w.name,w.producer,w.region,w.country,w.appellation,(w.grapes||[]).join(' '),w.location,w.note,w.vintage].join(' ')).includes(q)); }
  if(UI.ftype) a = a.filter(w => w.type === UI.ftype);
  if(UI.fstatus) a = a.filter(w => ['op','nu'].includes(windowStatus(w).k));
  if(UI.fovertijd) a = a.filter(w => windowStatus(w).k === 'over');
  if(UI.floc) a = a.filter(w => UI.floc === '::none' ? !w.location : (w.location||'') === UI.floc);
  const by = {
    recent: (x,y) => (y.addedAt||0) - (x.addedAt||0),
    naam:   (x,y) => (x.name||'').localeCompare(y.name||'', 'nl'),
    jaar:   (x,y) => (x.vintage||9999) - (y.vintage||9999),
    venster:(x,y) => (URG[windowStatus(x).k] - URG[windowStatus(y).k]) || ((x.drinkTo||9999) - (y.drinkTo||9999)),
    waarde: (x,y) => ((Number(y.value ?? y.price)||0) - (Number(x.value ?? x.price)||0)),
    score:  (x,y) => (scoreNum(y) - scoreNum(x)) || (x.name||'').localeCompare(y.name||'', 'nl')
  };
  a.sort(by[UI.sort] || by.recent);
  return a;
}
const SORTS = {recent:'Recent toegevoegd', naam:'Naam', jaar:'Jaargang', venster:'Drinkvenster (op dronk eerst)', waarde:'Waarde', score:'Score (zelf genoteerd)'};
/* eerste getal uit "92 Parker" of "8,5 Hamersma"; zonder score achteraan */
const scoreNum = w => { const m = String(w.score||'').replace(',', '.').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : -1; };

/* ================= smaakprofiel ================= */
/* Twee lagen: wat je zelf aangeeft (druiven, streken, vijf schuifjes, kleur) en
   wat de sterren in je historie laten zien. Gaat als één regel mee in de
   AI-prompts en telt mee in de kelderregels. Blijft lokaal en in het sync-document. */
const SMAAK_DRUIVEN = ['Cabernet Sauvignon','Merlot','Pinot Noir','Syrah','Grenache','Tempranillo','Sangiovese','Nebbiolo','Malbec','Cabernet Franc','Gamay','Mourvèdre','Barbera','Primitivo','Zinfandel',
  'Chardonnay','Sauvignon Blanc','Riesling','Chenin Blanc','Pinot Grigio','Viognier','Grüner Veltliner','Albariño','Verdejo','Gewürztraminer'];
const SMAAK_REGIOS = ['Bordeaux','Bourgogne','Rhône','Loire','Champagne','Languedoc','Provence','Elzas','Piemonte','Toscane','Veneto','Sicilië','Rioja','Ribera del Duero','Priorat','Douro','Mosel','Oostenrijk','Californië','Chili','Argentinië','Zuid-Afrika','Australië','Nieuw-Zeeland'];
const SMAAK_SCHUIF = [
  ['body',    'Licht',          'Vol'],
  ['tannine', 'Weinig tannine', 'Veel tannine'],
  ['zuur',    'Zacht en rond',  'Fris en strak'],
  ['zoet',    'Droog',          'Zoet'],
  ['hout',    'Geen hout',      'Veel hout'],
];
function smaak(){
  if(!S.settings.smaak) S.settings.smaak = {druiven:[], regios:[], schuif:{}, kleur:''};
  const p = S.settings.smaak;
  p.druiven = p.druiven || []; p.regios = p.regios || []; p.schuif = p.schuif || [];
  return p;
}
/* Wat de sterren in je historie laten zien: per druif, streek en type het
   gemiddelde, en alleen als er genoeg is om iets van te vinden. */
function smaakGeleerd(){
  const per = {druif:{}, regio:{}, type:{}};
  const tel = (kant, k, r) => { if(!k) return; const key = norm(k); const e = per[kant][key] || (per[kant][key] = {n:0, som:0, naam:k}); e.n++; e.som += r; };
  let n = 0;
  for(const h of (S.history||[])){
    const r = Number(h.rating); if(!(r > 0)) continue;
    n++;
    const w = h.wineId ? findWine(h.wineId) : null;
    (h.grapes || (w && w.grapes) || []).forEach(g => tel('druif', g, r));
    tel('regio', h.region || (w && w.region), r);
    tel('type', TYPES[h.type] ? TYPES[h.type].l : '', r);
  }
  const pluk = (kant, test, min) => Object.values(per[kant]).filter(e => e.n >= (min || 2) && test(e.som / e.n)).sort((a,b) => b.som/b.n - a.som/a.n).map(e => e.naam);
  return { n, genoeg: n >= 5,
    hoog: {druif: pluk('druif', a => a >= 4), regio: pluk('regio', a => a >= 4), type: pluk('type', a => a >= 4)},
    /* een hele streek afschrijven vraagt meer bewijs dan één druif */
    laag: {druif: pluk('druif', a => a <= 2.5), regio: pluk('regio', a => a <= 2.5, 3), type: pluk('type', a => a <= 2.5, 3)} };
}
function smaakSets(){
  const p = smaak(), L = smaakGeleerd();
  const fav = new Set([...p.druiven, ...(L.genoeg ? L.hoog.druif : [])].map(norm));
  const favR = new Set([...p.regios, ...(L.genoeg ? L.hoog.regio : [])].map(norm));
  const nee = new Set((L.genoeg ? L.laag.druif : []).map(norm));
  const neeR = new Set((L.genoeg ? L.laag.regio : []).map(norm));
  return {fav, favR, nee, neeR};
}
/* +1 past bij je smaak, -1 juist niet, 0 niets over te zeggen */
function smaakMatch(w){
  const s = smaakSets();
  const gs = (w.grapes || []).map(norm), r = norm([w.region, w.appellation, w.country].filter(Boolean).join(' '));
  const raak = set => gs.some(g => [...set].some(f => g.includes(f) || f.includes(g)));
  const raakR = set => [...set].some(f => f && r.includes(f));
  if(raak(s.fav) || raakR(s.favR)) return 1;
  if(raak(s.nee) || raakR(s.neeR)) return -1;
  return 0;
}
const smaakHit = w => smaakMatch(w) > 0;
/* één regel voor in de AI-prompts */
function smaakNote(){
  const p = smaak(), L = smaakGeleerd(), delen = [];
  if(p.druiven.length) delen.push('houdt van ' + p.druiven.join(', '));
  if(p.regios.length) delen.push('drinkt graag wijn uit ' + p.regios.join(', '));
  const s = p.schuif || {};
  const woord = {
    body:    ['heel lichte wijnen', 'lichte wijnen', '', 'volle wijnen', 'heel volle wijnen'],
    tannine: ['nauwelijks tannine', 'weinig tannine', '', 'stevige tannine', 'veel tannine'],
    zuur:    ['zacht en rond', 'eerder rond dan fris', '', 'fris', 'strak en fris'],
    zoet:    ['', '', 'een vleugje zoet mag', 'graag wat zoet', 'zoete wijnen'],
    hout:    ['geen hout', 'weinig hout', '', 'graag wat hout', 'veel hout'],
  };
  const stijl = Object.keys(woord).map(k => s[k] != null && woord[k][s[k]] ? woord[k][s[k]] : '').filter(Boolean);
  if(stijl.length) delen.push('voorkeur voor ' + stijl.join(', '));
  if(p.kleur === 'rood' || p.kleur === 'wit') delen.push('drinkt het liefst ' + p.kleur);
  if(L.genoeg){
    const hoog = [...L.hoog.druif, ...L.hoog.regio].slice(0, 6), laag = [...L.laag.druif, ...L.laag.regio].slice(0, 4);
    if(hoog.length) delen.push('gaf eerder hoge cijfers aan ' + hoog.join(', '));
    if(laag.length) delen.push('lage cijfers aan ' + laag.join(', '));
  }
  return delen.join('; ');
}
const smaakPrompt = () => { const n = smaakNote(); return n ? `\nMijn smaak: ${n}. Weeg dat mee, maar het gerecht gaat voor.` : ''; };

function viewSmaak(){
  const p = smaak(), L = smaakGeleerd();
  const eigen = new Set(), kelderDruiven = [], kelderRegios = [];
  S.wines.forEach(w => { (w.grapes||[]).forEach(g => { const k = norm(g); if(!eigen.has(k)){ eigen.add(k); kelderDruiven.push(g); } }); });
  const alleDruiven = [...SMAAK_DRUIVEN]; kelderDruiven.forEach(g => { if(!alleDruiven.some(x => norm(x) === norm(g))) alleDruiven.push(g); });
  const rs = new Set(); S.wines.forEach(w => { if(w.region && !rs.has(norm(w.region))){ rs.add(norm(w.region)); kelderRegios.push(w.region); } });
  const alleRegios = [...SMAAK_REGIOS]; kelderRegios.forEach(r => { if(!alleRegios.some(x => norm(x) === norm(r))) alleRegios.push(r); });
  const aan = (lijst, v) => lijst.some(x => norm(x) === norm(v));
  const chips = (lijst, gekozen, act) => `<div class="chiprow" style="padding:6px 0 2px;flex-wrap:wrap">${lijst.map(v => `<button type="button" class="chip ${aan(gekozen, v)?'on':''}" data-act="${act}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  const geleerd = !L.genoeg
    ? `<p class="small">Na vijf beoordeelde flessen (sterren in je drink-historie, nu ${L.n}) verschijnt hier waar je hoog en laag scoort.</p>`
    : `<p class="small mb8">Uit ${L.n} beoordelingen.</p>
       ${[['Hoog', L.hoog], ['Laag', L.laag]].map(([kop, d]) => { const alles = [...d.druif, ...d.regio, ...d.type]; return alles.length ? `<div class="small mb8"><b>${kop}:</b> ${alles.map(esc).join(', ')}</div>` : ''; }).join('') || '<p class="small">Nog geen duidelijke lijn; dat komt met meer beoordelingen.</p>'}`;
  return `${brandRow('')}${backRow}<div class="eyebrow">Jouw smaak</div><h2 class="h2">Waar je van houdt</h2>
    <p class="small mb8">De sommelier weegt dit mee bij "Vanavond", op de wijnkaart en bij vragen. Het gerecht gaat altijd voor. Alles hieronder is optioneel.</p>
    <div class="eyebrow mb8 mt14">Druiven</div>${chips(alleDruiven, p.druiven, 'smaakDruif')}
    <div class="eyebrow mb8 mt14">Streken</div>${chips(alleRegios, p.regios, 'smaakRegio')}
    <div class="eyebrow mb8 mt14">Stijl</div>
    ${SMAAK_SCHUIF.map(([k, l, r]) => `<div class="field" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)"><span>${l}</span><span>${r}</span></div>
      <input type="range" min="0" max="4" step="1" value="${p.schuif[k] != null ? p.schuif[k] : 2}" data-in="smaakSchuif" data-k="${k}" style="width:100%;accent-color:var(--acc)" aria-label="${l} tot ${r}"></div>`).join('')}
    <p class="small mb8">In het midden laten betekent geen voorkeur.</p>
    <div class="eyebrow mb8 mt14">Kleur</div>
    <div class="seg" id="smaakKleur">${[['','Geen voorkeur'],['rood','Rood'],['wit','Wit']].map(([v,l]) => `<button type="button" class="${(p.kleur||'')===v?'on':''}" data-act="smaakKleur" data-v="${v}">${l}</button>`).join('')}</div>
    <hr class="sep"><div class="eyebrow mb8">Wat we van je merken</div>${geleerd}
    ${smaakNote() ? `<hr class="sep"><div class="eyebrow mb8">Zo gaat het naar de sommelier</div><p class="small">${esc(smaakNote())}.</p>` : ''}`;
}
ACT.smaakDruif = el => { const p = smaak(), v = el.dataset.v; const i = p.druiven.findIndex(x => norm(x) === norm(v)); if(i >= 0) p.druiven.splice(i, 1); else p.druiven.push(v); save(); render(); };
ACT.smaakRegio = el => { const p = smaak(), v = el.dataset.v; const i = p.regios.findIndex(x => norm(x) === norm(v)); if(i >= 0) p.regios.splice(i, 1); else p.regios.push(v); save(); render(); };
ACT.smaakKleur = el => { smaak().kleur = el.dataset.v || ''; save(); render(); };
INP.smaakSchuif = el => { const p = smaak(); const v = Number(el.value); if(v === 2) delete p.schuif[el.dataset.k]; else p.schuif[el.dataset.k] = v; save(true); clearTimeout(INP._smaakT); INP._smaakT = setTimeout(() => save(), 800); };


/* ================= plek in je kelder ================= */
/* Relatief aan de eigen kelder, nooit absolute prijsklassen, en alleen naar
   boven: wat onder de mediaan zit krijgt geen label. Een prijs zonder bron
   (AI-schatting) levert hooguit "waarschijnlijk" op; "Je topfles" vraagt een
   opgezochte, zelf ingevulde of betaalde prijs. */
const vandaag = () => new Date().toISOString().slice(0,10);
const KLASSEN = [
  [/brunello/i, 'Brunello'], [/\bbarolo\b/i, 'Barolo'], [/barbaresco/i, 'Barbaresco'], [/amarone/i, 'Amarone'],
  [/premier grand cru class/i, 'Premier Grand Cru Classé'], [/grand cru class/i, 'Grand Cru Classé'],
  [/\bcru bourgeois\b/i, 'Cru Bourgeois'], [/\bcru class/i, 'Cru Classé'],
  [/\bgrand cru\b/i, 'Grand Cru'], [/premier cru|1er cru/i, 'Premier Cru'],
  [/gran reserva/i, 'Gran Reserva'], [/\briserva\b/i, 'Riserva'], [/\breserva\b/i, 'Reserva'],
  [/vintage port/i, 'Vintage Port'], [/late bottled vintage|\bLBV\b/, 'LBV'],
  [/grosse lage|grosses gew[aä]chs|\bGG\b/, 'Grosse Lage'], [/erste lage/i, 'Erste Lage'],
  [/\bdocg\b/i, 'DOCG'],
];
function klasse(w){
  const s = [w.appellation, w.name].filter(Boolean).join(' ');
  for(const [re, lab] of KLASSEN) if(re.test(s)) return lab;
  return null;
}
const waardeVan = w => Number(w.value ?? w.price) || 0;
function kelderPrijzen(){
  return S.wines.map(waardeVan).filter(v => v > 0).sort((a,b) => a-b);
}
function plekInKelder(w){
  const v = waardeVan(w); if(!v) return null;
  const ps = kelderPrijzen(); if(ps.length < 6) return null;
  const med = ps[Math.floor(ps.length/2)];
  const boven = ps.filter(p => p > v).length;
  const topN = Math.max(3, Math.ceil(ps.length * 0.1)), hoogN = Math.ceil(ps.length * 0.25);
  const zeker = !!w.valueSrc && w.valueSrc !== 'ai';
  if(boven < topN && v >= med * 1.5) return {k:'top', zeker, max: boven === 0};
  if(boven < hoogN && v >= med * 1.25) return {k:'hoog', zeker, max:false};
  return null;
}
function plekLabel(p){
  if(p.k === 'top') return p.zeker ? (p.max ? 'Je topfles' : 'Een van je topflessen') : 'Waarschijnlijk een topfles';
  return p.zeker ? 'Een van je duurdere flessen' : 'Waarschijnlijk een van je duurdere flessen';
}
const hoofd = s => s.charAt(0).toUpperCase() + s.slice(1);
/* Het antwoord op "is dit er een voor vanavond of om te bewaren", in één zin.
   Gaat over de fles; de gelegenheid is aan de gebruiker. */
function verdict(w){
  const st = windowStatus(w), p = plekInKelder(w), n = w.qty || 0;
  const lab = p ? plekLabel(p).toLowerCase() : '';
  const f = w.drinkFrom, t = w.drinkTo;
  if(st.k === 'jong') return `Bewaren. ${p ? hoofd(lab) + ', en pas' : 'Pas'} vanaf ${f} op dronk.`;
  if(st.k === 'over') return `Open hem gauw, het venster liep in ${t} af.`;
  if(st.k === 'nu') return `Binnenkort open, nog op dronk tot ${t}.${p ? ' Plan er een mooie avond voor.' : ''}`;
  if(st.k === 'op'){
    if(p) return `${hoofd(lab)}. Op dronk${t ? ' tot ' + t : ''}, dus geen haast: bewaar hem voor een moment.`;
    return `Kan open. Op dronk${t ? ' tot ' + t : ''}${n > 1 ? ', en je hebt er ' + n : ''}.`;
  }
  return p ? `${hoofd(lab)}. Drinkvenster onbekend.` : '';
}
/* medaille: gevuld bij een prijs met bron, open bij een schatting */
const MEDAL = vol => `<svg class="medal" width="11" height="13" viewBox="0 0 22 26" aria-hidden="true"><path d="M6 1h4l1 8h-4zM16 1h-4l-1 8h4z" fill="currentColor" opacity=".8"/><circle cx="11" cy="17" r="7.2" fill="${vol?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/></svg>`;
const topKort = w => { const p = plekInKelder(w); return p && p.k === 'top' ? `<span class="badge b-top">${MEDAL(p.zeker)} ${p.zeker?'Topfles':'Mogelijk topfles'}</span>` : ''; };
const topBadge = w => { const p = plekInKelder(w); return p && p.k === 'top' ? `<span class="badge b-top">${MEDAL(p.zeker)} ${plekLabel(p)}</span>` : ''; };
function waardeSub(w){
  const b = waardeVan(w); if(!b) return '';
  const oud = w.vintage && (YR() - w.vintage) >= 8;
  const marge = oud ? 0.3 : 0.2;
  const lo = Number(w.valueLow) || Math.round(b * (1 - marge)), hi = Number(w.valueHigh) || Math.round(b * (1 + marge));
  const dat = w.valueAt ? new Date(w.valueAt).toLocaleDateString('nl-NL', {month:'short', year:'numeric'}) : '';
  let bron = '';
  if(w.valueSrc === 'zoek' && w.valueBron){
    const jr = w.valueBron.vintage && w.vintage && w.valueBron.vintage !== w.vintage ? `, jaargang ${w.valueBron.vintage}` : '';
    const naam = esc(w.valueBron.name || 'opgezocht');
    bron = (w.valueBron.url ? `<a href="${esc(w.valueBron.url)}" target="_blank" rel="noopener">${naam}</a>` : naam) + jr + (dat ? ', ' + dat : '');
  } else if(w.valueSrc === 'eigen') bron = 'zelf ingevuld' + (dat ? ', ' + dat : '');
  else if(w.value != null) bron = 'schatting' + (dat ? ' van ' + dat : '') + (oud ? ', bij oudere wijnen grof' : '');
  return `<div class="small tnum">${money(lo)} – ${money(hi)}</div>${bron ? `<div class="small">${bron}</div>` : ''}`;
}
function plekHtml(w){
  const zin = verdict(w), p = plekInKelder(w), kl = klasse(w);
  const chips = [];
  if(p) chips.push(`<span class="badge b-top">${p.k === 'top' ? MEDAL(p.zeker) + ' ' : ''}${plekLabel(p)}</span>`);

/* ---- prijstabel: gratis raadplegen, voor nieuwe én oude scans ----
   Dezelfde sleutel als in de Edge Function (producent|naam|jaargang, genormaliseerd). */
function prijsSleutel(w){
  const n = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const jaar = Number(w.vintage) || 0;
  return `${n(w.producer)}|${n(w.name)}|${jaar || 'nv'}`;
}
async function prijzenUitTabel(wines){
  if(!wines.length || typeof loggedIn !== 'function' || !loggedIn()) return 0;
  if(!sbAccess){ const ok = await sbRefresh(); if(!ok) return 0; }
  let d = {};
  try{
    const res = await fetch(SB_URL + '/functions/v1/ai', {
      method:'POST', headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + sbAccess, 'apikey':SB_KEY },
      body: JSON.stringify({ kind:'prijscache', wines: wines.slice(0, 100).map(w => ({name:w.name, producer:w.producer, vintage:w.vintage})) })
    });
    if(!res.ok) return 0;
    d = await res.json().catch(() => ({}));
  }catch(_){ return 0; }
  const map = new Map((d.prices || []).map(p => [p.key, p]));
  let n = 0;
  for(const w of wines){ const p = map.get(prijsSleutel(w)); if(p && pasPrijsToe(w, {...p, cached:true})) n++; }
  if(n){ save(); render(); }
  return n;
}
/* Na een scan: eerst gratis in de tabel kijken; staat hij er niet in, dan zoeken
   als het tegoed dat toelaat en de fles het waard is. */
async function prijsNaScan(w){
  try{
    const n = await prijzenUitTabel([w]);
    if(n){ toast(`Prijs uit de Caveau-prijstabel: ${money(w.value)}${w.valueBron && w.valueBron.name ? ' · ' + w.valueBron.name : ''}`, null, null, 5000); return; }
  }catch(_){}
  if(aiReady() && prijsAutoMag() && prijsWaardig(w)) prijsAchteraf(w);
}
/* Eén keer per dag, bij het openen: alle flessen zonder opgezochte prijs langs de tabel. */
async function prijsTabelRonde(){
  if(typeof loggedIn !== 'function' || !loggedIn()) return;
  const dag = vandaag();
  if(S.settings.prijsRondeOp === dag) return;
  const targets = S.wines.filter(w => w.valueSrc !== 'zoek');

  const n = await prijzenUitTabel(targets);

/* ---- zoekagent: echte prijs met bron en datum ---- */
async function aiPrijs(w){
  const wie = `${w.name}${w.producer && w.producer !== w.name ? ', ' + w.producer : ''}, jaargang ${w.vintage || 'NV'}, ${[w.appellation, w.region, w.country].filter(Boolean).join(', ') || 'herkomst onbekend'}`;
  const prompt = `Zoek de actuele marktprijs in euro's van precies deze wijn en jaargang: ${wie}. Zoek bij Europese wijnhandels, veilingsites en prijsvergelijkers, Nederland en België eerst. Neem alleen prijzen van dezelfde jaargang; is die nergens te koop, neem dan de dichtstbijzijnde jaargang en zet die in vintage_found. Prijs per fles van 75 cl inclusief btw. Antwoord na het zoeken UITSLUITEND met geldig JSON, zonder andere tekst:
{"value":42,"low":38,"high":48,"source":"naam van de winkel of site","url":"adres van de pagina waar de prijs staat","vintage_found":2014,"confidence":"hoog|middel|laag","note":"één korte zin in het Nederlands over waar de prijs vandaan komt"}
Niets gevonden: {"value":null,"note":"reden"}.${STIJLREGELS}`;
  const out = await callClaude([{type:'text', text:prompt}], 1500, 'prijs', null, {web:true, wine:{name:w.name, producer:w.producer, vintage:w.vintage}});

function pasPrijsToe(w, r){
  if(!r || r.value == null) return false;
  w.value = Math.round(r.value);

  w.valueHigh = r.high != null ? Math.round(r.high) : null;
  w.valueSrc = 'zoek'; w.valueAt = vandaag();
  w.valueBron = { name: String(r.source || '').slice(0, 80), url: String(r.url || '').slice(0, 400),
    vintage: r.vintage_found || null, conf: r.confidence || null, note: String(r.note || '').slice(0, 200), cached: !!r.cached };
  return true;
}
/* Voor welke flessen loont opzoeken: oud, of aan de bovenkant van de kelder. */

function timelineHtml(w){
  const f = w.drinkFrom, t = w.drinkTo;
  if(!f && !t) return '';
  const y = YR(), lo = Math.min(f||y, y) - 1, hi = Math.max(t||y, y) + 1, span = Math.max(1, hi-lo);
  const L = v => Math.min(100, Math.max(0, (v-lo)/span*100)).toFixed(1);
  /* valt "nu" samen met het begin of einde van het venster, dan één label i.p.v. twee
     die over elkaar heen vallen; ligt het er vlak naast, dan wint de jaargrens */
  let labs = [];
  if(f) labs.push([f, f === y ? `nu · ${f}` : String(f), f === y ? 'now' : '']);
  if(t && t !== f) labs.push([t, t === y ? `nu · ${t}` : String(t), t === y ? 'now' : '']);
  if(y !== f && y !== t){
    const near = labs.some(l => Math.abs(Number(L(l[0])) - Number(L(y))) < 7);
    if(!near) labs.push([y, `nu · ${y}`, 'now']);
  }
  labs.sort((a,b) => a[0] - b[0]);
  /* elk label staat onder zijn eigen punt; aan de randen schuift het naar binnen */
  const place = v => { const x = Number(L(v));
    return `left:${x}%;transform:translateX(${x < 12 ? '0' : x > 88 ? '-100%' : '-50%'})`; };
  return `<div class="tl" role="img" aria-label="Drinkvenster ${f||'?'} tot ${t||'?'}"><div class="tl-track">
    ${(f&&t)?`<div class="tl-fill" style="left:${L(f)}%;right:${(100-Number(L(t))).toFixed(1)}%"></div>`:''}
    <div class="tl-now" style="left:${L(y)}%"></div></div>
    <div class="tl-lab">${labs.map(l=>`<span class="${l[2]}" style="${place(l[0])}">${l[1]}</span>`).join('')}</div></div>`;
}

/* Schenkadvies uit vaste sommelierregels: temperatuur, glas en karafferen.
   Kost geen tegoed en werkt offline; de AI is er voor de rest ("Vraag"). */
function serveAdvice(w){
  const g = (w.grapes||[]).map(norm).join(' ') + ' ' + norm(w.name) + ' ' + norm(w.appellation||'') + ' ' + norm(w.region||'');
  const has = list => list.some(x => g.includes(x));
  const age = w.vintage ? YR() - w.vintage : null;
  const st = windowStatus(w);
  let temp = '14–16 °C', glass = 'een tulpvormig wijnglas', tips = [];

  if(w.type === 'mousserend'){
    temp = (age !== null && age > 8) ? '8–10 °C' : '6–8 °C';
    glass = 'een fluit, of liever een smal tulpglas, want daar komt meer geur uit';
    tips.push(age !== null && age > 8
      ? 'Een gerijpte bubbel wil niet ijskoud; te koud smoort de complexiteit.'
      : 'Drie uur in de koelkast koelt beter en rustiger dan een kwartier in de vriezer.');
  } else if(w.type === 'wit'){
    const rijk = has(['chardonnay','semillon','viognier','marsanne','roussanne','gruner']) || (age !== null && age > 5);
    temp = rijk ? '10–12 °C' : '8–10 °C';
    glass = rijk ? 'een ruimer wijnglas' : 'een tulpvormig wijnglas';
    tips.push('Recht uit de koelkast is meestal te koud. Zet hem twintig minuten van tevoren op tafel.');
  } else if(w.type === 'rose'){
    temp = '8–10 °C';
  } else if(w.type === 'zoet'){
    temp = '6–8 °C'; glass = 'een klein glas';
    tips.push('Schenk kleine glazen: koel en zoet werkt het best in kleine hoeveelheden.');
  } else if(w.type === 'versterkt'){
    if(has(['fino','manzanilla','sherry'])){ temp = '7–9 °C'; tips.push('Fino en manzanilla drink je koud en jong. Een geopende fles blijft maar een paar dagen goed.'); }
    else { temp = '16–18 °C'; tips.push('Een geopende fles port of oloroso houdt zich weken; koel bewaren na openen.'); }
  } else { /* rood */
    const licht = has(G_LIGHT_RED), groot = has(G_BIG_RED);
    temp = licht ? '12–14 °C' : groot ? '16–18 °C' : '14–16 °C';
    glass = has(['pinot','nebbiolo']) ? 'een bourgogneglas (bolle kelk)' : groot ? 'een ruim bordeauxglas' : 'een tulpvormig wijnglas';
    if(licht) tips.push('Kelderkoud is beter dan kamertemperatuur. Een half uur in de koelkast doet wonderen.');
    if(groot || licht === false){
      if(age !== null && age >= 15) tips.push('Karafferen: voorzichtig overschenken om het bezinksel achter te laten, en kort, want oude wijn kan snel omvallen.');
      else if(age !== null && age <= 7) tips.push('Karafferen: een uur of twee. Jong en stevig, hij heeft lucht nodig.');
      else if(age !== null) tips.push('Karafferen: een half uur is genoeg.');
    }
  }
  if(st.k === 'jong') tips.push('Nog aan de jonge kant. Extra tijd in de karaf helpt.');
  if(st.k === 'over') tips.push('Over zijn venster: open hem voorzichtig en drink hem dezelfde avond op.');
  return { temp, glass, tips: tips.slice(0,2) };
}

/* Herbereken drinkvenster + pairing op basis van wat er nu in het formulier staat
   (bv. na het zelf invullen van jaargang of druiven). AI indien beschikbaar, anders kelderregels. */
async function doRecalc(el, silent){
  const d = readForm();
  if(!d.name && !(d.grapes||[]).length && !d.region && !d.appellation){
    if(!silent) toast('Vul eerst minstens een naam, druif of regio in');
    return;
  }
  const orig = el ? el.innerHTML : '';
  if(el){ el.innerHTML = 'Herberekenen…'; el.style.pointerEvents = 'none'; }
  const setVal = (id, v) => { const x = document.getElementById(id); if(x && v != null && v !== '') x.value = v; };
  let src = 'Kelderregels', done = false;
  if(aiReady()){
    try{
      const r = await aiRecalc(d);
      if(r.drink_from) setVal('f_from', r.drink_from);
      if(r.drink_to) setVal('f_to', r.drink_to);
      if(!(d.grapes||[]).length && Array.isArray(r.grapes) && r.grapes.length) setVal('f_grapes', r.grapes.join(', '));
      if(!d.note && r.note) setVal('f_note', r.note);
      if(Array.isArray(r.pairing) && r.pairing.length){
        recalcPairing = r.pairing;
        if(scan.stage === 'confirm' && scan.data) scan.data.pairing = r.pairing;
      }
      if(r.value_eur != null && d.value == null) setVal('f_value', Math.round(r.value_eur));
      if(r.value_low != null && r.value_high != null) recalcValueRange = {low:Math.round(r.value_low), high:Math.round(r.value_high), value:(r.value_eur!=null?Math.round(r.value_eur):null)};
      src = 'Sommelier-AI'; done = true;
    }catch(e){ /* val terug op regels */ }
  }
  if(!done){
    const est = estimateWindow(d);
    setVal('f_from', est.from); setVal('f_to', est.to);
  }
  if(el){ el.innerHTML = orig; el.style.pointerEvents = ''; }
  toast(`Drinkvenster bijgewerkt (${src})`);
}
ACT.recalc = el => doRecalc(el, false);

  if(d.location) S.settings.lastLocation = d.location;
  if(!d.drinkFrom && !d.drinkTo){ const est = estimateWindow(d); d.drinkFrom = est.from; d.drinkTo = est.to; }
  const id = el.dataset.id;
  if(id){ const w = findWine(id); if(!w) return; const vOud = w.value; Object.assign(w, d);
    if(recalcPairing) w.pairing = recalcPairing;
    if(recalcValueRange){ w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); w.valueBron = null; }
    if(d.value != null && d.value !== vOud && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); w.valueBron = null; }
    save(); closeSheet(true); render(); toast('Bijgewerkt'); }
  else {
    const w = { id:uid(), ...d, qty:formQty, pairing:recalcPairing||[], photo:false, addedAt:Date.now() };
    if(recalcValueRange){ w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); }
    if(d.value != null && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); }
    S.wines.unshift(w); save(); closeSheet(true); UI.tab = 'kelder'; render();
    toast(`${formQty} ${plur(formQty,'fles','flessen')} toegevoegd`);
  }
};

/* Gerechten bij een wijn (detail & pairing), met richting-voorkeur en cache */
ACT.wineDishes = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  openSheet(`${sheetHead('Lekker bij ' + esc(w.name))}
    <div class="field"><label>Richting (optioneel)</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="pd_dir" placeholder="bv. Aziatisch, vegetarisch, licht &amp; zomers" style="flex:1">
        <button class="btn sm soft" data-act="dishGo" data-id="${w.id}" style="flex:none">Toon</button>
      </div></div>
    <div id="dishOut"></div>`);
  runWineDishes(w, '', false);
};
ACT.dishGo = el => { const w = findWine(el.dataset.id); runWineDishes(w, ((document.getElementById('pd_dir')||{}).value||'').trim(), false); };
ACT.dishFresh = el => { const w = findWine(el.dataset.id); runWineDishes(w, el.dataset.dir||'', true); };

async function runWineDishes(w, richting, force){
  const out = document.getElementById('dishOut'); if(!out || !w) return;
  const key = norm(richting||'') || '_';
  const cached = !force && w.dishCache && w.dishCache[key];
  if(cached && cached.list && cached.list.length){
    const dt = new Date(cached.at).toLocaleDateString('nl-NL', {day:'numeric', month:'short'});
    renderDishes(out, w, richting, cached.list, `Opgeslagen · ${dt}`, true);
    return;
  }
  let dishes = null, src = 'Kelderregels';
  if(aiReady()){
    out.innerHTML = `<div class="banner">${pourSvg}<span class="pulse">De sommelier denkt na…</span></div>`;
    try{
      const r = await aiWine(w, richting);
      dishes = (r.dishes||[]).map(d => ({dish:d.dish, reason:d.reason})).filter(d => d.dish);
      if(dishes.length){ src = 'Sommelier-AI'; w.dishCache = w.dishCache || {}; w.dishCache[key] = {at:Date.now(), list:dishes}; save(); }
    }catch(e){ dishes = null; }
  }
  if(!dishes || !dishes.length){ dishes = dishesForWine(w); src = 'Kelderregels'; }
  if(!dishes.length){ out.innerHTML = '<p class="small">Geen suggesties gevonden. Vul type of druiven aan.</p>'; return; }
  renderDishes(out, w, richting, dishes, src, false);
}
function renderDishes(out, w, richting, list, srcLabel, cached){
  out.innerHTML = `<div class="mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="srcchip">${esc(srcLabel)}</span>${richting?`<span class="small">richting: ${esc(richting)}</span>`:''}${cached?`<button class="linkbtn" style="font-size:12.5px" data-act="dishFresh" data-id="${w.id}" data-dir="${esc(richting||'')}">↻ vernieuw</button>`:''}</div>` +
    list.map(d => `<div class="dishcard"><div class="d">${esc(d.dish)}</div><div class="r">${esc(d.reason||'')}</div><div class="mt8"><button class="linkbtn" style="font-size:13px" data-act="recipeAsk" data-dish="${esc(d.dish)}" data-wid="${w.id}">📖 Recept tonen</button></div></div>`).join('');
}

/* ---- recepten (met personen-keuze en cache) ---- */
ACT.recipeAsk = el => {
  if(!aiReady() && !(S.recipeCache||[]).some(r => r.dish === el.dataset.dish)){
    toast('Recepten vergen de AI-sleutel (Meer → Instellingen)'); return;
  }
  const dish = el.dataset.dish, wid = el.dataset.wid || '';
  openSheet(`${sheetHead('Recept: ' + esc(dish))}
    <p class="small mb8">Voor hoeveel personen?</p>
    <div class="btnrow">${[2,4,6,8].map(n => `<button class="btn soft" data-act="recipeGo" data-dish="${esc(dish)}" data-wid="${wid}" data-p="${n}">${n}</button>`).join('')}</div>`);
};
ACT.recipeGo = async el => {
  const dish = el.dataset.dish, p = Number(el.dataset.p) || 4, wid = el.dataset.wid || null;
  const key = norm(dish) + '|' + p;
  closeSheet();
  const hit = (S.recipeCache||[]).find(r => r.key === key);
  if(hit){ showRecipe({...hit, cached:true}); return; }
  if(!aiReady()){ toast('Recepten vergen de AI-sleutel (Meer → Instellingen)'); return; }
  const sh = openSheet(`${sheetHead('Recept: ' + esc(dish))}<div class="banner">${pourSvg}<span class="pulse">Recept schrijven…</span></div>`);
  try{
    const r = await aiRecipe(dish, p);
    const wijn = wid ? findWine(wid) : null;
    const entry = {key, dish, persons:p, at:Date.now(), wineId:wid, wineName:wijn?`${wijn.name}${wijn.vintage?' '+wijn.vintage:''}`:null, recipe:r};
    S.recipeCache = (S.recipeCache||[]).filter(x => x.key !== key);
    S.recipeCache.unshift(entry);
    S.recipeCache = S.recipeCache.slice(0, 50);
    save();
    closeSheet(); showRecipe({...entry, cached:false});
  }catch(e){
    const inner = sh.querySelector('.sheet-in');
    if(inner) inner.innerHTML = `${sheetHead('Recept')}<div class="banner"><span>⚠️</span><span>Recept ophalen lukte niet (${esc(String(e.message||e).slice(0,90))}). Probeer het zo nog eens.</span></div>`;
  }
};
function showRecipe(e){
  const r = e.recipe || {};
  const wijn = e.wineId ? findWine(e.wineId) : null;
  const wijnRow = wijn
    ? `<button class="linkbtn" style="font-size:13px" data-act="detail" data-id="${wijn.id}">🍷 ${esc(e.wineName||wijn.name)} →</button>`
    : (e.wineName ? `<span class="small">🍷 ${esc(e.wineName)} (niet meer in je kelder)</span>` : '');
  openSheet(`${sheetHead(esc(r.title || e.dish))}
    <div class="small mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${e.persons} personen${r.time ? ` · ${esc(r.time)}` : ''} · <span class="srcchip">${e.cached ? 'Opgeslagen' : 'Sommelier-AI'}</span>${wijnRow}</div>
    <div class="eyebrow mb8">Ingrediënten</div>
    <div class="panel" style="margin-bottom:14px">${(r.ingredients||[]).map(i => `<div class="rowline" style="padding:6px 0"><span class="a" style="font-size:14px">${esc(i)}</span></div>`).join('')}</div>
    <div class="eyebrow mb8">Bereiding</div>
    ${(r.steps||[]).map((s,i) => `<div style="display:flex;gap:10px;margin-bottom:10px"><span style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</span><span style="font-size:14px;flex:1">${esc(s)}</span></div>`).join('')}`);
}
ACT.recipeOpen = el => {
  const r = (S.recipeCache||[]).find(x => x.key === el.dataset.k);
  if(r) showRecipe({...r, cached:true});
};

/* ---- vraag de sommelier (vrije vraag over wijn/pairing) ---- */
ACT.askSomm = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  if(!aiReady()){ toast('Vragen stellen vergt de AI-sleutel (Meer → Instellingen)'); return; }
  const dish = el.dataset.dish || '';
  openSheet(`${sheetHead('Vraag de sommelier')}
    <div class="small mb8">${esc(w.name)} ${w.vintage||''}${dish?` · bij "${esc(dish)}"`:''}</div>
    <div id="askOut"></div>
    <div class="field"><div style="display:flex;gap:8px">
      <input class="inp" id="askQ" placeholder="bv. past dit bij paddenstoelen?" style="flex:1;min-width:0">
      <button class="btn sm" data-act="askGo" data-id="${w.id}" data-dish="${esc(dish)}" style="flex:none">Vraag</button></div></div>
    <div class="chiprow">${['Moet deze gekoeld?','Decanteren?','Hoe lang van tevoren open?'].map(q=>`<button class="chip" data-act="askQuick" data-q="${esc(q)}">${q}</button>`).join('')}</div>`);
};
ACT.askQuick = el => {
  const i = document.getElementById('askQ'); if(i) i.value = el.dataset.q;
  const b = document.querySelector('[data-act="askGo"]'); if(b) ACT.askGo(b);
};
ACT.askGo = async el => {
  const w = findWine(el.dataset.id); if(!w) return;
  const inp = document.getElementById('askQ');
  const q = ((inp||{}).value||'').trim();
  if(!q){ toast('Typ eerst je vraag'); return; }
  const out = document.getElementById('askOut'); if(!out) return;
  const aid = 'ans' + Date.now();
  out.insertAdjacentHTML('beforeend', `<div class="dishcard"><div class="d">${esc(q)}</div><div class="r" id="${aid}">${pourSvg}</div></div>`);
  if(inp) inp.value = '';
  try{
    const ans = await aiAsk(w, el.dataset.dish||'', q);
    const t = document.getElementById(aid); if(t) t.textContent = String(ans||'').trim();
  }catch(e){
    const t = document.getElementById(aid); if(t) t.textContent = 'Lukte niet: ' + String(e.message||e).slice(0,80);
  }
};
